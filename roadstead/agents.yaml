# Per-agent DRR quota overrides for the centralized LLM proxy.
#
# Each top-level key is an agent_id (matching what the proxy infers
# from /proc/self/cmdline — i.e. the leaf module under
# originfleet.agents.* or originfleet.tools.*). Missing keys fall
# back to AgentQuotaConfig dataclass defaults:
#   weight: 1.0
#   max_balance_ss: 60.0
#   default_priority: P1_TURN_SUPPORT
#
# Override path: set LLM_PROXY_AGENTS_CONFIG=<path> to point the proxy
# at a different file (e.g. for tests). Missing file is non-fatal —
# proxy falls back to lazy-creating defaults.

forum-agent:
  # Voice-neutral periodics (digests, author_memory, themes, song_manifest)
  # default to P3 ingestion band so they yield to sidekick's user turns.
  # Heavy ticks now run with semaphore(2) in-process, so the steady
  # state is up to 2 concurrent LLM calls × ~30s each = ~60 slot-
  # seconds of in-flight cost. 180s of max_balance_ss lets that burst
  # (~3 full-cost calls) before DRR fairness kicks in. Was 120 — bumped
  # 2026-05-27 with the lane Lock→Semaphore(2) upgrade. Weight matches
  # default — forum-agent isn't privileged relative to other agents.
  weight: 1.0
  max_balance_ss: 180.0
  default_priority: P3_INGESTION

# 2026-06-10 data-driven pass (7d /v1/usage?by=agent — the proxy hardening
# uplift). Weights only matter UNDER CONTENTION; the head-of-queue-wait
# starvation rescue already prevents pathology, so these are deliberate
# nudges, not load-bearing knobs.

sidekick:
  # The user-facing companion: 14.7K req/wk, interactive turns. Weight 2 so a
  # user turn wins a contended slot against same-band periodic traffic.
  weight: 2.0
  max_balance_ss: 120.0

orchestrator:
  # The inner tool-calling loop behind live user turns (companion streams,
  # 4.5K req/wk, several calls per turn). Same interactive privilege as sidekick;
  # the larger balance absorbs a multi-iteration turn without DRR throttling
  # mid-conversation.
  weight: 2.0
  max_balance_ss: 120.0

knowledge:
  # The fleet's biggest caller (48.5K req/wk, 35M tokens in) — almost all P3
  # background ingestion that fans out in chunked storms. Default weight (it
  # should NOT be privileged), but a deeper balance so a legitimate
  # extraction burst isn't throttled against its own long-run average; the
  # background band cap still protects interactive headroom.
  weight: 1.0
  max_balance_ss: 240.0
  default_priority: P3_INGESTION


# --- degrade_ok: the tier3 failover opt-IN (§ 9.5) ---------------------------
# When tier3 (`thinker`) is unhealthy, ONLY agents with `degrade_ok: true` are
# rerouted to tier2-analyst; every other caller gets the same clean 503 it gets
# today, now labelled and carrying Retry-After. Absent = false.
#
# 🚨 This set GROWS ONE AUDITED AGENT AT A TIME, through the normal audit cycle
# (audit_dimensions.md § E9). It is not a migration and has no completion date.
# The question each audit answers is "may this agent's tier3 calls be served by
# a smaller model?", and recording a NO is as much of an answer as a yes.
#
# Granularity is per-AGENT by operator decision (2026-08-19), with a known cost:
# an agent doing both conversational and authoring/extraction work is in or out
# as a whole. Where that bites, the EXTRACTION path governs and the agent stays
# OUT — so sidekick, whose chat turns would degrade fine, is not here, because her
# one-shot authoring deliberately wants tier3.

discord:
  # DAY-1 SEED, and deliberately the only one. Chosen so the path runs in
  # PRODUCTION rather than only in the journey — a failover that never fires is
  # the guard-that-reads-green failure class.
  #  * Conversational: its output is retractable by the person replying, which
  #    is the house rule's own test for what may be softened without a code gate.
  #  * ~200 requests/24h — the smallest real blast radius available.
  # Two near-misses, recorded so they are not re-proposed:
  #  * `dj` looks obvious and is NOT: its output is a public broadcast and a
  #    listener cannot undo it by replying.
  #  * `knowledge_store` is the canonical NEVER — 12,570 req and 64.7M input
  #    tokens/24h, all of it extraction into durable state.
  degrade_ok: true

# (Other agents not listed here use AgentQuotaConfig defaults.)
