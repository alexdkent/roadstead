# Per-agent DRR quota overrides.
#
# 🚨 THIS IS AN EXAMPLE, and it is also the default — the same arrangement as
# `models.yaml`. A shipped example that nothing loads rots; this one boots a
# fresh install and is what the suite runs against, so it cannot. Point
# `ROADSTEAD_AGENTS_CONFIG` at your own file for a real deployment. (It said
# `LLM_PROXY_AGENTS_CONFIG` until 2026-09-05 — the pre-rename spelling, which
# `config.env_with_legacy_prefix` still honours WITH A DEPRECATION WARNING, so
# the shipped example was teaching every new reader the name on its way out.)
#
# Each top-level key is an `agent_id` — the caller identity, which is the DRR
# fair-share key. Since 2026-09-01 that identity comes from an API key where one
# is presented (`identity.py`), otherwise from an address registration
# (`ROADSTEAD_ACL`). 🚨 It never comes from the request body: this line used to
# say "or, on `/v1/submit`, from the body", and that door was removed with
# Workstream C precisely because a body could claim any `agent_id` it liked,
# including one with a better weight than its own. However it is established,
# the name here must match it: a rename on either side silently opts the caller
# back out of everything below, with nothing to see.
#
# Missing keys fall back to the AgentQuotaConfig dataclass defaults:
#   weight: 1.0
#   max_balance_ss: 60.0
#   default_priority: P1_TURN_SUPPORT
#
# ⚠️ A key not in `config.load_agent_configs`'s parser is SILENTLY IGNORED —
# adding a knob to AgentQuotaConfig is not enough to make it operator-reachable.
# Guarded by test_failover.py::test_degrade_ok_reaches_agent_config.
#
# --- what the numbers mean ---------------------------------------------------
#
# `weight` only matters UNDER CONTENTION, and the head-of-queue-wait starvation
# rescue already prevents pathology on its own — so these are deliberate nudges,
# not load-bearing knobs. `max_balance_ss` is how much burst a caller may bank
# in slot-seconds before DRR fairness starts to bind: size it from what the
# caller's steady state actually costs (concurrency × typical call duration),
# not from how important it feels.

chat-assistant:
  # A user-facing conversational surface: a human is waiting on every turn.
  # Weight 2 so a user turn wins a contended slot against same-band periodic
  # traffic. The balance covers a normal turn's tool ladder and no more.
  # `degrade_ok` is the failover opt-in — see the section at the foot of this
  # file for why this caller is in the set and what it takes to join it.
  weight: 2.0
  max_balance_ss: 120.0
  degrade_ok: true
  # `spill_ok` is the OTHER opt-in and a SEPARATE judgement — see the spill
  # section at the foot of this file. A human waiting on a turn is exactly who
  # overflow capacity is for, and this caller's prompts are ones the operator is
  # willing to send off the machine.
  spill_ok: true
  # …bounded. Crossing this drops the caller one band and stops its paid spill;
  # it never costs it local capacity and never turns a request into an error.
  daily_spend_usd: 5.0

coding-assistant:
  # Bursty and unattended-ish: several calls per interaction, each long. The
  # deeper balance lets one interaction's burst through before fairness binds;
  # the default weight keeps it from outranking a waiting human.
  weight: 1.0
  max_balance_ss: 180.0
  default_priority: P1_TURN_SUPPORT

summarizer:
  # Periodic background work. P3 so it yields to interactive turns; a balance
  # sized for ~2 concurrent calls of ~30s each (≈60 slot-seconds in flight)
  # with room for a ~3-call burst.
  weight: 1.0
  max_balance_ss: 180.0
  default_priority: P3_INGESTION

extractor:
  # Typically the heaviest caller by volume — chunked ingestion that fans out in
  # storms. DEFAULT weight, deliberately: heaviest is not most privileged. The
  # deeper balance stops a legitimate extraction burst being throttled against
  # its own long-run average, and the background band cap still protects
  # interactive headroom.
  weight: 1.0
  max_balance_ss: 240.0
  default_priority: P3_INGESTION
  # The one caller in this example with a rate threshold, and the shape of
  # caller that wants one: a fan-out ingester is the thing that runs away, and
  # it does so at 3am when there is nobody to be unfair to — which is exactly
  # when DRR does nothing. See the rate section at the foot of this file.
  # 🚨 Set WELL above what a healthy burst does. This is not a capacity plan; it
  # is the number that says "something is wrong", and a threshold tight enough
  # to catch a busy hour will fire on every busy hour and be ignored.
  requests_per_minute: 600.0

hygiene:
  # Lowest-urgency maintenance work — reindexing, backfills, cleanup. It should
  # run only when nothing else wants the slot.
  weight: 1.0
  max_balance_ss: 240.0
  default_priority: P4_HYGIENE


# --- requests_per_minute: the abuse control DRR is NOT ------------------------
# DRR is fairness UNDER CONTENTION. A caller alone on a quiet fleet is
# unthrottled by design — correct for fairness, and exactly why it does not
# bound a runaway. A caller stuck in a loop at 3am contends with nobody and is
# bounded by nothing until somebody else shows up.
#
# 🚨 Crossing this DEGRADES and never rejects, identically to `daily_spend_usd`:
# the caller drops ONE priority band and loses paid spill, and keeps its full
# access to local capacity. There is no error code for it and no 429 — a rate
# LIMIT would be a fourth spelling of "no", and it would put a mistyped
# threshold in a position to take a caller offline. The caller ends up behind
# every caller behaving itself, which is the whole point and is enough.
#
# 🚨 Degradations do NOT stack: a caller over this AND over `daily_spend_usd`
# drops one band, not two. Otherwise adding a second threshold would silently
# double the first one's penalty.
#
# Absent = no threshold, which is the right default and what every caller was
# before this field existed. `0.0` is NOT absent — it is a real threshold
# meaning "this caller should not be sending at all", one keystroke away and a
# very different statement.
#
# Measured over a trailing 60s window (rate.WINDOW_S), keyed on the `agent_id`
# like every other quota — the budget holder is the caller, not the key. To stop
# ONE credential, revoke it; that is instant and already exists.


# --- degrade_ok: the tier3 failover opt-IN (§ 9.5) ---------------------------
# When an endpoint with a declared `failover_to` is unhealthy, ONLY agents with
# `degrade_ok: true` are rerouted to the smaller model; every other caller gets
# the same clean 503, now labelled and carrying Retry-After. Absent = false.
#
# 🚨 This set GROWS ONE AUDITED CALLER AT A TIME. It is not a migration and has
# no completion date. The question each audit answers is "may this caller's work
# be served by a smaller model?", and recording a NO is as much of an answer as
# a yes — a degraded answer is a WORSE answer, and who can absorb one is a
# judgement, never a default.
#
# The test that has held up across every audit: **is the output RETRACTABLE by
# the person reading it?** A conversational turn is — the person who asked is
# the person reading, in the same turn, and can undo it by replying. A public
# broadcast is not, however conversational it looks, because the audience cannot
# reply it away. That distinction is the one most often got wrong.
#
# Granularity is per-CALLER, with a known cost: a caller doing both
# conversational and authoring/extraction work is in or out as a whole. Where
# that bites, the EXTRACTION path governs and the caller stays OUT.

# `chat-assistant` above carries the seed `degrade_ok: true`, and deliberately
# as the only one to start with — so the failover path runs in PRODUCTION rather
# than only in a test. A path that never fires is the guard-that-reads-green
# failure class. It qualifies because:
#  * it is conversational and retractable, per the test above;
#  * its outward-facing ACTIONS are not gated by which model served the turn.
#    Where a caller has a terminal or a browser, the answer to "may a smaller
#    model drive those?" is yes ONLY because the same approval gate stands in
#    front of them either way;
#  * it is not an extraction path — it writes nothing into durable state that a
#    human does not see first.
#
# `extractor` is the canonical NEVER, and is left at the default rather than
# written out as `degrade_ok: false`: everything it produces goes into durable
# state that nobody re-reads, so a quietly worse answer is a permanent one.


# --- spill_ok / daily_spend_usd: paid remote overflow ------------------------
# When an endpoint declaring `spill_to` is FULL, only callers with
# `spill_ok: true` are sent to remote capacity. Absent = false.
#
# 🚨 THIS IS NOT THE SAME QUESTION AS `degrade_ok`, and the two are separate
# flags because neither implies the other:
#
#   * `degrade_ok` asks "may a WORSE model answer this?" — a quality judgement,
#     answered by the retractability test above.
#   * `spill_ok` asks "may this leave the machine, at OUR expense?" — a
#     confidentiality-and-money judgement. A caller whose work degrades happily
#     may still be one whose prompts must never go to a third party; a caller
#     that must have the big model may not care at all where it runs.
#
# The failure modes differ too, which is why the default is even firmer here. A
# bad `degrade_ok` produces a worse answer somebody can read and react to. A bad
# `spill_ok` produces an invoice and a prompt on somebody else's server, and
# neither is recoverable by replying to it.
#
# `daily_spend_usd` bounds it. 🚨 Crossing the cap DEGRADES and never rejects:
# the caller drops one priority band and loses paid spill, and keeps its full
# access to local capacity. Two reasons (docs/roadmap.md): admission control is
# about CAPACITY and not billing, and a misconfigured quota must not be able to
# take a caller offline. Absent = uncapped, which is the right default for a
# deployment where almost nothing costs money. `0.0` is NOT absent — it is a
# real cap meaning "no paid spend at all", one keystroke away and the opposite
# policy.
#
# Only `chat-assistant` opts in above, and deliberately as the only one, for the
# same reason it is the lone `degrade_ok` seed: a path that never fires is the
# guard-that-reads-green failure class. `extractor` is the canonical NEVER here
# as well — the heaviest caller by volume is the one an uncapped spill would
# bankrupt fastest, and its work is the least urgent.
#
# (Any caller not listed here uses the AgentQuotaConfig defaults.)
