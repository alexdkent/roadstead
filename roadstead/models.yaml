    fallback: null
    notes: |
      Cohere-style POST /rerank (not OpenAI). Upstream `infinity-bge-reranker`
      (:9085) is the INTERNAL backend behind this shim — not a public role.
      Moved off anvil 2026-07-30 for hardware/vendor diversity (see `embed`).
      Measured cost, accepted — ROCm's penalty is WORST on small candidate
      lists, which is the common kv4-recall shape:
        5 cand 45.9 -> 133.8 ms | 10 cand 38.5 -> 141.1 ms (3.66x)
        25 cand 99.9 -> 181.7 ms | 50 cand 159.1 -> 335.7 ms
      ⚠️ The nexus venvs are NOT rebuildable from anvil's pip freeze, and the
      two services need CONFLICTING versions — rerank wants transformers 4.57.6
      + numpy 1.26.4, embed wants transformers 5.8.1 + numpy 2.4.5. They live in
      SEPARATE venvs (/opt/rerankenv, /opt/rocmtest/venv) for that reason; do not
      merge them. infinity_emb 0.0.77 also needs a stale `optimum/bettertransformer/`
      tree that PyPI optimum 2.1.0 no longer ships.

