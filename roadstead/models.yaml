# ===========================================================================
# Roadstead catalog — the backends this gateway knows about.
#
# 🚨 THIS FILE IS AN EXAMPLE. The fleet below is invented and its addresses are
# RFC 5737 documentation addresses (192.0.2.0/24), which exist so that nobody
# mistakes them for real ones. The SCHEMA is Roadstead's contract; the DATA is
# yours. Point ROADSTEAD_MODELS_YAML at your own file and this one stops being
# loaded.
#
# It is also what the test suite runs against, so it is a worked example that
# stays correct rather than a snippet in a README that rots.
#
# ---------------------------------------------------------------------------
# TWO SECTIONS, AND THE SPLIT IS THE POINT
#
#   providers:  HOW TO REACH A BACKEND, AND HOW TO SPEAK TO IT.
#               One entry per backend process or remote service: its engine
#               (which adapter in roadstead/providers/ drives it), its address,
#               and its credential if it needs one.
#
#   endpoints:  A ROUTABLE UNIT OF CAPACITY, WITH POLICY.
#               Slots, per-slot context, timeout floors and ceilings,
#               capabilities, band behaviour, failover. Each names the provider
#               it lives behind.
#
#   intents:    THE CALLER-FACING VOCABULARY. Optional, and layered over the
#               built-in profiles rather than replacing them. See the section
#               itself, below `hosts:`.
#
# A local provider hosts ONE endpoint, because a llama.cpp or vLLM server serves
# one model. A remote provider hosts MANY, because it fronts a catalogue and the
# base URL and credential are the same for all of them. Declaring the connection
# once is the whole reason these are two sections and not one flat list.
#
# ---------------------------------------------------------------------------
# PROVIDER FIELDS
#   engine        llama.cpp | vllm | openrouter | shim
#                 Resolved to an adapter in roadstead/providers/. An unknown
#                 value falls back to llama.cpp rather than failing, so a typo
#                 degrades to the common shape instead of taking an endpoint
#                 offline. `shim` is a non-OpenAI FastAPI service (embed /
#                 rerank) — it resolves to llama.cpp and pairs with
#                 policy.skip_discovery.
#   host, port    Local address. `host` may name a key in the `hosts:` table
#                 below, or be a literal address.
#   base_url      General address; WINS over host/port and is the only form
#                 that can carry a scheme or a base path. Remote providers.
#   api_key_env   The NAME of the environment variable holding the API key.
#                 🚨 NEVER the key itself — a key in this file is a key in the
#                 git history. Read at request time, so rotating the secret
#                 needs no restart.
#
# ENDPOINT FIELDS
#   The YAML key IS the endpoint class: what callers address, what the
#   scheduler accounts against, and what telemetry is keyed on.
#
#   provider          which provider serves it
#   kind              chat | embed | rerank
#   status            active | on_demand | planned | retired
#                     Only active and on_demand are ROUTED. `planned` documents
#                     a name and a shape without dispatching to it.
#   role              telemetry/model role string (defaults to the class)
#   aliases           every legacy or shorthand name that must resolve here
#   model             for a provider fronting a CATALOGUE, the slug to route on.
#                     Ignored for a provider that serves one model and names it
#                     — that is discovered, and a config copy would go stale in
#                     silence.
#   slots             max_slots SEED. Discovered at runtime where the engine
#                     publishes it (llama.cpp); config-authoritative where it
#                     does not (vLLM, and every remote provider).
#   context_per_slot  seed; live value comes from discovery where available
#   timeout_floor_s   per-class floor — the ENFORCED authority, seeding
#                     TimeoutModel. A thin sample can never produce a deadline
#                     below it.
#   timeout_ceiling_s per-class override of the adaptive-timeout upper bound
#   stream_hard_cap_s per-class override of the ABSOLUTE cap on a PROXY-CHOSEN
#                     streaming deadline being extended by token progress.
#                     Never applies to an explicit caller deadline.
#   decode_tok_s      conservative decode rate, output tokens/sec, for the SLOW
#                     TAIL of real contended traffic — a low percentile of
#                     observed tok/s, never a single-stream idle benchmark.
#                     An idle number is roughly 2x optimistic (a caller sharing
#                     the endpoint gets about half of it) and produces a floor
#                     too low to catch the failure it exists to prevent.
#                     Optional and absent by default (0.0) — a MEASUREMENT of
#                     this class on your fleet, never a number to guess. Seeds
#                     TimeoutModel's decode-rate floor: `recommended` is never
#                     advised below (est_out / decode_tok_s) x margin, so a
#                     thin/absent sample cannot hand back a deadline the call
#                     physically cannot meet at any load. A class with no
#                     `decode_tok_s` gets no floor at all — behaviour for it is
#                     unchanged.
#   failover_to       endpoint class to degrade to when this one is unhealthy.
#                     Ignored unless the target is itself routed.
#   spill_to          endpoint class to spill to when this one is FULL. A
#                     DIFFERENT question from failover_to: that one is "this
#                     backend is down, may a smaller model answer", this one is
#                     "this backend is busy, may we pay somebody else to answer
#                     now". Also ignored unless the target is routed, which is
#                     what makes pointing at a `planned` remote endpoint inert
#                     rather than a 502 the first time the local tier fills up.
#   policy.input_usd_per_mtok / output_usd_per_mtok
#                     Operator-DECLARED price, USD per MILLION tokens. Beats a
#                     provider-published one — an operator who wrote a number
#                     down knows something the catalogue does not (a negotiated
#                     rate, an internal chargeback). Absent = fall back to
#                     discovery, then to usage_rates.py's imputed avoided cost.
#   capabilities.*    vision | reasoning | streaming | tool_calling |
#                     structured_output
#   policy.*          EndpointConfig knobs — see _POLICY_PASSTHROUGH in
#                     model_catalog.py. ⚠️ A policy key that is not in that
#                     tuple is SILENTLY DROPPED.
#
# INTENT FIELDS
#   kind, requires, prefer, summary. See the `intents:` section below.
# ===========================================================================

hosts:
  # An indirection so an address changes in one place. Optional: a provider may
  # put a literal address in `host` instead.
  llm-small: 192.0.2.11
  llm-mid: 192.0.2.12
  llm-large: 192.0.2.13
  llm-util: 192.0.2.14


# ===========================================================================
# intents:  WHAT A CALLER MAY ASK FOR, IN WORDS THAT ARE NOT ENDPOINT NAMES
#
# A profile bundles a `kind`, a set of required `capabilities` and a ranking
# `prefer` under one caller-facing name, so a request says `intent: "reasoning"`
# and Roadstead owns which model that is. `GET /rs/v1/models` publishes this
# table, which is where a caller should read it rather than from any document.
#
# 🚨 PROFILES ARE EXPRESSED IN DECLARED CAPABILITIES, NEVER ENDPOINT NAMES.
# There is no field here that can name one, and that is the design rather than
# an omission: a profile naming endpoints would be a SECOND ROUTING TABLE to
# keep in step with `endpoints:` below, and it would break the moment a fleet's
# classes are spelled differently from this example's. A caller that needs to
# refuse one specific endpoint says so per request (`exclude`, docs/api.md
# §1.7.1) — that is one caller's words about one call, not a table.
#
# LAYERED, NOT REPLACED. Nine profiles ship built in (`BUILTIN_PROFILES` in
# intent.py). Anything here is added to them, and a stanza whose name matches a
# built-in OVERRIDES it — which is how a fleet says its `reasoning` means
# something particular. The override is disclosed: each profile is published
# with a `source` of "builtin" or "models.yaml", because a caller reading our
# documentation for a word this fleet redefined has no other way to notice.
#
# ⚠️ A stanza that cannot be satisfied by ANY endpoint — an unknown capability,
# kind or preference — is REFUSED rather than offered, with a config notice
# readable at `GET /rs/v1/admin/config`. A caller then gets "unknown intent",
# which points at the vocabulary, instead of "no endpoint satisfies …", which
# points at the fleet and is the wrong place to look.
#
# The one below is additive — it names no built-in — so this file exercises the
# parser on every boot rather than documenting a path nothing runs.
# ===========================================================================

intents:
  bulk:
    kind: chat
    # Nothing is waiting on this, so the useful question is not "which is
    # fastest" but "which has room right now".
    prefer: capacity
    summary: A batch turn nobody is waiting on — take whatever has room.


providers:

  small-box:
    engine: llama.cpp
    host: llm-small
    port: 9091
    notes: >
      A small always-resident model on modest hardware. llama.cpp publishes
      real slot counts and per-slot context on /props, so this endpoint's
      capacity is DISCOVERED and the seeds below are only a cold start.

  mid-box:
    engine: llama.cpp
    host: llm-mid
    port: 9196

  large-box:
    engine: vllm
    host: llm-large
    port: 8000
    notes: >
      vLLM publishes max_model_len and nothing else about capacity —
      --max-num-seqs is not on the API — so `slots` here is
      CONFIG-AUTHORITATIVE, with policy.documented_max_num_seqs mirroring the
      launch flag so the drift reconciler can notice a disagreement.

  embed-shim:
    engine: shim
    host: llm-util
    port: 9087

  rerank-shim:
    engine: shim
    host: llm-util
    port: 9084

  openrouter:
    engine: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    notes: >
      One remote provider, many endpoints — the reason providers and endpoints
      are separate sections. Its endpoints are `planned` below: they document
      the shape without being routed, because a deployment that has not set
      $OPENROUTER_API_KEY should not have an endpoint in its routing table that
      cannot serve. Flip one to `active` once the key is in the environment.
      🚨 Remote capacity is not local capacity: a remote provider publishes no
      occupancy, so `slots` there is a policy cap on OUR OWN concurrency, not a
      discovered capacity.


endpoints:

  tier1:
    provider: small-box
    kind: chat
    role: tier1
    aliases: [router, small, fast-chat, classify]
    slots: 4
    context_per_slot: 16384
    timeout_floor_s: 60
    capabilities:
      reasoning: true          # → forces_reasoning: llama.cpp has no proxy-side
                               #   kill switch, so this model's CoT is
                               #   unconditional and the submit path reserves
                               #   answer headroom on top of the caller's cap.
      streaming: true
      tool_calling: true
    policy:
      fast_path_reserve_slots: 1
      documented_max_num_seqs: 4

  tier2:
    provider: mid-box
    kind: chat
    role: tier2
    aliases: [chat, analyst]
    slots: 6
    context_per_slot: 262144
    timeout_floor_s: 120
    # 🚨 NO timeout_ceiling_s, deliberately, and no vision. This is the
    # conversational lane: interactive turns only, so it takes the interactive
    # band (600s) rather than the long-form one. "No 1,800-second jobs on the
    # chat lane" is a property enforced HERE, at the timeout layer, rather than
    # asserted in a plan — and `tier3` below is its counterpart. Collapsing the
    # two would make the vision gate and the ceiling split both untestable.
    capabilities:
      streaming: true
      tool_calling: true
      structured_output: true
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 2
      # A llama.cpp weights fingerprint: /v1/models publishes `meta`, which the
      # proxy folds into this short stable string. Compared for EQUALITY against
      # what discovery finds — never parsed.
      model_fingerprint: params=27000000000;vocab=151936;ftype=Q4_K - Medium
      readiness_critical: true # THE conversational lane, singular: /readyz
                               # fails closed when this one is unhealthy.
      thinking_kwargs: [enable_thinking]

  tier3:
    provider: large-box
    kind: chat
    role: tier3
    aliases: [reasoner, thinker, composer, creative, vision]
    slots: 6
    context_per_slot: 131072
    timeout_floor_s: 180
    timeout_ceiling_s: 1800    # long-form work runs here, on an interactive
                               # tier: a generous upper bound that overrides the
                               # band. The counterpart to tier2's absence of one.
    failover_to: tier2         # degrade to the mid tier, never chain further.
    spill_to: spill-reasoning  # …and when it is merely BUSY, pay for overflow.
                               # 🚨 Both, deliberately, on the same endpoint:
                               # they answer different questions and the day
                               # this tier is down is not the day it is full.
                               # INERT as shipped — `spill-reasoning` is
                               # `planned`, so this resolves to nothing until
                               # somebody flips it to `active`. That is the
                               # point: the intent is declared here, and setting
                               # $OPENROUTER_API_KEY plus one status change is
                               # the whole of turning it on.
    capabilities:
      vision: true             # an mmproj / vision tower is loaded. DEFAULTS
                               # FALSE elsewhere on purpose — a stanza that
                               # forgets it gets a warning, never an outage.
      reasoning: true          # vLLM CAN switch reasoning off, so this does NOT
                               # set forces_reasoning — the proxy defaults the
                               # switch below to false and reasoning is opt-in
                               # per call.
      streaming: true
      tool_calling: true
      structured_output: true
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 1
      documented_max_num_seqs: 6
      failover_dwell_s: 120
      # 🚨 The spelling is per MODEL FAMILY, not per engine — it is a
      # chat-template variable. Declaring both names is right for a family whose
      # template reads either; declaring the wrong one makes thinking a silent
      # no-op. Never hardcode it.
      thinking_kwargs: [thinking, enable_thinking]
      # Fraction of max_tokens reasoning may consume. 🚨 This is a DECLARATION
      # OF A LAUNCH FLAG, not a tuning knob: vLLM 400s the entire request if
      # `thinking_token_budget` arrives at a server started without
      # `--reasoning-config`. Set it only if that flag is on the serve command.
      thinking_budget_ratio: 0.6
      # A vLLM weights fingerprint: /v1/models publishes `root`, the weights
      # PATH — not `id`, which is the operator's --served-model-name and stays
      # put across a swap, so an alert keyed on it could never fire.
      #
      # 🚨 Declaring a thinking switch WITHOUT a fingerprint is the half of the
      # pair that cannot notice it went stale: the switch is a claim about a
      # model, and nothing else would tell you the model changed underneath it.
      # test_model_swap_guards.py pins that they travel together. Change this
      # when you change the weights — an alert on first start means the
      # declaration and the backend already disagree, which is the alert working.
      model_fingerprint: /srv/models/example-reasoner-2026-01

  embed:
    provider: embed-shim
    kind: embed
    role: embed
    aliases: [embeddings]
    slots: 4
    context_per_slot: 8192
    timeout_floor_s: 15
    policy:
      skip_discovery: true     # a FastAPI shim with no /props and no
                               # /v1/models: without this the poller 404s both
                               # probes every cycle, forever.

  rerank:
    provider: rerank-shim
    kind: rerank
    role: rerank
    slots: 1
    context_per_slot: 8192
    timeout_floor_s: 10
    policy:
      skip_discovery: true
      background_floor_pct: 0.0

  # --- remote spill, documented but not routed (see the provider's notes) ----

  spill-chat:
    provider: openrouter
    kind: chat
    status: planned
    model: openai/gpt-oss-120b
    # No declared price: OpenRouter publishes one per model and capacity
    # discovery reads it, which is the arrangement to prefer — a price written
    # here is a price that goes stale silently the next time the upstream
    # reprices. Declare one only to override what is published.
    slots: 4
    context_per_slot: 131072
    timeout_floor_s: 120
    capabilities:
      streaming: true
      tool_calling: true

  spill-reasoning:
    provider: openrouter
    kind: chat
    status: planned
    model: deepseek/deepseek-r1
    slots: 2
    context_per_slot: 163840
    timeout_floor_s: 180
    capabilities:
      reasoning: true
      streaming: true
