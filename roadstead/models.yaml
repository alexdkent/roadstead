    # `--cache-ram 32768` (host-RAM prompt cache, was the 8 GiB default) added the same day:
    # the log showed 3,545 evictions of 300-900 MiB entries — repeat-prefix callers (beacon
    # subagents) were losing warm prefixes to churn. Host RAM only (box has ~122 GB free).
    #
    # 🚨 THREE THINGS THAT MUST NOT BE CHANGED CASUALLY:
    #  1. `enable_thinking:false` is the fleet DEFAULT because analyst/classify/vision callers
    #     don't want CoT. (The old claim here — that thinking-on breaks response_format via
    #     #20345 — was STALE: fixed upstream 2026-03-10, re-measured 2026-08-23; grammar binds
    #     with thinking on. Thinking is opted into per request; see the serve script.)
    #  2. Q4_0 not Q4_K_M. For a DENSE model on SYCL, Q4_0 decode is 26% faster — the INVERSE
    #     of the MoE law recorded in memory `reference_boxa_backend_and_moe_fit`.
    #  3. Stay on SYCL: measured 1.9x prefill / 1.5x decode over Vulkan on this card (§8.1h).
    #  4. `--kv-unified` is REQUIRED — it makes `-c` ONE shared pool across the 6 slots
    #     instead of a per-slot allocation demanding 6x the memory.
    kind: chat
    status: active                  # PINNED always-resident on the boxa. Standalone docker container `llamacpp-creative-boxa` (--restart always) on :9196 — no dispatcher/systemd; proxy dispatches directly, capacity self-discovered via /props. Launched by infra/nasbox-vllm-xpu/serve_creative_llamacpp.sh, which is the canonical config. Since the 2026-08-19 Phase 4 swap it runs ONE Qwen3.8-27B DENSE container (+mmproj) backing TWO lanes — `creative` (long-form/song authoring) and the `classify`/`analyst`/vision family — plus bare `tier2`. HISTORY: it backed a THIRD role, `companion-lite` (the chat loop), until Phase 3 moved that to jetty the same day; before 2026-07-11 the box ran a Trinity-Mini/Gemma-4-26B two-container split and classify lived on the anvil llama-classify.service (stopped). Not evictable (dedicated card).
    proxy_endpoint: true
    # 🚨 NAMING — THIS ENDPOINT'S NAME IS `tier2-analyst` (the key above). The two
    # `creative` strings below are the RETIRED name and are DELIBERATELY KEPT.
    # Read this before "cleaning them up": each is load-bearing for a different
    # reason, and neither is cosmetic.
    #
    #   endpoint_class — the proxy's endpoint IDENTITY. It is what `/v1/status`
    #     keys, what `/v1/timeouts` reports, and what is PERSISTED into every
    #     `proxy_completions` / `proxy_timeouts` row. Renaming it is a DATA
    #     MIGRATION, not a rename: `usage_rates.py` must keep resolving the old
    #     string or billing queries over historical rows raise on an unknown
    #     endpoint (that file says so itself), this endpoint's cost history would
    #     split across two names exactly like the real 2026-08-19 tier2-chat
    #     split did — but here describing ONE lane, not two — and
    #     `knowledge_store/roles.py:PRODUCTION_CHAT_CLASSES` is a hardcoded frozenset
    #     that would silently lose a production class.
    #   role — the PRE-DISCOVERY wire model id (`effective_model_id` =
    #     `served_model_id or role`). The boxa container is launched `-a creative`,
    #     so before /v1/models discovery populates `served_model_id` this is the
    #     only correct value to send; renaming it would 400 the backend in exactly
    #     the window where nothing else can tell you why.
    #
    # CONSEQUENCE, and it has already misled a session (2026-08-23): every raw
    # proxy surface reports the RETIRED name, so anyone reading /v1/status or the
    # timeouts ledger and repeating what it says will quote `creative`. The
    # DISPLAY layer is already correct — `cache_stats.chat_endpoint_labels()`
    # derives from this entry's key and yields `creative -> tier2-analyst`, which
    # is what the Inference page shows. Pinned by
    # `test_tier2_analyst_naming_doctrine.py`.
    endpoint_class: creative
    role: creative
    # 🚨 `tier2-analyst` MUST be listed here even though it is the entry's KEY. The proxy's
    # dispatch map comes from build_role_aliases(), which iterates `aliases` ONLY and maps each
    # to `role:` — the catalog key never enters it. Measured 2026-08-18: with the key alone, a
    # live call for role `tier2-analyst` got `404 unknown_endpoint` (known: creative, embed,
    # gemma, rerank, thinker) while `creative`/`tier2` answered fine. cat.canonical() resolving
    # the name is NOT evidence that the proxy will route it.
    aliases: [tier2-analyst, creative, tier2, deckard, deckard-31b, qwen-classify, classify, analyst-vision, qwen-vision-8b, qwen-vision-9b, vision-8b, qwen-analyst, analyst]   # 🚨 SPLIT 2026-08-19 (Phase 3): `companion-lite`, `chat` and `nexus-chat` LEFT this list for `tier2-chat` on jetty. What remains is the ANALYST lane — the creative/long-form voice plus the whole classify/analyst/vision family (re-homed off anvil :9092 in the 2026-07-11 consolidation). All pure ALIASES of the single endpoint so no caller changes AND slots aren't double-counted (two stanzas at one URL would double-count the 6 slots). deckard/deckard-31b are HISTORICAL anvil NVFP4 rollback aliases (the deployed model is NOT a DECKARD finetune). `creative` became an alias in the 2026-08-18 rename. ⚠️ Bare `tier2` DELIBERATELY STAYS HERE (operator decision, re-affirmed 2026-08-19 at the cutover) — it has live callers that are NOT chat: discord attribution/self-state/nightshift/arc (agents/discord/_common.py), sidekick/song_studio.py:425, discord_schema_smoke, llm_benchmark, external_facade and ~10 tools. Re-pointing a live alias at a different model is the exact July `companion` failure, so Discord's chat turn was given its OWN role (`tier2-chat`) instead of `tier2` being moved under everybody else.
    host: nasbox
    port: 9196
    backend_engine: llama.cpp
    probe_kind: llama
    served_model_names: [creative, deckard-31b, deckard]   # `creative` = the LIVE boxa llama.cpp server (-a creative); `deckard`/`deckard-31b` = the DORMANT anvil rollback (serve_deckard.sh, on anvil) — declared so the naming-doctrine test covers them. `companion-lite` is a ROUTING alias, NOT a served -a name — the container runs `-a creative`.
    model_family: Qwen3.8-27B — DENSE 27B, 3:1 hybrid (48 Gated-DeltaNet linear-attention + 16 full-attention), natively multimodal, Q4_0 GGUF
    quant: Q4_0                      # NOT Q4_K_M — the dense law inverts the MoE law on SYCL (see above)
    params: {total: 27B}             # dense: no active/total split
    context_per_slot: 262144         # llama.cpp `-c 262144 --parallel 6 --kv-unified` — ONE SHARED 262,144-token pool (the model's full native context), NOT a per-slot allocation: it bounds the SUM of live conversations. Sized by measurement 2026-08-19, never inherited — the incumbent's 393216 does not fit this model and degraded the endpoint to ~3 tok/s with /health green. Three things bought this pool, largest first: dropping MTP (auto-fit 59,648 -> 206,592), q8_0 KV instead of f16 (-> 262,144, measured free on this DENSE model though it was slower on the MoE), and dropping -b 8192 -ub 4096. Verified at this size with 6 CONCURRENT 3-image requests (41s, all correct — faster than the same test at 131,072, because more KV means less eviction).
    context_window: 32768            # fleet chunkers size against 32K on purpose (policy, not slot size) — same policy classify used, so re-homing classify here changes no chunk sizing
    slots: 6                         # llama.cpp --parallel 6 — 🆕 RAISED 4 -> 6 on 2026-08-30 by taking the mmvq_cap ceiling patch OFF THE SHELF (operator decision: beacon subagent capacity). The bound is unchanged in KIND: slots x (1 + n_draft) must stay <= the ggml-SYCL MMVQ ceiling, which the forked image `llamacpp-boxa:mmvq32` raises to 32 via env GGML_SYCL_MMVQ_MAX_BATCH=32 (6 x 2 = 12 <= 32). 🚨 ON THE STOCK :server-intel IMAGE THE CEILING IS 8 AND 6 SLOTS + MTP IS A THROUGHPUT DISASTER (~80% decode loss past the cliff, /health green throughout) — if this endpoint is ever rolled back to a stock image, slots must drop to 4 IN THE SAME CHANGE. Patch, rebuild recipe, gates and raw numbers: infra/nasbox-vllm-xpu/mmvq_cap/ + docs/boxa_speculative_decoding_2026-08.md. The shadow reconciler warns if this drifts from actual --parallel.
    timeout_floor_s: 120            # compromise: this endpoint serves BOTH long creative song-compose AND latency-sensitive classify/vision/tool calls. 120s min-budget; adaptive surge×size widens to the ceiling for big song-compose, and a stuck call fails in ~120s instead of 900s. (mirrors timeout_model FLOOR_S["creative"] — bump BOTH in lockstep.) The chat-loop half of this compromise left with `companion-lite` on 2026-08-19; held at 120 through the cutover so a latency reading is not confounded by two changes at once — re-derive at Phase 5.
    timeout_ceiling_s: 1800         # inherently long-running (long-form gen); a role override so the generous background band applies on EVERY tier (song-compose runs at an interactive tier). Adaptive surge×size widens up to here.
    policy:
      # The identity of the WEIGHTS behind this endpoint, checked every poll
      # against what the backend actually reports (backend.probe_model_fingerprint).
      # Mismatch raises the `model_fingerprint_drift` WARNING.
      #
      # 🚨 THIS IS THE GUARD THAT WOULD HAVE CAUGHT 2026-08-23. Every
      # model-dependent line on this stanza — thinking_kwargs,
      # thinking_budget_ratio, disable_any_whitespace, documented_max_num_seqs,
      # model_family — is a claim about specific weights, and the served model
      # id CANNOT detect the weights changing (tier3 answers to the fixed alias
      # `llama-thinker` whatever is loaded behind it). Measured live 2026-08-24.
      # llama.cpp reports a `meta` block; `n_params` is the field carrying the signal — this
      # box went 35B-A3B MoE -> dense 27B on 2026-08-19, i.e. 34660610688 -> 27320697856.
      #
      # UPDATE THIS IN THE SAME EDIT AS THE MODEL. A stale value here is loud
      # (an alert), which is the entire point — the previous failure was silent.
      model_fingerprint: "params=27320697856;vocab=248320;ftype=Q4_0"
      # Qwen3.8's template reads ONLY `enable_thinking`, same as tier2-chat —
      # measured 2026-08-24 against this endpoint: `enable_thinking:true` ->
      # 2,913 chars of reasoning in a separate field with clean `content`, while
      # `thinking:true` is a silent no-op (0 chars). Reasoning SEPARATES
      # correctly here, so the opt-in is genuinely available on this endpoint —
      # it just was not reachable before 2026-08-24 (`apply_thinking` returned
      # early on every non-vLLM engine).
      #
      # No proxy-side default injection: launched with
      # `--chat-template-kwargs '{"enable_thinking":false}'`. See tier2-chat.
      thinking_kwargs: [enable_thinking]
      background_floor_pct: 0.0
      fast_path_reserve_slots: 2     # 2 of SIX slots again since 2026-08-30 (the 2026-08-21 slot drop made it 2 of 4), so background concurrency is back to 4 — which is the point of the six-slot raise: beacon subagent work rides the background band. The interactive GUARANTEE (the classify/analyst/vision family, discord's attribution+self-state gates, the ~10 tool callers on bare `tier2`) keeps its 2 reserved slots so none is head-of-line blocked behind background work. If interactive p95_wait rises under sustained subagent load, raise this to 3 before touching slots.
      # llama.cpp --parallel. Keep EQUAL to `slots: 6` above; the shadow reconciler warns on drift.
      documented_max_num_seqs: 6
      # 🚨 `readiness_critical` LEFT THIS STANZA 2026-08-19, in the same commit as the alias
      # move — it is now on `tier2-chat`. It marks the CONVERSATIONAL role, and after the split
      # this box no longer serves one: it serves creative/long-form authoring plus the
      # classify/analyst/vision family. 503-ing fleet readiness because song-compose or a
      # classify extract is down is a different, wrong claim — which is also why the flag was
      # never derived from `kind: chat` (that spans tier1 router through tier3 reasoner).
      # Exactly one endpoint may carry it; test_exactly_one_endpoint_is_conversational pins that.
    capabilities:
      vision: true                  # mmproj loaded (mmproj-bf16.gguf, 861 MB) — classify's vision callers (attachments stage-2, knowledge_store intake, browser_broker perceive./vision.) route here now. 🚨 The old "verified 2026-07-11: perfect OCR + shape/number extraction, ~79 t/s vision decode" claim was measured on the Qwen3.6-35B-A3B MoE that this endpoint STOPPED serving at the 2026-08-19 Phase-4 swap — it is not a current number for the dense Qwen3.8-27B and is REMOVED rather than carried. Vision correctness was re-gated at the swap (see docs/tier2_split_architecture_2026-08.md §8.1a-i); vision THROUGHPUT on the dense model has not been re-measured. Text decode on the current model is 26-39 tok/s single-stream (docs/tier_benchmark_baseline_2026-08.md, 2026-08-26).
      streaming: true
      reasoning: false              # Describes the SERVER DEFAULT, not a model limit: Qwen3.8 IS a reasoning checkpoint and CoT is disabled via `--jinja --chat-template-kwargs '{"enable_thinking":false}'` (VERIFIED 2026-08-19: 0 reasoning_content). Callers opt IN per request — dsh's `tier2-analyst-think` does. 🔴 The trailing claim here ("llama.cpp #20345 silently disables enforcement on this family when thinking is on") was STALE and is REMOVED: #20345 was fixed 2026-03-10 (PR #20223), five months before this endpoint's b10499. Re-measured 2026-08-23 on the live endpoint, a forced-enum probe stayed CONSTRAINED with thinking on at both xhigh and low (N=1 per arm, one small enum schema — enough to refute "silently disabled", not to certify every schema). 🚨 Thinking on WITHOUT `reasoning_effort` means `xhigh`, the model's maximum: the template does `reasoning_effort|default('xhigh')`. Legal values xhigh/medium/low; anything else raises and errors the request. See the serve script's constant 5.
      tool_calling: grammar         # GBNF grammar-constrained. Qwen3.8 also ENFORCES `tool_choice: required`, which the Qwen3.6 incumbent did not (measured 2026-08-19); abstains correctly on tool_choice auto.
      structured_output: grammar    # llama.cpp GBNF / response_format json_schema. NOTE: give structured calls a generous max_tokens.
    token_speed: {note: "Qwen3.8-27B dense Q4_0 on the boxa (forked llamacpp-boxa:mmvq32 = b10499 + mmvq_cap.patch), 🆕 6 slots + MTP speculative decoding since 2026-08-30 / 262144 shared kv-unified pool, q8_0 KV, cache-ram 32768. Measured live on the DEPLOYED config at the 2026-08-30 cutover, aggregate decode tok/s at concurrency 1/2/4/6: 38.8 / 61.1 / 79.6 / 87.6, draft acceptance 74-81% (reproduces the 08-21 shelf numbers within 2%). ⚠️ A staggered-arrival workload measures LOWER (71.7 at c6 with overlapping prefills) — the clean-wave number is a ceiling, not a promise. -ub 4096 was RE-TESTED at this config 2026-08-30 and REJECTED: prefill +14-23% but decode -12-16% with a GTT-spill fit warning, and it would double the prompt-cache reuse floor to ~4100 tokens. Prior 4-slot stock-image config (2026-08-21..30): 38.4 / 62.7 / 76.0 / 82.8 at c1-4, queueing above 4. SUPERSEDED PRE-2026-08-21 NUMBERS, kept for comparison: prefill 624 tok/s @2K, 810 @8K; decode AGGREGATE 23.7 tok/s at 1 stream -> 64.4 at 6 (per-stream 26.6 -> 12.0). Why 4 slots and MTP together: the '2.6x worse at six' measurement is real, but its cause is ggml-SYCL's 8-column MMVQ limit, NOT batching (corrected 2026-08-21, see docs/boxa_speculative_decoding_2026-08.md). Above ne[1] = slots x (1+n_draft) = 8 the backend dequantizes the whole weight tensor per call per layer, and the SAME cliff fires with spec decode OFF at 9 concurrent (76.6 -> 13.6 tok/s). '--parallel 4 --spec-draft-n-max 1' holds ne[1] <= 8 by construction. The old claim that MTP's draft state was the single biggest consumer of KV headroom is ALSO wrong: that cost scaled with SLOTS, and at 4 slots the full 262,144 pool still fits with MTP on. 🚨 SINGLE-STREAM, measured 2026-08-26 through the llm_benchmark harness: decode 26-39 tok/s, cold prefill 619-856 tok/s, cold TTFT 1.4s at 860 input tokens rising to 15.6s at 13,387 — this is the fleet's SLOWEST generative tier, and any guidance calling 'creative' one of the faster tiers predates the Phase-4 swap. See docs/tier_benchmark_baseline_2026-08.md. An aggregate decode number is NOT what one caller feels, and a single-stream number is NOT this endpoint's throughput — it serves four."}
    purpose: |
      The boxa analyst model — ONE Qwen3.8-27B dense (+mmproj) serving TWO lanes: (1) the
      creative / counterpoint generative voice (songs, DJ patter), and (2) the fleet
      text-classify + VISION tier (classify/analyst family). Bare `tier2` also lands here.
      🚨 It no longer serves the chat loop: `companion-lite` left for `tier2-chat` on jetty at
      the 2026-08-19 Phase 3 cutover, and the model itself was swapped off Qwen3.6-35B-A3B at
      Phase 4 the same day. This box is the fleet's ONLY vision tier — jetty has no mmproj.
    when_used:
      - sidekick song authoring (theme/hook/expand), dj crew speaker voice
      - discord attribution / self-state / nightshift / arc gates and ~10 tools, via `tier2`
      - (NOT the inner chat loop — `companion-lite` moved to jetty 2026-08-19)
      - Tier-1.5/Tier-2 text classification (sidekick.extract_pad fallback, temporal.daily_summary, mail-agent.email_recent_overview, orchestrator.autonomous_chat-agent.reflect, forum-agent.peer_playbook) via the classify alias
      - attachments stage-2 full-resolution image extraction; knowledge_store ground-truth PII/document intake; browser_broker vision-routed capabilities (perceive./vision./insurance./portal.) via the vision aliases
    # 🚨 LITERAL null, and it must stay null (2026-08-20, § 9). This stanza said
    # `tier3_backup` for the same reason `reasoner` did — as advisory metadata
    # naming an endpoint that was `proxy_endpoint: false` and could not serve.
    # Now that `fallback:` actually routes, a value here would ARM a
    # tier2-analyst → somewhere failover that was never designed, decided or
    # tested. Only ONE direction is authorised: tier3 → tier2-analyst.
    #
    # In particular do NOT set `thinker` to make it reciprocal. This endpoint is
    # the failover TARGET; pointing it back at the source declares a pair that
    # reads as a loop to anyone auditing it, and the case it appears to solve —
    # both endpoints sick — is already handled (failover refuses to enter
    # degraded mode when the target is unhealthy, and never chains a second hop).
    fallback: null
    notes: |
      🚨 CURRENT STATE (re-stated 2026-08-26 — the paragraphs below this one had gone stale in the
      present tense through TWO swaps, while every structured field on this stanza was kept correct).
      DEPLOYED MODEL: dense `Qwen3.8-27B`, Q4_0, NOT abliterated — swapped in at Phase 4 on
      2026-08-19, replacing the abliterated (Heretic) Qwen3.6-35B-A3B MoE. Live fingerprint
      `params=27320697856;vocab=248320;ftype=Q4_0` (verified against /v1/status 2026-08-26).
      SERVING: 4 slots (`--parallel 4`) with MTP speculative decoding ON since 2026-08-21, one
      shared `-c 262144 --kv-unified` pool, q8_0 KV — NOT the 6 slots / 393216 / f16 KV described
      below. See `slots:` above for why 4 is a CORRECTNESS bound, not a capacity choice.
      ROLES: `creative` + the `classify`/`analyst`/vision family + bare `tier2`. `companion-lite`,
      `chat` and `nexus-chat` LEFT this endpoint at Phase 3 (2026-08-19) for `tier2-chat` on jetty
      — the orchestrator inner chat loop is NOT served here any more.
      PERFORMANCE: 26-39 tok/s single-stream decode, 619-856 tok/s cold prefill — the fleet's
      SLOWEST generative tier (docs/tier_benchmark_baseline_2026-08.md, 2026-08-26). Do not quote
      the MoE-era 86-97 tok/s / 817-1501 tok/s figures for this endpoint.
      Still true across both models: ONE standalone always-on docker container
      `llamacpp-creative-boxa` (`ghcr.io/ggml-org/llama.cpp:server-intel`, SYCL/level_zero:0,
      --restart always) on the Intel Arc Pro boxa (10.0.0.10:9196); ALL non-`creative` roles are
      ALIASES of this one endpoint, and keeping ONE stanza at ONE URL keeps slot accounting correct
      (two stanzas at one URL would double-count). Reasoning DISABLED via `--jinja
      --chat-template-kwargs '{"enable_thinking":false}'` (re-verified 2026-08-19: 0
      reasoning_content). llama.cpp disables `--cache-reuse` when an mmproj is loaded (logged at
      boot); cross-turn token reuse is off, but `--slot-prompt-similarity 0.5` still routes each
      request to its warm slot. NO dispatcher, NO systemd — docker owns lifecycle; depends on the
      /mnt/cache/llm mount.
      ── HISTORICAL, describing the 2026-07-11..2026-08-19 MoE loadout; superseded above ──
      CONSOLIDATED 2026-07-11 (three roles → one model): the container backed `creative`,
      `companion-lite` (orchestrator chat loop) AND the `classify`/`analyst`/vision family
      (re-homed off anvil). Model was the abliterated Qwen3.6-35B-A3B MoE (35B total / ~3B
      active), Q4_K_M GGUF + native mmproj (mmproj-bf16.gguf, 861 MB) on the /mnt/cache/llm NVMe;
      vision verified 2026-07-11 at ~79 t/s. Launch was
      `-ngl 99 -c 393216 --parallel 6 -fa on -ctk f16 -ctv f16 --mmproj …` => 65536 ctx/slot,
