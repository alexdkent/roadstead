# ===========================================================================
# THE model naming + capability AUTHORITY for the whole fleet.
#
# This file is owned by the LLM proxy and is the SINGLE SOURCE OF TRUTH for
# every model the fleet runs — chat / embed / rerank / vision / speech / media.
# The proxy routing table, the framework client port+alias maps, the gateway
# facade, the telemetry UNITS, the dispatcher registry, the model cards, the
# frontend catalog and the `inferctl models` CLI all DERIVE from this file
# (see originfleet/llmproxy/model_catalog.py). Do not hand-maintain those
# copies — edit HERE.
#
# Naming strategy: FUNCTION-BASED. The top-level key names the JOB
# (router / analyst / composer / reasoner / creative / embed / rerank / ocr /
# tts / stt / imagegen / ...). The model family is an ATTRIBUTE that may change
# without renaming the role. Old names live on under `aliases:` so existing
# callers keep working through a compat window.
#
# ---------------------------------------------------------------------------
# WHEN YOU ADD / MOVE / RENAME / RETIRE A MODEL — edit THIS file first, then:
#   add     → set status:active; drop a systemd unit on the box + `sync-to-*`;
#             add the name to the vLLM `--served-model-name` list if vLLM;
#             verify the frontend catalog row renders (parity gate);
#             confirm telemetry UNITS probe + dashboard tile appear.
#   move    → change host/port here; edit the unit + redeploy that box.
#   rename  → change the key; move the old name into `aliases:` (auto-resolves).
#   retire  → set status:decommissioned; disable/remove the unit; drop the
#             served-model-name alias.
# The doctrine test (tests/framework/test_model_naming_doctrine.py) FAILS if a
# role string / served-model-name / port can't resolve to an entry here, so a
# forgotten location can't merge silently. Full checklist: `model-selection` skill.
# ---------------------------------------------------------------------------
#
# Field reference (per entry):
#   kind            chat | embed | rerank | ocr | tts | stt | diarize | stream | media
#   status          active | on_demand | planned | deprecated | decommissioned
#                   (planned = name/port reserved but NOT deployed — not live)
#   aliases         every legacy / shorthand name that must resolve to this entry
#   host            nexus | anvil | nasbox   (resolved to IP via meta.hosts + env)
#   port            backend port on `host`
#   proxy_endpoint  true if this role OWNS the DEFAULT_ENDPOINTS[endpoint_class]
#                   row (chat/embed/rerank roles routed by the proxy). false for
#                   facade-only (ocr/tts/stt/...) and media (dispatcher) roles.
#   endpoint_class  the proxy QoS class (only for proxy_endpoint / shared roles)
#   role            the proxy EndpointConfig.role / telemetry role string (the
#                   pre-rename canonical — kept until the call-site sweep lands)
#   backend_engine  llama.cpp | vllm | shim
#   served_model_names  vLLM --served-model-name tokens that MUST match here
#   context_per_slot    proxy EndpointConfig seed (live value comes from /props)
#   context_window      framework chunker/preflight default (_DEFAULT_CONTEXT_WINDOW)
#   slots               max_slots seed
#   timeout_floor_s     per-class floor (llmproxy/timeout_model.FLOOR_S)
#   timeout_ceiling_s   per-role override of the adaptive-timeout upper bound (else the
#                       interactive/background tier band; llmproxy/timeout_model.resolve_ceiling_s)
#   policy.*            EndpointConfig knobs (reserve / floor_pct / cap / affinity / skip_discovery)
#   capabilities.*      vision / streaming / reasoning / tool_calling / structured_output
#   dispatcher_capability   media: the GenerationCapability key the dispatcher uses
#   unit                media: systemd unit name
#   token_speed         approx decode throughput / latency note (advisory)
# ===========================================================================

meta:
  hosts:
    nexus: 10.0.0.6
    anvil: 10.0.0.3
    nasbox: 10.0.0.10
    kestrel-speech: 10.0.0.13
    kestrel-perception: 10.0.0.18
  # Provider context-window values preserved VERBATIM for callers/DB rows that
  # are not (yet) covered by a role entry. anthropic is the no-op v2 fallback;
  # the nexus-* legacy values are intentionally the OLD numbers — un-migrated
  # DB rows fall back here until llm_provider._migrate_provider_names() renames
  # them on boot. (nexus-companion/nexus-gemma differ from their live roles.)
  extra_context_windows:
    anthropic: 200000
    nexus-companion: 16384
    nexus-gemma: 16384

models:

  # ---------------------------------------------------------------- chat / reasoning

  # classify / analyst / vision: RE-HOMED onto the boxa `creative` endpoint 2026-07-11 (three-role
  # consolidation) — the anvil `llama-classify.service` (Qwen3.6-35B-A3B+mmproj on the GB10 :9092)
  # is STOPPED + disabled, and role names `classify`/`qwen-classify`/`chat`/`nexus-chat`/`analyst`/
  # `qwen-analyst`/`analyst-vision`/`qwen-vision-8b`/`qwen-vision-9b`/`vision-8b` are now ALIASES of
  # the single boxa `creative` endpoint (see the creative stanza above + the `decommissioned:` block).
  # Keeping ONE stanza at ONE URL keeps 6-slot capacity accounting correct. This frees the anvil
  # GB10 for imagegen/videogen (classify no longer evicts them) and fixes classify's ~36s p95
  # queue-wait. Same weights/mmproj as before, same 32K chunking policy (creative.context_window),
  # reasoning-off, grammar tool-calling — behavior-preserving for classify callers.

  composer:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: companion
    role: qwen-composer
    aliases: [qwen-composer, companion, nexus-companion]
    host: nexus
    port: 8081
    backend_engine: llama.cpp
    systemd_unit: llama-companion
    probe_kind: llama
    model_family: Qwen3.5-122B-A10B (Huihui abliterated)
    quant: Q4_K_M
    context_per_slot: 262144   # 2026-07-09: raised 131072->262144 (256K = native n_ctx_train; classify freed the mem, ~2 KV heads make 256K KV only ~14GB). --kv-unified shared pool; seed only, live value comes from /props. Was 131072 (2026-07-04), 32768/slot before that.
    context_window: 32768      # fleet chunkers size against 32K on purpose (policy, not slot size) — deliberately NOT bumped with the 256K slot; 256K is rare-need headroom, not the default feed
    slots: 4
    timeout_floor_s: 360       # 2026-07-04: raised 180->360 — kv-unified allows big single requests; 122B prefill at ~300 t/s needs headroom past 128K (NB 2026-07-09: a FULL 256K prefill ~approaches timeout_ceiling_s 900 — the rare extreme, revisit ceiling if huge prompts become common)
    timeout_ceiling_s: 900     # 2026-07-05: the 122B is legitimately slow even on turn-support tiers; a role override so the interactive band (600s) can't strangle a big synth under load. Adaptive surge×size widens up to here.
    policy:
      dispatch_concurrency_cap: 4   # re-validated for the 122B via llama-batched-bench (1/2/4/8 parallel,
                                    # no instability found through 8) — the old cap:3 was specific to the
                                    # 80B's own G1 crash history, doesn't carry over to a different model.
      fast_path_reserve_slots: 1
      slot_affinity: true           # pin a conversation to one slot (KV reuse via --slot-prompt-similarity)
    capabilities:
      vision: false
      streaming: true
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "single-stream ~23 t/s decode / ~228 t/s pp2048; aggregate ~57 t/s decode / ~239 t/s pp at 8-way concurrency (llama-batched-bench, 2026-07-03)"}
    purpose: Streaming user-facing synth + high-capability composer/summarizer.
    when_used:
      - Inner-loop final-answer synthesis + tier2_synth streaming reply
      - Speech-frame voice replies, recipe-runner recipe execution
      - Large-context summary fallover (>24k tokens)
    fallback: reasoner
    notes: |
      2026-07-03: swapped from Qwen3-Next-80B-A3B to Qwen3.5-122B-A10B, and the
      binary from a patched llama.cpp (0be84685b, custom hybrid-recurrent
      checkpoint-restore patch for the 80B's gated-delta-net architecture) to a
      stock/mainline prebuilt (/opt/llama.cpp-b9849, build 9849) — the 122B is a
      standard MoE ("qwen35moe"), so the old patch's checkpoint-restore feature
      doesn't apply here and was dropped along with the patched binary.
      Full optimization pass + concurrent-throughput validation:
      infra/nexus/bench_results/composer_122b_optimization_20260703.md.
      Findings baked into config: `--n-cpu-moe` hurts monotonically on this UMA
      hardware (not used, ncmoe=0 effectively); `-b 4096 -ub 2048` is the
      validated batch/ubatch sweet spot. A research pass found nothing in the
      gap between b9849 and the (then-)current HEAD (b9870) worth chasing for
      this hardware/backend — see the same bench doc.

  router:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: gemma
    role: gemma-router
    aliases: [gemma-router, gemma, nexus-gemma]
    host: anvil
    port: 9091
    backend_engine: llama.cpp
    systemd_unit: llama-gemma
    probe_kind: llama
    model_family: Gemma-4-E4B-it
    quant: Q4_K_XL
    context_per_slot: 16384
    context_window: 16384
    slots: 4                          # 2026-07-12: 2->4 (--parallel 4, --ctx-size 65536 on anvil:9091). 2 slots couldn't absorb bursts from the many cheap gemma callers (greeter advisory every turn + sidekick.extract_pad/obs + tool routers + classify), spiking tail latency into their aggressive per-call timeouts. E4B is tiny (~4.3GB) with ample anvil headroom; live value still comes from /props.
    timeout_floor_s: 60
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; first-token fast"}
    purpose: Tier-1.5 LLM router + cheap classification / tool routing.
    when_used:
      - Tool routers (temporal / health-verifier / research), email + proposal classify
      - knowledge audit/dedup classifiers
    fallback: classifier
    notes: |
      Since 2026-06-08 this E4B backend ALSO serves the `classifier`
      (gemma-greeter) role — the E2B-hot :9090 was decommissioned.

  classifier:
    kind: chat
    status: active
    proxy_endpoint: false            # shares the `gemma` endpoint with `router`
    endpoint_class: gemma
    role: gemma-greeter
    aliases: [gemma-greeter, gemma-hot, nexus-gemma-hot]
    host: anvil
    port: 9091
    backend_engine: llama.cpp
    model_family: Gemma-4-E4B-it
    quant: Q4_K_XL
    context_per_slot: 16384
    context_window: 4096             # legacy greeter default (small prompts)
    slots: 2
    timeout_floor_s: 60
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; rare fallback path"}
    purpose: Tier-1.5 router/classifier fallback (greeter); lands on the E4B backend.
    when_used:
      - tool_router fallback (health-verifier / temporal), chip narration
    fallback: router
    notes: |
      Two logical roles (router + classifier) legitimately SHARE one physical
      backend (E4B :9091). proxy_endpoint:false — `router` owns the `gemma`
      DEFAULT_ENDPOINTS row; this entry only contributes gemma-greeter→gemma to
      ROLE_TO_CLASS + its own context window.

  reasoner:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: thinker
    role: llama-thinker
    # `reasoner` is this stanza's YAML key but was NOT a resolvable dispatch name
    # (build_role_to_class registers role + aliases, never the key), so callers
    # passing model="reasoner" 404'd with unknown_endpoint. Registered as an alias
    # so the semantic role name resolves to the live anvil thinker backend.
    aliases: [reasoner, llama-thinker, thinker]
    host: anvil
    port: 9083
    backend_engine: vllm
    systemd_unit: vllm-thinker
    probe_kind: vllm
    served_model_names: [llama-thinker, thinker, claude-sonnet-4-5, llama]
    model_family: Qwen3.6-27B-Text-NVFP4-MTP
    quant: NVFP4
    params: {active: 27B, total: 27B}
    context_per_slot: 131072
    context_window: 32768            # fleet chunkers size against 32K on purpose
    # 20 = the backend's HARD cap (vllm-thinker `--max-num-seqs 20`, lowered
    # 32->20 on 2026-06-11 for DECKARD co-residency — see serve_thinker_prod.sh).
    # vLLM does NOT expose --max-num-seqs over its API, so this seed is the ONLY
    # source of the proxy's admission ceiling; a stale 32 here over-admitted the
    # thinker by 12 (the extra 12 just queued at the backend, bypassing the
    # proxy's DRR fairness). Reconciled to the documented launch value 2026-07-01
    # (Phase-0 discovery). NOTE: llama.cpp roles self-correct via /props; vLLM
    # ones like this do NOT — a Phase-1 shadow reconciler will warn on future
    # drift. Keep this equal to serve_thinker_prod.sh's --max-num-seqs.
    slots: 20
    timeout_floor_s: 180
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 1
      # Step 4c: the backend's real --max-num-seqs (serve_thinker_prod.sh). Keep
      # EQUAL to `slots` above; the shadow reconciler warns if they drift (the
      # 32-vs-20 class). Update BOTH whenever serve_thinker_prod.sh changes.
      documented_max_num_seqs: 20
    capabilities:
      vision: false
      streaming: true
      reasoning: true               # MTP speculative + per-request thinking
      tool_calling: true
      structured_output: guidance
    token_speed: {decode_tok_s_at_1: 40, aggregate_tok_s_full: 120}
    purpose: Dense agentic reasoning tier (the fleet's heavy reasoner).
    when_used:
      - knowledge extraction, news synthesis, thread/device enrichment
      - browser-broker default, forum-agent thread summary
    fallback: composer
    notes: |
      Function-named: actually a Qwen3.6 dense model on vLLM with qwen3_5_mtp
      n=3 speculative decoding. served window is 128K (opencode); fleet chunkers
      deliberately use 32K (context_window) to keep extraction chunks small.

  creative:
    kind: chat
    status: active                  # PINNED always-resident on the boxa. Standalone docker container `llamacpp-creative-boxa` (--restart always) on :9196 — no dispatcher/systemd; proxy dispatches directly, capacity self-discovered via /props. CONSOLIDATED 2026-07-11: ONE Qwen3.6-35B-A3B-abliterated container (+mmproj) now backs THREE roles — `creative`, `companion-lite`(alias, chat loop), AND the `classify`/`analyst`/vision family(alias, re-homed off anvil :9092). Superseded the Trinity-Mini(creative)/Gemma-4-26B(companion-lite) split AND the anvil llama-classify.service (stopped). Not evictable (dedicated card) — the anvil eviction dance is gone.
    proxy_endpoint: true
    endpoint_class: creative
    role: creative
    aliases: [deckard, deckard-31b, companion-lite, qwen-classify, classify, chat, nexus-chat, analyst-vision, qwen-vision-8b, qwen-vision-9b, vision-8b, qwen-analyst, analyst]   # THREE roles now resolve to this ONE boxa endpoint (2026-07-11 consolidation): (1) creative, (2) companion-lite = the orchestrator inner chat loop, (3) the whole classify/analyst/vision family (re-homed off anvil :9092). All pure ALIASES of the single endpoint so no caller changes AND slots aren't double-counted (two stanzas at one URL would double-count the 6 slots). deckard/deckard-31b are HISTORICAL anvil NVFP4 rollback aliases (the deployed model is NOT a DECKARD finetune).
    host: nasbox
    port: 9196
    backend_engine: llama.cpp
    probe_kind: llama
    served_model_names: [creative, deckard-31b, deckard]   # `creative` = the LIVE boxa llama.cpp server (-a creative); `deckard`/`deckard-31b` = the DORMANT anvil rollback (serve_deckard.sh, on anvil) — declared so the naming-doctrine test covers them. `companion-lite` is a ROUTING alias, NOT a served -a name — the container runs `-a creative`.
    model_family: Qwen3.6-35B-A3B (abliterated, Heretic) — MoE 35B total / ~3B active, Q4_K_M GGUF
    quant: Q4_K_M
    params: {active: 3B, total: 35B}
    context_per_slot: 65536          # llama.cpp -c 393216 --parallel 6 = 65536/slot, f16 KV cache. Trimmed 76800->65536 (2026-07-11) to make room for the mmproj (861 MB) + vision-encoder compute buffer now that classify/vision re-homed here; ~30.5 GiB resident of the 32GB boxa, no GTT spill.
    context_window: 32768            # fleet chunkers size against 32K on purpose (policy, not slot size) — same policy classify used, so re-homing classify here changes no chunk sizing
    slots: 6                         # llama.cpp --parallel 6 — the shadow reconciler warns if this drifts from actual --parallel (6)
    timeout_floor_s: 120            # compromise: this endpoint now serves BOTH long creative song-compose AND latency-sensitive chat (companion-lite alias). 120s min-budget; adaptive surge×size widens to the ceiling for big song-compose, and a stuck chat turn fails in ~120s instead of 900s. (mirrors timeout_model FLOOR_S["creative"] — bump BOTH in lockstep.)
    timeout_ceiling_s: 1800         # inherently long-running (long-form gen); a role override so the generous background band applies on EVERY tier (song-compose runs at an interactive tier). Adaptive surge×size widens up to here.
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 2     # reserve 2 of 6 slots for interactive chat turns (companion-lite alias) so a real-time chat turn isn't head-of-line blocked behind a background song-compose.
      # llama.cpp --parallel. Keep EQUAL to `slots: 6` above; the shadow reconciler warns on drift.
      documented_max_num_seqs: 6
    capabilities:
      vision: true                  # mmproj loaded (mmproj-bf16.gguf, 861 MB) — classify's vision callers (attachments stage-2, knowledge_store intake, browser_broker perceive./vision.) route here now. Verified 2026-07-11: perfect OCR + shape/number extraction on the boxa/SYCL, ~79 t/s vision decode.
      streaming: true
      reasoning: false              # Qwen3.6 reasoning is DISABLED via `--jinja --chat-template-kwargs '{"enable_thinking":false}'` (VERIFIED 0 reasoning_content).
      tool_calling: grammar         # now backs the inner-loop chat tool-calling (companion-lite alias): the orchestrator's tool catalog is GBNF grammar-constrained.
      structured_output: grammar    # llama.cpp GBNF / response_format json_schema. NOTE: give structured calls a generous max_tokens.
    token_speed: {note: "Qwen3.6-35B-A3B MoE (~3B active) Q4_K_M on the boxa (SYCL), --parallel 6 / 76800 ctx-per-slot; consolidated creative+companion-lite endpoint. Per-model decode/prefill numbers not yet re-benchmarked on this loadout — the prior Trinity-Mini/Gemma-4-26B figures are retired."}
    purpose: |
      The consolidated boxa core model — ONE abliterated Qwen3.6-35B-A3B (+mmproj) serving THREE roles:
      (1) creative / counterpoint generative voice, (2) the orchestrator inner chat-loop backend
      (companion-lite alias), and (3) the fleet text-classify + vision tier (classify/analyst family,
      re-homed off the anvil GB10 — which is now free for imagegen/videogen).
    when_used:
      - sidekick song authoring (theme/hook/expand), dj crew speaker voice
      - orchestrator inner chat loop (Sidekick's chat turn) via the companion-lite alias
      - Tier-1.5/Tier-2 text classification (sidekick.extract_pad fallback, temporal.daily_summary, mail-agent.email_recent_overview, orchestrator.autonomous_chat-agent.reflect, forum-agent.peer_playbook) via the classify alias
      - attachments stage-2 full-resolution image extraction; knowledge_store ground-truth PII/document intake; browser_broker vision-routed capabilities (perceive./vision./insurance./portal.) via the vision aliases
    fallback: composer
    notes: |
      CONSOLIDATED 2026-07-11 (three roles → one model): ONE standalone always-on docker container
      `llamacpp-creative-boxa` (`ghcr.io/ggml-org/llama.cpp:server-intel`, SYCL/level_zero:0,
      --restart always) on the Intel Arc Pro boxa (10.0.0.10:9196) now backs the `creative` role, the
      `companion-lite` role (orchestrator chat loop), AND the `classify`/`analyst`/vision family
      (re-homed off anvil). ALL non-creative roles are ALIASES of this one endpoint — no caller
      changes, and keeping ONE stanza at ONE URL keeps 6-slot capacity accounting correct (two stanzas
      at one URL would double-count the slots).
      DEPLOYED MODEL: an abliterated (Heretic) `Qwen3.6-35B-A3B` MoE (35B total / ~3B active), Q4_K_M
      GGUF + its native mmproj (mmproj-bf16.gguf, 861 MB) on the /mnt/cache/llm NVMe. Tool-calling +
      VISION both live (vision verified 2026-07-11: perfect OCR/shape/number extraction, ~79 t/s).
      Reasoning is DISABLED via `--jinja --chat-template-kwargs '{"enable_thinking":false}'` (verified
      0 reasoning_content). NOTE: llama.cpp disables `--cache-reuse` when an mmproj is loaded (logged
      at boot); cross-turn token reuse is off, but `--slot-prompt-similarity 0.5` still routes each
      request to its warm slot.
      Launch: `-ngl 99 -c 393216 --parallel 6 -fa on -ctk f16 -ctv f16 --mmproj …` => 65536 ctx/slot,
      ~30.5 GiB resident of the 32GB card (trimmed from 76800 to make room for the mmproj + vision
      compute). NO dispatcher, NO systemd — docker owns lifecycle; depends on the /mnt/cache/llm mount.
      CANONICAL LAUNCH + per-flag rationale: `infra/nasbox-vllm-xpu/serve_creative_llamacpp.sh`.
      This SUPERSEDED (a) the prior two-model creative/chat split (Trinity-Mini :9196 + Gemma-4-26B-A4B
      :9197 — old `llamacpp-companion-lite-boxa` container STOPPED), AND (b) the anvil
      `llama-classify.service` (Qwen3.6-35B-A3B+mmproj on the GB10 :9092 — STOPPED + disabled; the
      GB10 is now free for imagegen/videogen, and classify no longer has to evict them). Moving the
      light classify model OFF the contended anvil card also fixes classify's ~36s p95 queue-wait.
      ROLLBACK: git-revert `serve_creative_llamacpp.sh` + re-run `serve_companion-lite_llamacpp.sh` +
      re-enable `llama-classify.service` on anvil + revert these stanzas (all prior GGUFs remain
      staged). The `deckard`/`deckard-31b` aliases remain declared for the naming-doctrine;
      serve_deckard.sh (anvil) is unaffected.

  # companion-lite + classify/analyst/vision: RETIRED as distinct stanzas 2026-07-11 — MERGED into
  # `creative` above as ALIASES (one Qwen3.6-35B-A3B-abliterated boxa container +mmproj backs all three
  # roles; keeping ONE stanza at ONE URL keeps 6-slot capacity accounting correct). The orchestrator
  # inner chat loop targets role `companion-lite`; classify/analyst/vision callers target their usual
  # role names — all now resolve to the creative endpoint (:9196). The anvil llama-classify.service
  # is stopped+disabled. See the creative stanza's `aliases:` + notes, and the `decommissioned:` block.

  # ---------------------------------------------------------------- retrieval
  embed:
    kind: embed
    status: active
    proxy_endpoint: true
    endpoint_class: embed
    role: bge-m3-embed
    aliases: [bge-m3-embed]
    host: anvil
    port: 9087
    backend_engine: shim
    systemd_unit: bge-m3-embed
    probe_kind: health
    model_family: BGE-M3 (dense + sparse + colbert)
    quant: fp16
    context_per_slot: 8192
    slots: 4
    timeout_floor_s: 15
    policy:
      skip_discovery: true          # FastAPI shim — no /props or /v1/models
    capabilities:
      vision: false
      streaming: false
      structured_output: none
    token_speed: {note: "hybrid embed, one forward pass"}
    purpose: Dense/sparse/colbert hybrid embeddings for retrieval (the canonical fleet embed).
    when_used:
      - knowledge ingest + retrieval, forum-agent similarity gate, dedup
    fallback: null
    notes: |
      NOT OpenAI-compatible — POST /embed returning dense+sparse+colbert. The
      nexus CPU copy (:8091) was removed 2026-06-05.

  rerank:
    kind: rerank
    status: active
    proxy_endpoint: true
    endpoint_class: rerank
    role: bge-reranker
    aliases: [bge-reranker, rerank, nexus-rerank]
    host: anvil
    port: 9084
    backend_engine: shim
    systemd_unit: bge-reranker-shim
    probe_kind: infinity
    model_family: BGE-Reranker v2-m3 (cross-encoder)
    quant: fp16
    context_per_slot: 8192
    slots: 1
    timeout_floor_s: 10
    policy:
      background_floor_pct: 0.0
      skip_discovery: true
    capabilities:
      vision: false
      streaming: false
      structured_output: none
    token_speed: {note: "cross-encode candidate batch"}
    purpose: Late-stage retrieval candidate reranking.
    when_used:
      - knowledge retrieval rerank stage
    fallback: null
    notes: |
      Cohere-style POST /rerank (not OpenAI). Upstream `infinity-bge-reranker`
      (:9085) is the INTERNAL backend behind this shim — not a public role.

  # ---------------------------------------------------------------- vision / OCR
  ocr:
    kind: ocr
    status: active
    proxy_endpoint: false           # facade-only (gateway), not a proxy LLM role
    role: got-ocr
    aliases: [got-ocr, got_ocr]
    host: kestrel-perception             # RELOCATED off nexus 2026-07-02 (Kestrel OCR VM, CUDA)
    port: 8087
    backend_engine: shim
    systemd_unit: ocr-unit
