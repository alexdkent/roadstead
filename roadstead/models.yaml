  # ---------------------------------------------------------------- media / generation
  # All dispatcher-managed, on-demand (GPU-slot lease). Keyed by
  # dispatcher_capability; `unit` is the systemd unit the dispatcher brokers.
  imagegen:
    kind: media
    status: on_demand
    proxy_endpoint: false
    role: flux1-imagegen
    aliases: [flux1-imagegen, anvil-imagegen, nexus-imagegen]
    # 2026-07-31 Phase E: MOVED anvil -> nexus (ROCm/gfx1151), unit `nexus-imagegen`.
    # The `anvil-imagegen` alias and anvil's unit are kept: that service is still running
    # as the ROLLBACK until every checkpoint is verified on nexus.
    host: nexus
    port: 9210
    backend_engine: shim
    dispatcher_capability: image_diffusers
    dispatcher_capability_aliases: [image_fast, image_hq]
    dispatcher_unit_key: nexus-imagegen
    unit: nexus-imagegen.service
    manage_process: false            # self-managing; dispatcher brokers the slot only
    health_path: /healthz
    warmup_sec: 15
    model_family: Diffusers (Flux / SDXL, ~150 swappable checkpoints)
    purpose: On-demand image generation.
    when_used:
      - Image Studio, sidekick/dj artwork
    fallback: null
    notes: |
      Hosts ~150 swappable checkpoints behind one FastAPI — the per-checkpoint
      sub-registry lives in infra/anvil/anvil_imagegen/models.yaml (a finer
      granularity; NOT folded into this authority). On nexus that sub-registry is
      /opt/imagegen/registry.yaml (25 rows, 16 with weights present) plus
      /opt/imagegen/loras.yaml (103 LoRAs).

      🚨 REQUIRES A GPU-SLOT DISPATCHER. imagegen leases a slot from `nexus-dispatcher`
      (:9201) before committing VRAM; without it EVERY generate fails immediately with
      "dispatcher /ensure unreachable". That dispatcher was ported from anvil with the
      service — it is not optional infrastructure.

      ⚠️ BULK `to("cuda")` IS PATHOLOGICALLY SLOW ON gfx1151 — OPEN ISSUE, NOT YET ROOT-CAUSED.
      Measured 2026-07-31 on a 7 GiB SDXL checkpoint: disk 4.1 GB/s, `from_pretrained` 0.4 s,
      then `to("cuda")` runs >400 s ALONE on an idle box (97 GiB free) and 10-25 min under
      load. That is ~4-17 MB/s for a copy that on a UNIFIED-memory part should barely copy at
      all. Ruled OUT by measurement, each disproved in turn:
        * HSA_ENABLE_SDMA — same slowness at 0 and 1.
        * the venv — /opt/rocmtest/venv (no torchvision) is equally slow.
        * GPU contention — still slow with the box quiet and nothing else loaded.
      🔑 STRONG LEAD: the earlier "SDXL is fine on nexus, 18 s" result was per-IMAGE
      GENERATION, not load, and it used `enable_model_cpu_offload()` — which streams layers on
      demand and therefore NEVER performs a bulk to("cuda"). Generation itself is healthy
      (~20 s/image). So the cost is specifically the fully-resident bulk transfer the service
      does, and offload may sidestep it entirely. Worth testing before accepting the timeouts
      below as permanent.
      ⚠️ Do NOT claim parity with anvil: anvil can no longer load these checkpoints at all
      (tier3 leaves ~8 GiB against a ~22 GiB need), so no same-model baseline exists. An earlier
      revision of this note asserted "not a regression from the move" on the strength of
      anvil's registry comment about 17-24 GB DiT models — a different, much larger class.
      That claim was not supported and has been withdrawn.
      Same-checkpoint reuse IS cheap (SDXL variants 15-20 s once resident). Mitigated in the unit: IMAGEGEN_IDLE_UNLOAD_S=5400 and
      IMAGEGEN_GENERATION_TIMEOUT_S=3600 — the service counts model LOAD inside the
      generation deadline, so the default 960 s failed healthy loads.

      Also on nexus: HSA_ENABLE_SDMA=0 (gfx1151 libhsa segfault), diffusers needs
      variant="fp16", and a /models -> /srv/models/imagegen symlink covers aux paths that are
      hardcoded absolute with no env override (e.g. hand_detect).

  video:
    kind: media
    status: on_demand                # LIVE 2026-06-21 — Phase 0 validated on the GB10
    proxy_endpoint: false
    role: ltx2-videogen
    # `videogen` included so Catalog.entry("videogen") RESOLVES: the gateway facade looks the
    # video service up by that literal string (external_facade.inference_models), and the
    # stanza key is `video` while the role is `ltx2-videogen` — so entry() returned None and
    # the payload shipped with no canonical/status/healthy/model. The Inference page then
    # rendered a card with every stat as "—" and no real health signal. Found 2026-07-31.
    aliases: [videogen, ltx2-videogen, anvil-videogen, anvil-ltx]
    host: anvil
    port: 9211                       # anvil-videogen FastAPI service (adjacent to imagegen :9210)
    backend_engine: shim
    dispatcher_capability: video_fast
    dispatcher_capability_aliases: [video_hq]
    dispatcher_unit_key: anvil-videogen
    unit: anvil-videogen.service
    manage_process: false            # always-on service; self-manages ComfyUI residency + the slot lease
    health_path: /healthz
    warmup_sec: 30
    model_family: LTX-2.3 (LTX 2.3 22B distilled, fp8-scaled)
    quant: fp8-scaled
    purpose: On-demand text-to-video and image-to-video.
    when_used:
      - short-form video gen, animate Image-Studio stills
    fallback: null
    notes: |
      LTX-2.3 22B distilled fp8 on the anvil GB10 via an isolated headless
      ComfyUI (/opt/comfyui-video, PyTorch SDPA — sm_121 has no FlashAttention;
      SageAttention deferred). The anvil-videogen FastAPI service (:9211,
      manage_process:false) is always-on, owns the dispatcher GPU-slot lease, and
      lazy-starts / idle-stops the ComfyUI child + memory-guards loads — the ~80GB
      video stack shares the 121GB unified pool with the always-resident vLLM
      thinker, so generation is strictly serialized + memory-preflighted. Gemma-3-12B
      is the prompt text encoder. Per-checkpoint sub-registry lives in
      infra/anvil/anvil_videogen/models.yaml (not folded into this authority).

