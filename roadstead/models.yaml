    health_path: /healthz
    warmup_sec: 30
    model_family: LTX-2.3 (LTX 2.3 22B distilled, fp8-scaled)
    quant: fp8-scaled
    purpose: On-demand text-to-video and image-to-video.
    when_used:
      - short-form video gen, animate Image-Studio stills
    fallback: null
    notes: |
      LTX-2.3 22B distilled fp8 on the anvil GB10 via an isolated headless
      ComfyUI (/opt/comfyui-video, PyTorch SDPA — sm_121 has no FlashAttention;
      SageAttention deferred). The anvil-videogen FastAPI service (:9211,
      manage_process:false) is always-on, owns the dispatcher GPU-slot lease, and
      lazy-starts / idle-stops the ComfyUI child + memory-guards loads — the ~80GB
      video stack shares the 121GB unified pool with the always-resident vLLM
      thinker, so generation is strictly serialized + memory-preflighted. Gemma-3-12B
      is the prompt text encoder. Per-checkpoint sub-registry lives in
      infra/anvil/anvil_videogen/models.yaml (not folded into this authority).

