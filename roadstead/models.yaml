# ===========================================================================
# THE model naming + capability AUTHORITY for the whole fleet.
#
# This file is owned by the LLM proxy and is the SINGLE SOURCE OF TRUTH for
# every model the fleet runs — chat / embed / rerank / vision / speech / media.
# The proxy routing table, the framework client port+alias maps, the gateway
# facade, the telemetry UNITS, the dispatcher registry, the model cards, the
# frontend catalog and the `inferctl models` CLI all DERIVE from this file
# (see originfleet/llmproxy/model_catalog.py). Do not hand-maintain those
# copies — edit HERE.
#
# Naming strategy: FUNCTION-BASED. The top-level key names the JOB
# (router / analyst / composer / reasoner / creative / embed / rerank / ocr /
# tts / stt / imagegen / ...). The model family is an ATTRIBUTE that may change
# without renaming the role. Old names live on under `aliases:` so existing
# callers keep working through a compat window.
#
# ---------------------------------------------------------------------------
# WHEN YOU ADD / MOVE / RENAME / RETIRE A MODEL — edit THIS file first, then:
#   add     → set status:active; drop a systemd unit on the box + `sync-to-*`;
#             add the name to the vLLM `--served-model-name` list if vLLM;
#             verify the frontend catalog row renders (parity gate);
#             confirm telemetry UNITS probe + dashboard tile appear.
#   move    → change host/port here; edit the unit + redeploy that box.
#   rename  → change the key; move the old name into `aliases:` (auto-resolves).
#   retire  → set status:decommissioned; disable/remove the unit; drop the
#             served-model-name alias.
# The doctrine test (tests/framework/test_model_naming_doctrine.py) FAILS if a
# role string / served-model-name / port can't resolve to an entry here, so a
# forgotten location can't merge silently. Full checklist: `model-selection` skill.
# ---------------------------------------------------------------------------
#
# Field reference (per entry):
#   kind            chat | embed | rerank | ocr | tts | stt | diarize | stream | media
#   status          active | on_demand | planned | deprecated | decommissioned
#                   (planned = name/port reserved but NOT deployed — not live)
#   aliases         every legacy / shorthand name that must resolve to this entry
#   host            nexus | anvil | nasbox   (resolved to IP via meta.hosts + env)
#   port            backend port on `host`
#   proxy_endpoint  true if this role OWNS the DEFAULT_ENDPOINTS[endpoint_class]
#                   row (chat/embed/rerank roles routed by the proxy). false for
#                   facade-only (ocr/tts/stt/...) and media (dispatcher) roles.
#   endpoint_class  the proxy QoS class (only for proxy_endpoint / shared roles)
#   role            the proxy EndpointConfig.role / telemetry role string (the
#                   pre-rename canonical — kept until the call-site sweep lands)
#   backend_engine  llama.cpp | vllm | shim
#   served_model_names  vLLM --served-model-name tokens that MUST match here
#   context_per_slot    proxy EndpointConfig seed (live value comes from /props)
#   context_window      framework chunker/preflight default (_DEFAULT_CONTEXT_WINDOW)
#   slots               max_slots seed
#   timeout_floor_s     per-class floor (llmproxy/timeout_model.FLOOR_S)
#   timeout_ceiling_s   per-role override of the adaptive-timeout upper bound (else the
#                       interactive/background tier band; llmproxy/timeout_model.resolve_ceiling_s)
#   policy.*            EndpointConfig knobs (reserve / floor_pct / cap / affinity / skip_discovery)
#   capabilities.*      vision / streaming / reasoning / tool_calling / structured_output
#   dispatcher_capability   media: the GenerationCapability key the dispatcher uses
#   unit                media: systemd unit name
#   token_speed         approx decode throughput / latency note (advisory)
# ===========================================================================

meta:
  hosts:
    nexus: 10.0.0.6
    anvil: 10.0.0.3
    nasbox: 10.0.0.10
    kestrel-speech: 10.0.0.13
    kestrel-perception: 10.0.0.18
  # Provider context-window values preserved VERBATIM for callers/DB rows that
  # are not (yet) covered by a role entry. anthropic is the no-op v2 fallback;
  # the nexus-* legacy values are intentionally the OLD numbers — un-migrated
  # DB rows fall back here until llm_provider._migrate_provider_names() renames
  # them on boot. (nexus-companion/nexus-gemma differ from their live roles.)
  extra_context_windows:
    anthropic: 200000
    nexus-companion: 16384
    nexus-gemma: 16384

models:

  # ---------------------------------------------------------------- chat / reasoning

  # classify / analyst / vision: RE-HOMED onto the boxa `creative` endpoint 2026-07-11 (three-role
  # consolidation) — the anvil `llama-classify.service` (Qwen3.6-35B-A3B+mmproj on the GB10 :9092)
  # is STOPPED + disabled, and role names `classify`/`qwen-classify`/`chat`/`nexus-chat`/`analyst`/
  # `qwen-analyst`/`analyst-vision`/`qwen-vision-8b`/`qwen-vision-9b`/`vision-8b` are now ALIASES of
  # the single boxa `creative` endpoint (see the creative stanza above + the `decommissioned:` block).
  # Keeping ONE stanza at ONE URL keeps 6-slot capacity accounting correct. This frees the anvil
  # GB10 for imagegen/videogen (classify no longer evicts them) and fixes classify's ~36s p95
  # queue-wait. Same weights/mmproj as before, same 32K chunking policy (creative.context_window),
  # reasoning-off, grammar tool-calling — behavior-preserving for classify callers.

  tier3_backup:
    # 🔻 TIER-3 BACKUP ONLY as of 2026-07-30 (Phase B step 4 + §2b priority ladder).
    # Every live role that used to land here — `composer`, `companion`, `nexus-companion`,
    # `qwen-composer` — now resolves to the anvil `reasoner`/tier3 Laguna endpoint. This
    # stanza exists to keep the ABLITERATED 122B reachable as tier3's declared fallback.
    #
    # `status: on_demand` because §2b makes its STEADY STATE **STOPPED** (priority 1: loaded
    # only when tier3 is unhealthy). Leaving it running is not free — measured 2026-07-31, with
    # the 122B resident nexus has ~8 GiB spare and moving SDXL to GPU took **701 s instead of
    # seconds**, a ~40x penalty. imagegen and this model cannot usefully co-reside, which is the
    # whole reason §2b specifies non-concurrency rather than sharing.
    #
    # Do NOT re-add `tier3` here — an alias maps to exactly ONE endpoint and load_catalog()
    # raises `name collision` AT IMPORT, taking the proxy down on start (it did, ~4 min).
    # 🚨 RECOVERY IS MANUAL TODAY — do not read `fallback: tier3_backup` as automatic failover.
    # Two things are true and easy to conflate:
    #   * `fallback:` is PARSED into the catalog but never consumed for routing. It is advisory
    #     metadata. Nothing re-routes to this endpoint when tier3 fails.
    #   * `status: on_demand` here is NOT the same field as EndpointConfig.on_demand. That flag
    #     drives the ANVIL GPU-slot dispatcher lease (dispatcher_capability) and is anvil-
    #     only; nexus has no dispatcher, so no existing machinery can load this model. Building
    #     that is §4b.2 of the tier migration (the nexus memory arbiter) — NEW SOFTWARE.
    # Until the arbiter lands, bringing the abliterated 122B back is an OPERATOR action:
    #     ssh root@10.0.0.6 'systemctl start llama-companion'     # ~minutes, 70.6 GiB GGUF
    # The unit is stopped AND disabled on purpose (§2b: steady state STOPPED so imagegen gets
    # the run of the box). Starting it will contend with imagegen for nexus memory.
    kind: chat
    status: on_demand
    proxy_endpoint: true
    endpoint_class: companion
    role: tier3-backup
    aliases: [tier3-backup, llama-companion-122b]
    host: nexus
    port: 8081
    backend_engine: llama.cpp
    systemd_unit: llama-companion
    probe_kind: llama
    model_family: Qwen3.5-122B-A10B (Huihui abliterated)
    quant: Q4_K_M
    context_per_slot: 262144   # 2026-07-09: raised 131072->262144 (256K = native n_ctx_train; classify freed the mem, ~2 KV heads make 256K KV only ~14GB). --kv-unified shared pool; seed only, live value comes from /props. Was 131072 (2026-07-04), 32768/slot before that.
    context_window: 32768      # fleet chunkers size against 32K on purpose (policy, not slot size) — deliberately NOT bumped with the 256K slot; 256K is rare-need headroom, not the default feed
    slots: 8                   # 2026-07-17 prefill campaign: 4->8 (--parallel 8). llama-batched-bench on the final env: aggregate decode 28.5->62.8 t/s at 1->8-way (still climbing, no cliff), prefill holds ~430-460 t/s aggregate through 8-way. Seed only; live value from /props.
    timeout_floor_s: 360       # 2026-07-04: raised 180->360 — kv-unified allows big single requests; 122B prefill (now ~400 t/s pp4096 after the 2026-07-17 env uplift) needs headroom past 128K (NB 2026-07-09: a FULL 256K prefill ~approaches timeout_ceiling_s 900 — the rare extreme, revisit ceiling if huge prompts become common)
    timeout_ceiling_s: 900     # 2026-07-05: the 122B is legitimately slow even on turn-support tiers; a role override so the interactive band (600s) can't strangle a big synth under load. Adaptive surge×size widens up to here.
    policy:
      dispatch_concurrency_cap: 8   # 2026-07-17: 4->8 with --parallel 8; batched-bench validated through
                                    # 8-way on the new env (no instability, monotonic aggregate gains).
      fast_path_reserve_slots: 1    # background_cap = 8-1 = 7, the doctrine-MAX. Do NOT set reserve:0 to
                                    # give extraction all slots (tried 2026-07-17): reserve:0 alone
                                    # backfires (cap→0.20 floor=1); reserve:0+background_floor_pct:1.0 breaks
                                    # the anti-starvation invariant (test_background_cap.py — floor must leave
                                    # >=1 for interactive). Reclaiming the idle last slot needs a SCHEDULER
                                    # change, not config. Real throughput lever = smoothing the kv3/kv4 feed.
      slot_affinity: true           # pin a conversation to one slot (KV reuse via --slot-prompt-similarity)
    capabilities:
      vision: false
      streaming: true
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "single-stream ~28 t/s decode / ~422 pp2048 / ~399 pp4096; aggregate ~63 t/s decode / ~430-460 t/s pp at 8-way (2026-07-17 campaign: perf governor + amd_iommu=off + mesa 26.1.4; llama-bench + llama-batched-bench)"}
    purpose: Streaming user-facing synth + high-capability composer/summarizer.
    when_used:
      - Inner-loop final-answer synthesis + tier2_synth streaming reply
      - Speech-frame voice replies, recipe-runner recipe execution
      - Large-context summary fallover (>24k tokens)
    fallback: reasoner
    notes: |
      2026-07-03: swapped from Qwen3-Next-80B-A3B to Qwen3.5-122B-A10B, and the
      binary from a patched llama.cpp (0be84685b, custom hybrid-recurrent
      checkpoint-restore patch for the 80B's gated-delta-net architecture) to a
      stock/mainline prebuilt (/opt/llama.cpp-b9849, build 9849) — the 122B is a
      standard MoE ("qwen35moe"), so the old patch's checkpoint-restore feature
      doesn't apply here and was dropped along with the patched binary.
      Full optimization pass + concurrent-throughput validation:
      infra/nexus/bench_results/composer_122b_optimization_20260703.md.
      Findings baked into config: `--n-cpu-moe` hurts monotonically on this UMA
      hardware (not used, ncmoe=0 effectively); `-b 4096 -ub 2048` is the
      validated batch/ubatch sweet spot. A research pass found nothing in the
      gap between b9849 and the (then-)current HEAD (b9870) worth chasing for
      this hardware/backend — see the same bench doc.
      2026-07-17/18 prefill campaign (same binary, env uplift + slots 4->8):
      infra/nexus/bench_results/composer_prefill_campaign_20260717.md.
      Nexus host state it depends on: CPU governor=performance
      (nexus-perfgov.service), amd_iommu=off grub default, mesa-vulkan-drivers
      26.1.4 kisak PPA under apt-mark hold (mesa version materially moves
      composer throughput — never upgrade without a drained re-bench), unit
      `--cache-ram 16384` (host prompt cache; KV f16 A/B rejected, q8_0 kept).

  router:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: gemma
    role: gemma-router
    aliases: [tier1, gemma-router, gemma, nexus-gemma]   # tier1 = canonical (2026-07-30 tier migration)
    host: kestrel-perception
    port: 9091
    backend_engine: llama.cpp
    systemd_unit: ""              # 2026-07-30: MOVED to Kestrel A2000 as docker container `gemma-tier1` (not a systemd unit)
    probe_kind: llama
    model_family: Gemma-4-E4B-it
    quant: Q4_K_XL
    context_per_slot: 16384
    context_window: 16384
    slots: 4                          # 2026-07-12: 2->4 (--parallel 4, --ctx-size 65536 on anvil:9091). 2 slots couldn't absorb bursts from the many cheap gemma callers (greeter advisory every turn + sidekick.extract_pad/obs + tool routers + classify), spiking tail latency into their aggressive per-call timeouts. E4B is tiny (~4.3GB) with ample anvil headroom; live value still comes from /props.
    timeout_floor_s: 60
    policy:
      fast_path_reserve_slots: 1    # 2026-07-29: 0(default)->1. THE lever for this endpoint's
                                    # bursty tail. With reserve 0, background_cap_slots collapses
                                    # to background_floor_slots = max(1, int(slots*0.20)) — which is
                                    # 1 at 4 slots AND STILL 1 at 8 (config.py:261-277). So the
                                    # background band (this endpoint's dominant traffic: kv4
                                    # audit/dedup ~138k reqs + temporal ~52k, both P3_INGESTION)
                                    # ran ONE-AT-A-TIME no matter how many slots the backend had.
                                    # reserve:1 -> background_cap = slots-1 = 3 now, 7 if/when the
                                    # unit goes --parallel 8. Raising --parallel WITHOUT this is a
                                    # no-op for those callers. Do NOT set reserve:0 with
                                    # background_floor_pct:1.0 to "free" the last slot — that breaks
                                    # the anti-starvation invariant (test_background_cap.py); see
                                    # the composer policy block above for the same lesson.
      documented_max_num_seqs: 4    # llama.cpp --parallel in llama-gemma.service. Keep EQUAL to
                                    # `slots` above — health.py:242 raises a standing max_slots_drift
                                    # WARNING (into /v1/status.alerts + the health-verifier chip) on mismatch.
                                    # Bump BOTH to 8 in the same change that edits the unit.
      # NOTE: `min_expected_slots` is deliberately NOT set here — it is absent from the
      # policy key mapping in model_catalog.py:245-255, so a models.yaml value is silently
      # DROPPED. EndpointConfig defaults it to 1 (config.py), which makes the CRITICAL guard
      # at health.py:549 ("discovered N slots, expected >= M") unreachable fleet-wide: no
      # entry can raise it above 1. Arming it is a code change, not config.
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; first-token fast"}
    purpose: Tier-1.5 LLM router + cheap classification / tool routing.
    when_used:
      - Tool routers (temporal / health-verifier / research), email + proposal classify
      - knowledge audit/dedup classifiers
    fallback: classifier
    notes: |
      Since 2026-06-08 this E4B backend ALSO serves the `classifier`
      (gemma-greeter) role — the E2B-hot :9090 was decommissioned.

  classifier:
    kind: chat
    status: active
    proxy_endpoint: false            # shares the `gemma` endpoint with `router`
    endpoint_class: gemma
    role: gemma-greeter
    aliases: [gemma-greeter, gemma-hot, nexus-gemma-hot]
    host: kestrel-perception
    port: 9091
    backend_engine: llama.cpp
    model_family: Gemma-4-E4B-it
    quant: Q4_K_XL
    context_per_slot: 16384
    context_window: 4096             # legacy greeter default (small prompts)
    slots: 2
    timeout_floor_s: 60
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; rare fallback path"}
    purpose: Tier-1.5 router/classifier fallback (greeter); lands on the E4B backend.
    when_used:
      - tool_router fallback (health-verifier / temporal), chip narration
    fallback: router
    notes: |
      Two logical roles (router + classifier) legitimately SHARE one physical
      backend (E4B :9091). proxy_endpoint:false — `router` owns the `gemma`
      DEFAULT_ENDPOINTS row; this entry only contributes gemma-greeter→gemma to
      ROLE_TO_CLASS + its own context window.

  reasoner:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: thinker
    role: llama-thinker
    # `reasoner` is this stanza's YAML key but was NOT a resolvable dispatch name
    # (build_role_to_class registers role + aliases, never the key), so callers
    # passing model="reasoner" 404'd with unknown_endpoint. Registered as an alias
    # so the semantic role name resolves to the live anvil thinker backend.
    # tier3 = canonical (2026-07-30 tier migration). `composer`/`companion`/`qwen-composer`/
    # `nexus-companion` were MOVED here from the nexus 122B stanza on 2026-07-30 — Phase B
    # step 4, "point composer/companion/reasoner/thinker aliases at tier3". Laguna is now the
    # single heavy tier; the 122B remains reachable as `tier3-backup` (on_demand) for its
    # abliterated capability, per the §2b priority ladder.
    aliases: [tier3, reasoner, llama-thinker, thinker, composer, companion, qwen-composer, nexus-companion]
    host: anvil
    port: 9083
    backend_engine: vllm
    # `vllm-tier3.service` WRAPS the docker container (same pattern the retired
    # vllm-thinker.service used): ExecStart=/opt/anvil-bench/serve_tier3_prod.sh,
    # ExecStop=docker stop vllm-tier3.
    # ⚠️ This field must be a REAL systemd unit — the anvil telemetry collector probes it with
    # `systemctl is-active`, and build_telemetry_units() DROPS any probed role with an empty
    # systemd_unit, which means NO health probe, NO metrics and NO health-verifier monitoring. It was ""
    # from the Phase B cutover until 2026-07-31, so tier3 ran unmonitored for that window;
    # test_model_naming_doctrine::test_telemetry_derive_is_complete is the guard.
    # The old `vllm-thinker` unit AND `vllm-thinker-watchdog` are stopped + DISABLED (there is
    # deliberately no watchdog on tier3) — do not send restart tooling at them.
    systemd_unit: vllm-tier3
    probe_kind: vllm
    served_model_names: [llama-thinker, thinker, tier3, reasoner, claude-sonnet-4-5, llama]
    model_family: Laguna-S-2.1-INT4 (+ Laguna-S-2.1-DFlash-INT4 drafter)
    quant: INT4 (compressed-tensors pack-quantized, W4A16, group 32)
    # Sparse MoE: 256 experts, top-10, 48 layers, hidden 3072. poolside do not publish a
    # parameter count; these are DERIVED from config.json and are approximate — treat as
    # indicative, not authoritative.
    params: {active: ~6B, total: ~120B}
    # 262144 = the SERVED window (--max-model-len) = THIS CHECKPOINT's ceiling. Raised
    # 131072 -> 262144 on 2026-07-30 with an explicit --kv-cache-memory of 26 GiB.
    #
    # ⚠️ CORRECTION: 262144 is NOT "Laguna's native context, unscaled" — an earlier version of
    # this comment said that and it was wrong twice over.
    #   * It IS rope-scaled: `rope_parameters.full_attention` is YaRN with factor 32.0 over an
    #     original_max_position_embeddings of 8192 (8192 x 32 = 262144).
    #   * The BASE repo `poolside/Laguna-S-2.1` ships YaRN factor **128.0 = 1,048,576 (1M)**.
    #     The INT4 and NVFP4 quants ship factor 32.0 instead. Weights are identical and YaRN is
    #     an inference-time RoPE transform, so 1M is a CONFIG cap here, not a weights limit —
    #     see the `laguna-1m-context` note about raising it (KV, not config, is the real bound:
    #     the pool holds 670,750 tokens, so ~670K is the practical ceiling regardless).
    #
    # Never go BELOW the retired 27B's 131072 without saying so out loud: the context gate
    # starts 422-ing requests that used to succeed, which is a silent capability regression
    # (caught 2026-07-30 by test_context_gate + test_timeout_events as `assert 422 == 200`).
    #
    # --max-model-len does NOT reserve memory; it only permits longer requests. Paged
    # attention allocates what a request actually uses, so typical ~8k traffic is unaffected
    # and only several CONCURRENT full-length requests contend for the pool.
    #
    # Raised to 700000 on 2026-07-30 via `--hf-overrides`, using the BASE repo's rope_parameters
    # VERBATIM (attention_factor is YaRN-factor-dependent — 1.4852 at factor 128 vs 1.3466 at 32
    # — so it must be copied, never hand-computed).
    context_per_slot: 700000
    # ⚠️ 700000 is a MEMORY bound, not a model bound. vLLM: "estimated maximum model length is
    # 723472" at our 26 GiB KV. The MODEL reaches 1,048,576, but that needs 37.16 GiB of KV and
    # the only ~11 GiB spare is the DFlash drafter — so 1M costs ~half the decode speed
    # (28-30 t/s -> ~15). Deliberately not taken.
    #
    # ⚠️ ULTRA-LONG IS BACKGROUND-ONLY. A 578,400-token request measured 794 s end-to-end
    # (prefill 729 tok/s — HALF the 1,426 tok/s seen at 213K; it degrades with length).
    # timeout_model caps interactive (P0-P2) at _INTERACTIVE_CEILING_S = 600 s, so an
    # interactive caller is killed around ~430K tokens. P3/P4 get 1800 s and fit. Anything
    # sending >400K MUST be background priority or it will time out.
    #
    # ⚠️ timeout_model.size_stretch SATURATES at size_max=4.0 x the 16384 top edge = 65,536
    # tokens, so a 578K prompt gets the SAME stretch as an 82K one. That constant was tuned when
    # the ceiling was 128K and is now ~10x too early. Revisit before relying on near-max calls.
    context_window: 32768            # fleet chunkers size against 32K on purpose
    # 20 = the backend's HARD cap (`--max-num-seqs 20` in serve_tier3_prod.sh). vLLM does NOT
    # expose --max-num-seqs over its API, so this seed is the ONLY source of the proxy's
    # admission ceiling; a stale value over-admits (the surplus just queues at the backend,
    # bypassing the proxy's DRR fairness — a stale 32 once over-admitted the thinker by 12).
    # NOTE: llama.cpp roles self-correct via /props; vLLM ones like this do NOT — the shadow
    # reconciler warns on drift. Keep EQUAL to serve_tier3_prod.sh.
    #
    # 2026-07-31: raised 16 -> 20 (operator request). max_num_seqs is a SCHEDULER concurrency
    # cap, not a KV allocation — the 26 GiB pool (722,390 tokens) is sized by
    # --kv-cache-memory and is unchanged, and per-step activation is bounded by
    # --max-num-batched-tokens 8192, not by this number. The real risk it carries is the
    # DFlash drafter, which allocates OUTSIDE --gpu-memory-utilization (the mechanism that
    # hard-hung this box twice, both needing a power cycle), so headroom was re-measured
    # after the restart rather than assumed.
    slots: 20
    timeout_floor_s: 180
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 1
      # Step 4c: the backend's real --max-num-seqs (serve_tier3_prod.sh). Keep
      # EQUAL to `slots` above; the shadow reconciler warns if they drift (the
      # 32-vs-20 class). Update BOTH whenever serve_tier3_prod.sh changes.
      documented_max_num_seqs: 20
    capabilities:
      vision: false
      streaming: true
      reasoning: true               # MTP speculative + per-request thinking
      tool_calling: true
      structured_output: guidance
    token_speed: {decode_tok_s_at_1: 30, aggregate_tok_s_full: 120}   # 29.9 t/s measured 2026-07-30
    purpose: Heavy MoE reasoning/synthesis tier (tier3 — the fleet's deepest model).
    when_used:
      - knowledge extraction, news synthesis, thread/device enrichment
      - browser-broker default, forum-agent thread summary
    fallback: tier3_backup
    notes: |
      TIER 3 — Laguna S 2.1 INT4 on vLLM (anvil/GB10, sm_121a image
      ghcr.io/timothystewart6/vllm-gb10), with the MATCHED Laguna-S-2.1-DFlash-INT4
      drafter at num_speculative_tokens=3. Replaced the dense Qwen3.6-27B NVFP4 on
      2026-07-30. Weights live on the NVMe-backed `llmmodels` share (67 GB + 2.1 GB).

      Measured at cutover: decode 29.9 t/s, DFlash acceptance 43.1% (2.29 tok/forward),
      prefix-cache hit 64-70%. Prefix caching WORKS here — it was structurally 0% on
      Qwen3.5's DeltaNet hybrid — which matters a lot on a prefill-dominated load.

      KV sizing is EXPLICIT: `--kv-cache-memory 27917287424` (26 GiB) rather than letting the
      util number decide what is left over. Measured 2026-07-30: 670,750 KV tokens
      (~41.6 KiB/token), 2.56x concurrency at a full 256K request.

      ⚠️ Host headroom is **~8 GiB under load, NOT the ~12 GiB you see just after startup** —
      the idle figure is measured before KV blocks are actually touched, and it drops once real
      traffic populates the pool. Budget against 8. That is the number to use before deciding
      anything else can move onto this box: the two hard-hangs happened at ~0 GiB free, and on
      a unified-memory box the reserve IS the recovery path (no shell ⇒ no `docker rm` ⇒
      operator power cycle). Do NOT take another 6 GiB on the strength of the idle number.
      Prefer this lever over --gpu-memory-utilization: util is "whatever remains after weights,
      activation and cudagraphs", which is exactly what makes it easy to get wrong when a
      drafter is also allocating outside the budget. vLLM prints the suggested value at startup.

      🚨 `disable_any_whitespace: true` IS LOAD-BEARING — do not drop it (fixed 2026-07-31).
      Without it, structured output RUNS AWAY on whitespace. A real durability-gate pass
      produced, 10 times out of 10:
          completion_tokens = 1540 (the entire budget)
          real content      = 54 chars: `{"notes": [{"n": 1, "holds": true`
          trailing          = 3032 chars of pure whitespace (2274 spaces, 758 \n)
      The model reaches a STRUCTURAL position — where a `,` must precede the next
      required key — and the grammar also permits whitespace there, so greedy decoding
      emits whitespace until the budget dies. `disable_any_whitespace` removes that
      freedom. After: 0/10 runaway, median 7.6 s (was 29 s), no measured cost to plain
      chat (2.17 s / ~25 tok/s, unchanged).

      `maxLength` IS and always WAS enforced — at 20/40/60/80/100/120 the longest emitted
      string equals the bound EXACTLY, before and after the fix. Anyone reporting
      "tier3 ignores maxLength" has met THIS bug, not a bound failure.

      What it is NOT, all measured, so nobody re-runs these:
        * NOT the backend — `xgrammar` reproduced it 10/10 too (and is otherwise worse).
        * NOT speculative decoding — 10/10 with DFlash disabled (and disabling it costs
          ~26 -> ~19 tok/s, so it stays ON).
        * NOT temperature (2/3 at 0.7), NOT item count (3/3 at maxItems=6+minItems=6),
          NOT `additionalProperties`.
        * A synthetic schema reproduced only ~2/50 — DO NOT conclude "fine" from a toy.
      Proxy-side fallback if the flag is ever unavailable: `frequency_penalty=0.2` gave
      4/4 clean (0.5 over-corrects). Do NOT use `stop` on runs of whitespace — it fires
      on pretty-printed JSON indentation and truncates at ~14 tokens.

      ⚠️ Why this hid for so long: the proxy turns the truncation into a 502 and callers
      turn a 502 into "", so a silently-dead gate looks exactly like "the model had
      nothing to say". Each occurrence also burned 30-60 s of a tier3 slot.
      The backend/flags are server-level; they CANNOT be overridden per request —
      verified, all three override shapes were ignored or rejected.

      🚨 `--long-prefill-token-threshold 1024` IS SLOT FAIRNESS (2026-07-31).
      It caps how many prefill tokens ONE request may take per scheduler step, BEFORE
      the shared `--max-num-batched-tokens 8192` budget is applied
      (vllm/v1/core/sched/scheduler.py:507). Without it a single giant prefill owns the
      whole budget for ~25 consecutive steps and nothing else prefills at all.

      Measured with one 100K-token request in flight alongside short interactive ones.
      Read the WORST short request, not the median — the median hides it completely,
      because only the FIRST short request is starved and the rest run free:

          threshold   worst short   long request
          none(8192)     45.26 s       49.2 s     <- one caller stalled 100x
          4096            9.76 s       49.1 s
          2048            4.16 s       50.0 s
          1024            1.86 s       51.5 s     <- CHOSEN

      1024 buys a 24x better interactive tail for 4.7% on the giant. That is the right
      direction because this stanza ALREADY declares ultra-long traffic background-only,
      and a 45 s stall reads to a caller as a hang and blows _INTERACTIVE_CEILING_S.
      Idle short latency was 0.30 s at every setting — normal traffic pays nothing.
      Our real distribution (1157 reqs) is 96% <=10k tokens, 0.7% >50k, so the giants
      this protects against are rare but severe.

      ⚠️ `--max-num-partial-prefills` / `--max-long-partial-prefills` are NOT usable:
      vLLM's V1 engine raises `NotImplementedError: Concurrent Partial Prefill is not
      supported` at startup (engine/arg_utils.py `_check_feature_supported`) and
      crash-loops. The fields exist on the legacy SchedulerConfig, which makes them look
      available — they are not. Only the threshold is honoured. Don't re-try them.

      🚨 TWO LOAD-BEARING FLAGS. Neither is cosmetic. ⚠️ They are gated by
      `tier3_gates.py`, which lives ONLY on anvil (`/opt/anvil-bench/`) and is NOT in
      this repo — so neither CI nor ship.sh can run it, and nothing here will catch a
      regression in these two flags. Treat the text below as the authority and verify
      against serve_tier3_prod.sh on the box.
      ⚠️ Both entries below were WRONG until 2026-07-31 and each would have sent a reader
      to "correct" the live config into a broken state. Verify against
      serve_tier3_prod.sh, which is the truth.

      1. `--default-chat-template-kwargs '{"enable_thinking": false}'` — FALSE, not true.
         The mechanism is real: Laguna's chat template defaults enable_thinking=true,
         while vLLM's DeepSeekV3-derived `poolside_v1` reasoning parser defaults it
         FALSE and then installs an IdentityReasoningParser that separates NOTHING, so
         any caller sending no chat_template_kwargs — EVERY fleet caller — got raw
         chain-of-thought plus a stray `</think>` inside `content`.
         But setting it TRUE (the first fix, which this comment used to prescribe) is
         WORSE: the model then spends the whole budget reasoning and returns NOTHING.
         Measured: max_tokens=120 thinking=true -> out=120, finish=length, content_len=0,
         status=ok — no error, no alert, callers just got empty strings.
         FALSE fixes both: no thinking is generated, so there is nothing to leak.
         The reason the leak "fix" looked verified was an ABSENCE assertion
         (`"</think>" not in content`), which an empty string also satisfies. Gate G4
         must assert a POSITIVE property (non-empty, finish_reason=stop) too.
      2. `--gpu-memory-utilization 0.81` is the live value; the old "0.72 is a HARD
         CEILING" line described a DIFFERENT configuration and no longer applies.
         When util sized the KV pool, 0.72 was the ceiling and 0.78 + a drafter
         hard-hung anvil twice on 2026-07-30, each needing an operator power cycle.
         We now pass `--kv-cache-memory 27917287424` (26 GiB), which sizes the pool
         DIRECTLY, so util is a bound rather than the allocator and 0.81 is stable
         (re-measured 2026-07-31 at 20 slots: 11 GiB free after load).
         ⚠️ The underlying HAZARD is unchanged and is about the MECHANISM, not the
         number: a spec-decode drafter allocates OUTSIDE the util budget. Re-measure
         headroom after any change that adds concurrency or a drafter.

      Structured outputs use `--structured-outputs-config '{"backend":"guidance"}'`
      (see `structured_output: guidance` below) — NOT llama.cpp GBNF, which is the
      `creative`/tier2 stanza's backend. Verified 2026-07-31 with a real json_schema
      call: 29 tokens, finish_reason=stop, valid parseable JSON. Truncation of
      structured calls runs ~0.1% (28 in 26,993 requests/24h) and is a budget tail,
      not a grammar fault.

      Tool calling and reasoning both use `poolside_v1` (Laguna's template is
      GLM-derived: `<tool_call>name<arg_key>k</arg_key><arg_value>v</arg_value>`).
      Served window is 32K (down from the 27B's 128K), matching the fleet chunkers.

