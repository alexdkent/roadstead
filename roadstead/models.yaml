# ===========================================================================
# THE model naming + capability AUTHORITY for the whole fleet.
#
# This file is owned by the LLM proxy and is the SINGLE SOURCE OF TRUTH for
# every model the fleet runs — chat / embed / rerank / vision / speech / media.
# The proxy routing table, the framework client port+alias maps, the gateway
# facade, the telemetry UNITS, the dispatcher registry, the model cards, the
# frontend catalog and the `inferctl models` CLI all DERIVE from this file
# (see originfleet/llmproxy/model_catalog.py). Do not hand-maintain those
# copies — edit HERE.
#
# Naming strategy: FUNCTION-BASED. The top-level key names the JOB
# (router / analyst / composer / reasoner / creative / embed / rerank / ocr /
# tts / stt / imagegen / ...). The model family is an ATTRIBUTE that may change
# without renaming the role. Old names live on under `aliases:` so existing
# callers keep working through a compat window.
#
# ---------------------------------------------------------------------------
# WHEN YOU ADD / MOVE / RENAME / RETIRE A MODEL — edit THIS file first, then:
#   add     → set status:active; drop a systemd unit on the box + `sync-to-*`;
#             add the name to the vLLM `--served-model-name` list if vLLM;
#             verify the frontend catalog row renders (parity gate);
#             confirm telemetry UNITS probe + dashboard tile appear.
#   move    → change host/port here; edit the unit + redeploy that box.
#   rename  → change the key; move the old name into `aliases:` (auto-resolves).
#   retire  → set status:decommissioned; disable/remove the unit; drop the
#             served-model-name alias.
# The doctrine test (tests/framework/test_model_naming_doctrine.py) FAILS if a
# role string / served-model-name / port can't resolve to an entry here, so a
# forgotten location can't merge silently. Full checklist: `model-selection` skill.
# ---------------------------------------------------------------------------
#
# Field reference (per entry):
#   kind            chat | embed | rerank | ocr | tts | stt | diarize | stream | media
#   status          active | on_demand | planned | deprecated | decommissioned
#                   (planned = name/port reserved but NOT deployed — not live)
#   aliases         every legacy / shorthand name that must resolve to this entry
#   host            nexus | anvil | nasbox   (resolved to IP via meta.hosts + env)
#   port            backend port on `host`
#   proxy_endpoint  true if this role OWNS the DEFAULT_ENDPOINTS[endpoint_class]
#                   row (chat/embed/rerank roles routed by the proxy). false for
#                   facade-only (ocr/tts/stt/...) and media (dispatcher) roles.
#   endpoint_class  the proxy QoS class (only for proxy_endpoint / shared roles)
#   role            the proxy EndpointConfig.role / telemetry role string (the
#                   pre-rename canonical — kept until the call-site sweep lands)
#   backend_engine  llama.cpp | vllm | shim | openrouter
#                   Resolved to a provider (roadstead/providers/) — an unknown
#                   value falls back to llama.cpp rather than failing, which is
#                   what the old `!= "vllm"` branches always did.
#   base_url        REMOTE backends only: the full base URL, which supersedes
#                   host/port (they cannot express a scheme or a base path).
#                   e.g. https://openrouter.ai/api/v1
#   api_key_env     REMOTE backends only: the NAME of the environment variable
#                   holding the API key. NEVER the key itself — a key in this
#                   file is a key in the git history.
#   served_model_names  vLLM --served-model-name tokens that MUST match here.
#                   For a remote provider fronting a CATALOGUE, the first entry
#                   is the model slug this endpoint routes on (e.g.
#                   openai/gpt-oss-120b) — there is nothing to discover, so it
#                   is seeded from here.
#
#   A remote stanza, for reference (Roadstead can dispatch to one today; making
#   it *spill* under the same admission decision is roadmap Workstream D):
#
#     spill-openrouter:
#       kind: chat
#       status: planned
#       proxy_endpoint: true
#       endpoint_class: spill
#       role: spill
#       backend_engine: openrouter
#       base_url: https://openrouter.ai/api/v1
#       api_key_env: OPENROUTER_API_KEY
#       served_model_names: [openai/gpt-oss-120b]
#       slots: 4              # a POLICY cap on our own concurrency, not a
#                             # discovered capacity — remote capacity is elastic
#                             # and is governed by cost, not by occupancy.
#       capabilities: {streaming: true, tool_calling: true}
#   context_per_slot    proxy EndpointConfig seed (live value comes from /props)
#   context_window      framework chunker/preflight default (_DEFAULT_CONTEXT_WINDOW)
#   slots               max_slots seed
#   timeout_floor_s     per-class floor (llmproxy/timeout_model.FLOOR_S)
#   timeout_ceiling_s   per-role override of the adaptive-timeout upper bound (else the
#                       interactive/background tier band; llmproxy/timeout_model.resolve_ceiling_s)
#   stream_hard_cap_s   per-role override of the ABSOLUTE cap on a proxy-chosen STREAMING
#                       deadline that is being extended by token progress (else the band
#                       default; llmproxy/constants._STREAM_HARD_CAP_*). Never applies to an
#                       explicit caller deadline, which stays a hard wall.
#   policy.*            EndpointConfig knobs (reserve / floor_pct / cap / affinity / skip_discovery)
#   capabilities.*      vision / streaming / reasoning / tool_calling / structured_output
#   dispatcher_capability   media: the GenerationCapability key the dispatcher uses
#   unit                media: systemd unit name
#   token_speed         approx decode throughput / latency note (advisory)
# ===========================================================================

meta:
  hosts:
    nexus: 10.0.0.6
    anvil: 10.0.0.3
    anvil2: 10.0.0.29     # tier3 rank 1 (TP=2); serves no port of its own
    nasbox: 10.0.0.10
    kestrel-speech: 10.0.0.13
    kestrel-perception: 10.0.0.18
    # BUILT AND SERVING (2026-08-18/19). The R9700 box serving `tier2-chat`
    # (llama.cpp/Vulkan, CTnnn, :30000). Not yet ROUTED — see the stanza below.
    # The DHCP reservation MAC in infra/firewall/host_inventory.yaml was captured
    # at first boot and corrected to 38:05:25:3a:91:bf, and applied live to
    # OPNsense; forward + reverse DNS resolve. Runbook:
    # infra/jetty/tier2-chat/README.md
    jetty: 10.0.0.27

  # =========================================================================
  # THE PLACEMENT CHARTER — what each inference vehicle is FOR.
  #
  # `hosts` above says WHERE a model runs. This says WHAT A HOST IS FOR, and
  # — the part that keeps getting re-litigated — what its spare capacity is
  # RESERVED for. Headroom on an inference host is never "available"; it is
  # always already spent on something (KV, a swap slot, a co-resident voice
  # model). "Box X looks underutilized" is NOT a placement argument here, and
  # `meta.idle_silicon` below records the accelerators that are idle ON PURPOSE
  # so they stop being rediscovered as free capacity.
  #
  # ENFORCED by tests/llmproxy/test_inference_placement_doctrine.py: every live
  # (active / on_demand) entry's host must be charter-declared, its `kind` must
  # be admitted by that vehicle, and its `status` must be an admitted residency
  # for that kind. Vehicles with `exclusive_roles` must hold EXACTLY those roles
  # and nothing else.
  #
  # Field reference (per vehicle):
  #   hosts           keys of meta.hosts this vehicle owns
  #   charter         one line: the job this silicon exists to do
  #   admits          {kind: [status, ...]} — the kinds allowed here, and at
  #                   which residency. `active` = always-on resident;
  #                   `on_demand` = loaded for a job, then unloaded.
  #   exclusive_roles OPTIONAL. If present, the set of live model keys on these
  #                   hosts must EQUAL this list — a closed appliance.
  #   headroom_is     what the free memory/compute is already committed to.
  #   forbids         the negative rule, in one line.
  #
  # TO PLACE SOMETHING NEW: find the vehicle whose charter already covers the
  # job. If none does, that is a decision for the operator — widen a charter
  # deliberately (and say why in `charter`), never quietly by adding a stanza.
  # =========================================================================
  vehicles:

    tier3:
      hosts: [anvil, anvil2]
      charter: >-
        The deep tier. One model — the largest and most capable the fleet can
        self-host — served tensor-parallel across both GB10s as a SINGLE
        appliance over the direct 200GbE ConnectX-7 DAC. Reasoning, synthesis,
        long context, agentic loops.
      admits:
        chat: [active]
      exclusive_roles: [reasoner]
      headroom_is: >-
        tier3's KV pool (~1.7M tokens at 1M context, gpu-memory-utilization
        0.85). The ~242 GB across the pair is not a budget with room in it —
        weights are 155 GiB and the rest is cache. Measured headroom under load
        is ~8 GiB, and two hard-hangs at ~0 free needed an operator power cycle.
      forbids: >-
        Everything else. D6 (operator decision, 2026-08-20) makes this a
        single-purpose appliance: nothing else may be scheduled onto either box.
        embed/rerank/tier1/imagegen all MOVED OFF, and the media generators were
        retired, specifically to pay for the KV above. anvil2's compute is in
        the hardware census but is NOT available capacity.

    tier2-chat:
      hosts: [jetty]
      charter: >-
        The conversational lane, and only that — Sidekick's chat turn, the glasses
        lane, Discord's chat turn. A ~30 GB MoE chosen for TTFT and tokens/s at
        concurrency, because a human is waiting. Text only.
      admits:
        chat: [active]
      exclusive_roles: [tier2-chat]
      headroom_is: >-
        the 448K shared KV pool across 20 slots. Slot count IS the product here:
        this endpoint is sized for burst concurrency on a live conversation, not
        for a high average load.
      forbids: >-
        Anything that adds latency or memory pressure to the chat lane. This box
        is GO DARK / NO FALLBACK by design — chat surfaces refuse the turn rather
        than fail over — so a co-tenant that wedges it takes every conversational
        surface in the fleet with it. (The two dsh builder CTs are guests of the
        Proxmox HOST, not of this GPU, and hold their own LAN addresses.)

    tier2-analyst:
      hosts: [nasbox]
      charter: >-
        The worker tier. A ~30 GB DENSE, natively-multimodal model on the fleet's
        only vision-capable endpoint: extraction, classification, all document and
        photo vision, long-form authoring (songs, DJ patter), and the agent work
        that can afford to wait. Also the automatic tier3 failover target for
        agents opted in via `degrade_ok`.
      admits:
        chat: [active]
      exclusive_roles: [tier2-analyst]
      headroom_is: >-
        6 slots at 256K shared context with q8_0 KV and MTP speculative
        decoding, on the FORKED `llamacpp-boxa:mmvq32` image (2026-08-30, for
        beacon subagent concurrency). `slots x (1 + n_draft)` must stay under
        the ggml-SYCL MMVQ ceiling — 32 on this image via
        GGML_SYCL_MMVQ_MAX_BATCH, but only 8 on stock :server-intel, so a
        stock rollback must drop --parallel to 4 in the same change.
        `fast_path_reserve_slots: 2` keeps 2 slots for the classify/vision
        family; background (subagent) concurrency is 4.
      forbids: >-
        A second resident model on the boxa, and any workload that competes with
        the vision projector. This is the fleet's SLOWEST generative tier on
        decode (~38 tok/s at c1) — deliberately, because it is the dense
        multimodal one. Do not place a latency-sensitive job here to "spread
        load"; that is what tier2-chat is for.

    tier1:
      hosts: [kestrel-perception]
      charter: >-
        The decision BEFORE the work — cheap, fast classification, tool routing
        and short-context calls on a ~4B dense model, co-resident with the fleet's
        text-to-speech voices on one small dedicated card. Both jobs are chosen
        for being cheap and never contending.
      admits:
        chat: [active]
        tts: [active]
      exclusive_roles: [router, classifier, tts]
      headroom_is: >-
        the co-residency margin between the LLM and TTS on a 12 GB A2000. It has
        already been spent once: a retired OCR unit left enabled here held 1516
        MiB — exactly the margin tier1 needed — and OOM-crash-looped it 86 times
        after the next reboot.
      forbids: >-
        A third resident model. Also do not "use up" tier1's unclaimed
        capability (Gemma-4-E4B is natively multimodal with a 128K context; we
        serve it text-only at 16K) — that headroom is what keeps it cheap and
        non-contending, which is the entire role.

    nexus:
      hosts: [nexus]
      charter: >-
        Two jobs. (1) ALWAYS-ON RETRIEVAL AND PERCEPTION — embed, rerank, OCR
        and streaming ASR: small, latency-bounded services that every other tier
        depends on and that must fail independently of the CUDA stack. (2) THE
        ON-DEMAND SWAP POOL — image generation, 3D-print mesh generation and
        future GPU-assisted work that is NOT needed continuously, brokered as
        leases by nexus-dispatcher (:9201) with lazy weight load and idle
        unload. It is also the fleet's experimentation box.
      admits:
        embed: [active]
        rerank: [active]
        ocr: [active]
        stt: [active]
        media: [on_demand]
      headroom_is: >-
        THE PRODUCT. Free memory on nexus is not slack — it is the swap pool
        that lets an on-demand service load its weights at all. Measured: with a
        122B resident, moving a 7 GB image checkpoint onto the GPU took ~700
        SECONDS instead of seconds. That contention is why the 122B was removed
        outright rather than kept cold.
      forbids: >-
        Any always-on resident LLM (note `chat` is absent from `admits` above),
        and any always-on service that is not retrieval or perception. This is
        the box builders most often propose as "underutilized" — it is
        deliberately kept with room to swap. EXPERIMENTS are welcome and run
        UNREGISTERED; the moment something earns a stanza in this file it is a
        fleet service and needs a charter that admits it. Note also that nexus
        already carries four mutually-incompatible venvs (embed / rerank / OCR /
        imagegen) — a fifth tenant is a fifth dependency tree, not just memory.

    kestrel-speech:
      hosts: [kestrel-speech]
      charter: >-
        The speech + audio-media edge — batch speech-to-text (CPU), diarization
        and DJ stem separation on the Iris Xe iGPU. Not an LLM vehicle; listed so
        the charter covers every host in meta.hosts.
      admits:
        stt: [active]
        stream: [active]
        diarize: [on_demand]
      headroom_is: >-
        CPU for parakeet (STT runs on the CPU here, not the iGPU) and the iGPU
        for the on-demand audio jobs.
      forbids: >-
        LLM serving. The Iris Xe is ~2.3 TFLOPS with no tensor units; it is a
        media accelerator, not an inference tier.

  # =========================================================================
  # KNOWN-IDLE SILICON — deliberately unused, do not "discover" it.
  #
  # These accelerators show up in the hardware census (docs/fleet_hardware_
  # inventory.md) and look like free capacity. They are not proposals. Each row
  # is a decision that was already made; reopening one is an operator call, not
  # a builder's optimisation. Operator position (2026-08-29): the idle NPUs are
  # accepted, and that is fine for now.
  # =========================================================================
  idle_silicon:
    - what: nasbox on-package NPU (Arrow Lake AI Boost) + Arc Xe iGPU (64 EU)
      host: nasbox
      why_idle: >-
        Freed by the mid-2026 workload inversion when the speech stack moved to
        Kestrel, and left free on purpose. The hub's job is orchestration and
        storage; its one inference role is tier2-analyst on the discrete boxa.
        No serving stack for the NPU is worth the maintenance today.
    - what: NVIDIA RTX 4060 Ti (8 GB)
      host: nasbox
      why_idle: >-
        NOT idle — passed through to the Windows1 gaming VM. Reserved, not spare.
        It is the single most frequently mis-proposed "free GPU" in the fleet.
    - what: AMD Raphael iGPU (2 CU RDNA2, 2 GB carve-out)
      host: jetty
      why_idle: >-
        ~0.56 TFLOPS with a 2 GB carve-out — too small to serve anything, and
        any tenant on this box risks the go-dark chat lane.
    - what: Grace CPU cores (20c per node) on the tier3 pair
      host: anvil
      why_idle: >-
        Present in the census, unavailable by D6. Both nodes are a closed tier3
        appliance; CPU work here competes with vLLM for the unified memory pool.
    - what: tier1's unclaimed model capability (native image+audio input, 128K context)
      host: kestrel-perception
      why_idle: >-
        Served text-only at 16K on purpose. The unused capability is what keeps
        tier1 cheap and non-contending on a shared 12 GB card.
  # Provider context-window values preserved VERBATIM for callers/DB rows that
  # are not (yet) covered by a role entry. anthropic is the no-op v2 fallback;
  # the nexus-* legacy values are intentionally the OLD numbers — un-migrated
  # DB rows fall back here until llm_provider._migrate_provider_names() renames
  # them on boot. (nexus-companion/nexus-gemma differ from their live roles.)
  extra_context_windows:
    anthropic: 200000
    nexus-companion: 16384
    nexus-gemma: 16384

models:

  # ---------------------------------------------------------------- chat / reasoning

  # classify / analyst / vision: RE-HOMED onto the boxa `creative` endpoint 2026-07-11 (three-role
  # consolidation) — the anvil `llama-classify.service` (Qwen3.6-35B-A3B+mmproj on the GB10 :9092)
  # is STOPPED + disabled, and role names `classify`/`qwen-classify`/`chat`/`nexus-chat`/`analyst`/
  # `qwen-analyst`/`analyst-vision`/`qwen-vision-8b`/`qwen-vision-9b`/`vision-8b` are now ALIASES of
  # the single boxa `creative` endpoint (see the creative stanza above + the `decommissioned:` block).
  # Keeping ONE stanza at ONE URL keeps 6-slot capacity accounting correct. This frees the anvil
  # GB10 for imagegen/videogen (classify no longer evicts them) and fixes classify's ~36s p95
  # queue-wait. Same weights/mmproj as before, same 32K chunking policy (creative.context_window),
  # reasoning-off, grammar tool-calling — behavior-preserving for classify callers.

  router:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: gemma
    role: gemma-router
    aliases: [router, tier1, gemma-router, gemma, nexus-gemma]   # tier1 = canonical (2026-07-30 tier migration). `router` is the entry's own KEY and must be listed here too — build_role_aliases() reads `aliases` only, so without it a call for role `router` 404s at the proxy (see test_every_canonical_name_is_dispatchable).
    host: kestrel-perception
    port: 9091
    backend_engine: llama.cpp
    systemd_unit: ""              # 2026-07-30: MOVED to Kestrel A2000 as docker container `gemma-tier1` (not a systemd unit)
    probe_kind: llama
    model_family: Gemma-4-E4B-it
    quant: Q4_K_XL
    context_per_slot: 16384
    context_window: 16384
    slots: 4                          # 2026-07-12: 2->4 (--parallel 4, --ctx-size 65536 on anvil:9091). 2 slots couldn't absorb bursts from the many cheap gemma callers (greeter advisory every turn + sidekick.extract_pad/obs + tool routers + classify), spiking tail latency into their aggressive per-call timeouts. E4B is tiny (~4.3GB) with ample anvil headroom; live value still comes from /props.
    timeout_floor_s: 60
    policy:
      # The identity of the WEIGHTS behind this endpoint, checked every poll
      # against what the backend actually reports (backend.probe_model_fingerprint).
      # Mismatch raises the `model_fingerprint_drift` WARNING.
      #
      # 🚨 THIS IS THE GUARD THAT WOULD HAVE CAUGHT 2026-08-23. Every
      # model-dependent line on this stanza — thinking_kwargs,
      # thinking_budget_ratio, disable_any_whitespace, documented_max_num_seqs,
      # model_family — is a claim about specific weights, and the served model
      # id CANNOT detect the weights changing (tier3 answers to the fixed alias
      # `llama-thinker` whatever is loaded behind it). Measured live 2026-08-24.
      # No `ftype` in this build's meta — absent fields are simply omitted from the
      # fingerprint rather than guessed, so the string stays whatever the backend can tell us.
      #
      # UPDATE THIS IN THE SAME EDIT AS THE MODEL. A stale value here is loud
      # (an alert), which is the entire point — the previous failure was silent.
      model_fingerprint: "params=7518069290;vocab=262144"
      fast_path_reserve_slots: 1    # 2026-07-29: 0(default)->1. THE lever for this endpoint's
                                    # bursty tail. With reserve 0, background_cap_slots collapses
                                    # to background_floor_slots = max(1, int(slots*0.20)) — which is
                                    # 1 at 4 slots AND STILL 1 at 8 (config.py:261-277). So the
                                    # background band (this endpoint's dominant traffic: kv4
                                    # audit/dedup ~138k reqs + temporal ~52k, both P3_INGESTION)
                                    # ran ONE-AT-A-TIME no matter how many slots the backend had.
                                    # reserve:1 -> background_cap = slots-1 = 3 now, 7 if/when the
                                    # unit goes --parallel 8. Raising --parallel WITHOUT this is a
                                    # no-op for those callers. Do NOT set reserve:0 with
                                    # background_floor_pct:1.0 to "free" the last slot — that breaks
                                    # the anti-starvation invariant (test_background_cap.py); see
                                    # the composer policy block above for the same lesson.
      documented_max_num_seqs: 4    # llama.cpp --parallel in llama-gemma.service. Keep EQUAL to
                                    # `slots` above — health.py:242 raises a standing max_slots_drift
                                    # WARNING (into /v1/status.alerts + the health-verifier chip) on mismatch.
                                    # Bump BOTH to 8 in the same change that edits the unit.
      # NOTE: `min_expected_slots` is deliberately NOT set here — it is absent from the
      # policy key mapping in model_catalog.py:245-255, so a models.yaml value is silently
      # DROPPED. EndpointConfig defaults it to 1 (config.py), which makes the CRITICAL guard
      # at health.py:549 ("discovered N slots, expected >= M") unreachable fleet-wide: no
      # entry can raise it above 1. Arming it is a code change, not config.
    capabilities:
      vision: false
      streaming: false
      # 2026-08-01: false -> TRUE. This declares an OBSERVED property of the deployed
      # backend, not a wish. Gemma-4's template emits a reasoning trace on constrained
      # output and ignores BOTH documented off-switches — measured against the live
      # backend, `--reasoning off` (already set on the container) and
      # chat_template_kwargs {"enable_thinking": false} each still produced 482 chars.
      # `--reasoning-budget 0` on the container helps a lot but is NOT sufficient: it
      # clamps some prompts to 0 reasoning chars and leaves others at 285. So the
      # container flag stays (it cuts the common case) and this flag is the SAFETY NET.
      #
      # reasoning:true + backend_engine llama.cpp => model_catalog sets
      # forces_reasoning, and apply_forced_reasoning_budget reserves
      # forced_reasoning_budget() tokens of answer headroom ON TOP of the caller's cap.
      # That is robust where suppression is not: it does not need the model to stop
      # reasoning, only to have room left afterwards. Callers budgeting 96-120 tokens
      # (mail-agent.classify_triage, attachments.image_classify) were failing 73-100%
      # of the time without it.
      #
      # The cap is a CEILING, not a target — a call that does not reason still stops on
      # its own, so plain routing calls pay nothing.
      reasoning: true
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; first-token fast"}
    purpose: Tier-1.5 LLM router + cheap classification / tool routing.
    when_used:
      - Tool routers (temporal / health-verifier / research), email + proposal classify
      - knowledge audit/dedup classifiers
    # NULLED 2026-08-20 with § 9, which made `fallback:` load-bearing. It said
    # `classifier`, which is a role on THIS SAME E4B backend (see the note
    # below) — as advisory metadata that meant "the greeter is the cheap
    # fallback role", but as a failover declaration it would mean "when this
    # endpoint is down, route to itself", which is not a failover.
    #
    # The value was harmless in practice — `classifier` is `proxy_endpoint:
    # false`, so the derivation in build_endpoint_kwargs() skips it and arms
    # nothing. That is exactly why it is nulled rather than left: it is a latent
    # trap that would arm a self-referential failover the day somebody made the
    # classifier stanza routable. Only ONE failover pair is designed and tested:
    # tier3 -> tier2-analyst.
    fallback: null
    notes: |
      Since 2026-06-08 this E4B backend ALSO serves the `classifier`
      (gemma-greeter) role — the E2B-hot :9090 was decommissioned.

  classifier:
    kind: chat
    status: active
    proxy_endpoint: false            # shares the `gemma` endpoint with `router`
    endpoint_class: gemma
    role: gemma-greeter
    aliases: [gemma-greeter, gemma-hot, nexus-gemma-hot]
    host: kestrel-perception
    port: 9091
    backend_engine: llama.cpp
    model_family: Gemma-4-E4B-it
    quant: Q4_K_XL
    context_per_slot: 16384
    context_window: 4096             # legacy greeter default (small prompts)
    slots: 2
    timeout_floor_s: 60
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; rare fallback path"}
    purpose: Tier-1.5 router/classifier fallback (greeter); lands on the E4B backend.
    when_used:
      - tool_router fallback (health-verifier / temporal), chip narration
    fallback: router
    notes: |
      Two logical roles (router + classifier) legitimately SHARE one physical
      backend (E4B :9091). proxy_endpoint:false — `router` owns the `gemma`
      DEFAULT_ENDPOINTS row; this entry only contributes gemma-greeter→gemma to
      ROLE_TO_CLASS + its own context window.

  # ==========================================================================
  # ✅ APPLIED 2026-08-22 — tier3 IS DeepSeek-V4-Flash-0731, TP=2 across
  #   anvil (rank 0, :9083) + anvil2 (rank 1, headless), over a direct
  #   200GbE ConnectX-7 DAC. Plan: docs/anvil2_tier3_deepseek_v4_flash_plan_2026-08.md
  #
  #   Five places the DRAFTED block was WRONG, all corrected by measurement.
  #   Recorded because each cost real time and would otherwise be re-derived:
  #
  #   1. KV dtype is `fp8_ds_mla`, NOT `nvfp4_ds_mla` (D4's assumption).
  #      nvfp4_ds_mla is implemented ONLY by the B12X_MLA_SPARSE backend, and that
  #      path is gated behind _is_glm_moe_dsa_model() plus a calibrated per-layer
  #      scales file for a 78-layer GLM stack. It is a GLM path, not a DeepSeek-V4
  #      one. Forcing it does not fail cleanly -- it resolves away to another
  #      backend that then asserts about fp8 layouts, three layers from the cause.
  #   2. D4's 1M profile SURVIVED anyway. The plan predicted fp8 would cost the
  #      1M context (~500K). Measured pool: 1,717,142 tokens, 1.64x margin, and a
  #      994,120-token needle-in-haystack retrieved correctly.
  #   3. B12X_MLA_SPARSE is STRUCTURALLY UNUSABLE for this checkpoint: it accepts
  #      block_size exactly [64], the sliding-window group needs [256], so no
  #      common size exists ("No common block size for 64"). FLASHINFER_MLA_SPARSE_DSV4
  #      @ block 256 is the only coherent combination.
  #   4. slots is 6, not the drafted 20 carried over from Laguna.
  #   5. gpu-memory-utilization is 0.85, ratcheted from OUR TP=2 measurement, not
  #      the planned 0.78 -- at 0.78 the engine REFUSES TO BOOT at 1M ctx (KV
  #      available 9.41 GiB vs 11.04 GiB needed for one 1M request).
  #
  #   The serve config is vendored at infra/anvil/vllm/v4flash/ (tier3_env.sh
  #   holds the engine args; the two launchers are thin). Laguna stays on disk and
  #   as `vllm-tier3-laguna.service` on anvil until Phase 6 -- it is the only
  #   same-class rollback.
  # ==========================================================================

  reasoner:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: thinker
    role: llama-thinker
    # `reasoner` is this stanza's YAML key but was NOT a resolvable dispatch name
    # (build_role_to_class registers role + aliases, never the key), so callers
    # passing model="reasoner" 404'd with unknown_endpoint. Registered as an alias
    # so the semantic role name resolves to the live anvil thinker backend.
    # tier3 = canonical (2026-07-30 tier migration). `composer`/`companion`/`qwen-composer`/
    # `nexus-companion` were MOVED here from the nexus 122B stanza on 2026-07-30 — Phase B
    # step 4, "point composer/companion/reasoner/thinker aliases at tier3". Laguna is now the
    # single heavy tier. The abliterated 122B's `tier3_backup` stanza (nexus, on_demand,
    # `proxy_endpoint: false`) is REMOVED (2026-08-20) — it was manual-recovery-only and never
    # actually served (see `fallback:` below), and the same day's tier3->tier2-analyst failover
    # replaced automatically what it existed to provide by hand. The abliterated weights/unit
    # are being retired on nexus too; there is no longer a way to reach that capability
    # through the proxy.
    # Thinking: see the dispatch-side treatment landed in `50e2b6c50` — the key
    # is `chat_template_kwargs.thinking` because the serve script pins
    # `{"thinking": false}`, and `enable_thinking` works only incidentally
    # (V4's template accepts both). dsh sends the same key per-model via
    # `infra/dsh/plugins/collective-llm`.
    aliases: [tier3, reasoner, llama-thinker, thinker, composer, companion, qwen-composer, nexus-companion]
    host: anvil          # PRIMARY = rank 0, the box that serves `port` below
    # tier3 is the fleet's FIRST model spanning two boxes. anvil2 is rank 1 of
    # the V4-Flash TP=2 pair: --headless, serves no port of its own, and is
    # reachable only over the direct 200GbE DAC. It is listed here so surfaces
    # that show WHERE a model runs cannot claim tier3 lives on one box — the
    # Inference page card said exactly that until 2026-08-22, and would have kept
    # saying `anvil · healthy` with anvil2 dead.
    # Health for anvil2 itself comes from health-verifier's host_inventory (node_exporter
    # on :9100), NOT from here — meta.hosts is only a name->IP map.
    co_hosts: [anvil2]
    port: 9083
    backend_engine: vllm
    # `vllm-tier3.service` WRAPS the docker container (same pattern the retired
    # vllm-thinker.service used). VERIFIED ON THE BOX 2026-08-25:
    #   anvil  (rank 0) vllm-tier3.service        ExecStart=/opt/tier3/serve_v4flash_head.sh
    #   anvil2 (rank 1) vllm-tier3-worker.service ExecStart=/opt/tier3/serve_v4flash_worker.sh
    # The head script `source`s /opt/tier3/tier3_env.sh (the vendored copy of that env
    # file is infra/anvil/vllm/v4flash/tier3_env.sh — it is SOURCED, not the ExecStart).
    # 🚨 This comment previously said ExecStart=/opt/anvil-bench/serve_tier3_prod.sh.
    # That is the LAGUNA ROLLBACK script — still on disk, NOT what runs. Corrected
    # 2026-08-25; it had contradicted the note at `slots:` further down this same stanza.
    # ExecStop=docker stop vllm-tier3.
    # ⚠️ This field must be a REAL systemd unit — the anvil telemetry collector probes it with
    # `systemctl is-active`, and build_telemetry_units() DROPS any probed role with an empty
    # systemd_unit, which means NO health probe, NO metrics and NO health-verifier monitoring. It was ""
    # from the Phase B cutover until 2026-07-31, so tier3 ran unmonitored for that window;
    # test_model_naming_doctrine::test_telemetry_derive_is_complete is the guard.
    # The old `vllm-thinker` unit AND `vllm-thinker-watchdog` are stopped + DISABLED (there is
    # deliberately no watchdog on tier3) — do not send restart tooling at them.
    systemd_unit: vllm-tier3
    probe_kind: vllm
    served_model_names: [llama-thinker, thinker, tier3, reasoner, claude-sonnet-4-5, llama]
    model_family: DeepSeek-V4-Flash-0731 (sparse MoE, 284B total / 13B active) + in-model DSpark MTP drafter
    quant: MXFP4 routed experts (quantization-aware TRAINED, not post-hoc) + FP8 attention/dense/shared
    # Sparse MoE: 256 experts, top-10, 48 layers, hidden 3072.
    # 2026-08-03: these were previously ~6B/~120B, DERIVED from config.json on the belief that
    # poolside publish no parameter count. They DO — the launch material states 118B total /
    # 8B active — so these are now the vendor's numbers, not ours. The derived figures were in
    # the right neighbourhood but the active count was ~25% low, which matters when it is used
    # to reason about decode cost.
    params: {active: 13B, total: 284B}
    # 262144 = the SERVED window (--max-model-len) = THIS CHECKPOINT's ceiling. Raised
    # 131072 -> 262144 on 2026-07-30 with an explicit --kv-cache-memory of 26 GiB.
    #
    # ⚠️ CORRECTION: 262144 is NOT "Laguna's native context, unscaled" — an earlier version of
    # this comment said that and it was wrong twice over.
    #   * It IS rope-scaled: `rope_parameters.full_attention` is YaRN with factor 32.0 over an
    #     original_max_position_embeddings of 8192 (8192 x 32 = 262144).
    #   * The BASE repo `poolside/Laguna-S-2.1` ships YaRN factor **128.0 = 1,048,576 (1M)**.
    #     The INT4 and NVFP4 quants ship factor 32.0 instead. Weights are identical and YaRN is
    #     an inference-time RoPE transform, so 1M is a CONFIG cap here, not a weights limit —
    #     see the `laguna-1m-context` note about raising it (KV, not config, is the real bound:
    #     the pool holds 670,750 tokens, so ~670K is the practical ceiling regardless).
    #
    # Never go BELOW the retired 27B's 131072 without saying so out loud: the context gate
    # starts 422-ing requests that used to succeed, which is a silent capability regression
    # (caught 2026-07-30 by test_context_gate + test_timeout_events as `assert 422 == 200`).
    #
    # --max-model-len does NOT reserve memory; it only permits longer requests. Paged
    # attention allocates what a request actually uses, so typical ~8k traffic is unaffected
    # and only several CONCURRENT full-length requests contend for the pool.
    #
    # Raised to 700000 on 2026-07-30 via `--hf-overrides`, using the BASE repo's rope_parameters
    # VERBATIM (attention_factor is YaRN-factor-dependent — 1.4852 at factor 128 vs 1.3466 at 32
    # — so it must be copied, never hand-computed).
    # 1,048,576 and it is REAL: validated end-to-end 2026-08-22 with a needle-in-
    # haystack at 994,120 prompt tokens, retrieved correctly from mid-depth.
    # Measured KV pool 1,717,142 tokens => 1.64x margin at full context.
    # 🚨 A ~1M call costs ~974s of PREFILL -- OVER the inherited
    # _INTERACTIVE_CEILING_S = 600, under _BACKGROUND_CEILING_S = 1800.
    # Measured prefill curve (OURS): 32K 2,153 t/s . 133K ~1,980 . 273K 1,742 .
    # 548K 1,351 . 994K 1,020 -- the 600s interactive ceiling is crossed at roughly
    # 650-700K tokens. Ultra-long context is BACKGROUND-ONLY, measured not assumed.
    context_per_slot: 1048576
    # ⚠️ 700000 is a MEMORY bound, not a model bound. vLLM: "estimated maximum model length is
    # 723472" at our 26 GiB KV. The MODEL reaches 1,048,576, but that needs 37.16 GiB of KV and
    # the only ~11 GiB spare is the DFlash drafter — so 1M costs ~half the decode speed
    # (28-30 t/s -> ~15). Deliberately not taken.
    #
    # ⚠️ ULTRA-LONG IS BACKGROUND-ONLY. A 578,400-token request measured 794 s end-to-end
    # (prefill 729 tok/s — HALF the 1,426 tok/s seen at 213K; it degrades with length).
    # timeout_model caps interactive (P0-P2) at _INTERACTIVE_CEILING_S = 600 s, so an
    # interactive caller is killed around ~430K tokens. P3/P4 get 1800 s and fit. Anything
    # sending >400K MUST be background priority or it will time out.
    #
    # ✅ FIXED 2026-08-03 — this block used to warn that timeout_model.size_stretch SATURATED
    # at "size_max=4.0 x the 16384 top edge = 65,536 tokens" (the arithmetic was also wrong: 5 x
    # 16384 = 81,920), so a 578K prompt got the SAME 3.0x stretch as an 82K one. It was prose-only
    # with no guard, and it duly came true: a live 123,466-token `pool` prompt was killed three
    # times at exactly 540 s (= the 180 s thinker floor x a clamped 3.0x). size_stretch is now
    # superlinear in calibrated size UNITS and reaches 9.0x at 700K; _IN_EDGES gained
    # 32768/65536/131072/262144 so long context has real empirical cells instead of sharing one
    # bucket with 17K calls. Pinned by tests/llmproxy/test_timeout_sizing.py.
    #
    # ⚠️ The interactive/background split above still stands and is now the binding constraint
    # for long prompts: ultra-long remains BACKGROUND-ONLY.
    # 32768 is the ADMISSION/chunking value and is deliberately NOT the model's
    # window. The model serves 1,048,576 (see context_per_slot above, validated to
    # 994,120 real tokens) and infra/common/model_cards.yaml records THAT number.
    # The two disagree by 32x on purpose. Do not 'fix' this to 1048576: it would
    # change proxy admission and trip test_tier3_serve_script_doctrine.py.
    context_window: 32768            # fleet chunkers size against 32K on purpose
    # 6 = the backend's HARD cap (`--max-num-seqs 6` in the COMMON_ARGS array of
    # infra/anvil/vllm/v4flash/tier3_env.sh — NOT serve_tier3_prod.sh, which is now
    # only the Laguna rollback). vLLM does NOT expose --max-num-seqs over its API, so
    # this seed is the ONLY source of the proxy's admission ceiling; a stale value
    # over-admits (the surplus just queues at the backend, bypassing the proxy's DRR
    # fairness — a stale 32 once over-admitted the thinker by 12).
    # NOTE: llama.cpp roles self-correct via /props; vLLM ones like this do NOT — the
    # shadow reconciler warns on drift. Keep EQUAL to tier3_env.sh, which
    # test_tier3_serve_script_doctrine.py pins bidirectionally.
    #
    # 2026-08-22: 20 -> 6 at the V4-Flash TP=2 cutover. This is the validated 1M
    # profile's value, not a carry-over: max_num_seqs is a SCHEDULER concurrency cap,
    # and at 1M context the measured KV pool (1,717,142 tokens) admits only ~1.64
    # concurrent max-length requests anyway. Per-step activation stays bounded by
    # --max-num-batched-tokens 8192. Unlike Laguna's DFlash drafter, DSpark is
    # IN-MODEL (layers 40-42) so there is no separate drafter allocating outside
    # --gpu-memory-utilization — the mechanism that hard-hung this box twice.
    slots: 6
    timeout_floor_s: 180
    policy:
      # The identity of the WEIGHTS behind this endpoint, checked every poll
      # against what the backend actually reports (backend.probe_model_fingerprint).
      # Mismatch raises the `model_fingerprint_drift` WARNING.
      #
      # 🚨 THIS IS THE GUARD THAT WOULD HAVE CAUGHT 2026-08-23. Every
      # model-dependent line on this stanza — thinking_kwargs,
      # thinking_budget_ratio, disable_any_whitespace, documented_max_num_seqs,
      # model_family — is a claim about specific weights, and the served model
      # id CANNOT detect the weights changing (tier3 answers to the fixed alias
      # `llama-thinker` whatever is loaded behind it). Measured live 2026-08-24.
      # vLLM reports the weights PATH as `/v1/models[0].root`.
      #
      # UPDATE THIS IN THE SAME EDIT AS THE MODEL. A stale value here is loud
      # (an alert), which is the entire point — the previous failure was silent.
      model_fingerprint: "/srv/models/deepseek-v4-flash-0731"
      # Which chat-template variable switches REASONING on this model. Read by
      # llmproxy/config.py EndpointConfig.thinking_kwargs; the proxy injects
      # `<key>: false` here by default and a caller opts in per request with the
      # proxy's `thinking:` control field.
      #
      # 🚨 KEEP THIS NEXT TO `model_family` ABOVE AND CHANGE IT WITH THE MODEL.
      # This endpoint's switch was hardcoded to Qwen's `enable_thinking` in
      # backend.py, and the 2026-08-23 swap Qwen3.6 -> DeepSeek-V4-Flash sailed
      # past 15 cutover gates without one of them noticing, because V4's
      # template happens to accept BOTH names and the serve script separately
      # pins `--default-chat-template-kwargs '{"thinking":false}'`. Measured
      # 2026-08-24: `thinking:true` -> 556 chars of reasoning, `enable_thinking:
      # true` -> 518 chars, i.e. both live. `thinking` is the name the template
      # and the serve script actually agree on, so it leads the list.
      #
      # BOTH are listed because both are MEASURED to work on this template, not
      # as a hedge — and listing both keeps this convergent with the opt-in the
      # Songs lane landed in `bccff2c45`, which deliberately sets both. Drop
      # `enable_thinking` here the day tier3 moves to a template that does not
      # read it; that is a one-line edit in the same block as `model_family`,
      # which is the whole point of declaring it here.
      thinking_kwargs: [thinking, enable_thinking]
      background_floor_pct: 0.0
      fast_path_reserve_slots: 1
      # Step 4c: the backend's real --max-num-seqs (serve_tier3_prod.sh). Keep
      # EQUAL to `slots` above; the shadow reconciler warns if they drift (the
      # 32-vs-20 class). Update BOTH whenever serve_tier3_prod.sh changes.
      documented_max_num_seqs: 6
      # 2026-08-23: fraction of a request's max_tokens the model may spend on
      # REASONING. MIRRORS `--reasoning-config` in the vendored head launcher
      # (infra/anvil/vllm/v4flash/serve_tier3_v4flash_head.sh); vLLM honours
      # `thinking_token_budget` ONLY when the server was launched with that flag and
      # 400s the whole request otherwise, so this declaration is not a tuning knob —
      # it is a statement about how the backend was started. Pinned script⟺catalog in
      # BOTH directions by test_tier3_serve_script_doctrine.py.
      #
      # WHY IT EXISTS. Measured 2026-08-23, N=2, interleaved, streaming: with no cap
      # this model's natural reasoning length is BIMODAL — sometimes ~7-8k tokens and
      # a clean answer, sometimes past a 12,000-token ceiling with `content: ""` and
      # finish=length, which is 8-13 minutes of compute returning nothing. That is
      # very likely the "sporadic tier3 502" this file has recorded as unexplained;
      # `empty_completion_error` already names the shape. The cap bounds that TAIL.
      # It does not shorten the median, and it is deliberately generous for that
      # reason: at 0.6 of a 32,768-token request it clamps to the 16,000 ceiling and
      # never fires on a normal call.
      #
      # It COMPLEMENTS Correction.apply_thinking, which ADDS 8000 tokens of headroom
      # on the proxy's own `thinking: true` opt-in — that makes the allowance bigger,
      # this stops reasoning consuming all of it. Different callers, both needed: dsh
      # sets chat_template_kwargs directly and never sends the opt-in field.
      thinking_budget_ratio: 0.6
      # 2026-08-01: MIRRORS a host-side serve-script launch flag the proxy cannot
      # introspect — exactly like `documented_max_num_seqs` above. The flag is
      # `--structured-outputs-config '{"backend":"guidance","disable_any_whitespace":true}'`
      # in the VENDORED script `infra/anvil/vllm/serve_tier3_prod.sh` (anvil runs
      # its own copy at /opt/anvil-bench/serve_tier3_prod.sh — the two must change
      # together). test_tier3_serve_script_doctrine.py pins script⟺catalog in BOTH
      # directions, so removing the server flag forces removing this declaration.
      #
      # Why the proxy needs to KNOW: with whitespace banned, the two-character
      # document `{}` is a legal, complete, zero-whitespace JSON object — so a BARE
      # `response_format:{"type":"json_object"}` makes `{}` the greedy path and every
      # such call returns it with finish_reason=stop. Measured live 2026-08-01 on this
      # endpoint with sidekick's real critic prompt: no response_format -> 549 chars of valid
      # JSON; bare json_object -> `{}` (2 chars); strict json_schema with `required` ->
      # 241 chars of valid JSON. Correction.apply_json_object_guard reads this flag and
      # STRIPS bare json_object (it does not substitute a permissive schema — `{}`
      # satisfies `{"type":"object"}` with no `required`, so the bug would survive).
      # Regression ledger: `tier3-json-object-empty-brace`.
      # disable_any_whitespace DELIBERATELY ABSENT (it was true for Laguna).
      # Ledger `disable_any_whitespace_is_declared_in_the_catalog`: banning
      # whitespace makes a bare `json_object` grammar legal to close immediately,
      # so tier3 returned "{}" -- 2 chars, and VALID -- 10/10. The V4 serve script
      # passes NO --structured-outputs-config, and structured output measured 10/10
      # well-formed and non-empty without it (2026-08-22). The doctrine test pins
      # script <-> catalog bidirectionally, so these two stay absent together.
      # § 9.7 — minimum time spent in degraded mode (serving from `fallback:`)
      # before returning here, even once this endpoint is healthy again AND the
      # degraded cohort has drained to zero.
      #
      # NOT redundant with the drain, which is the mistake it exists to prevent:
      # drain alone means a tier3 flapping every 30s produces a model flip at
      # every request boundary every 30s. 120s is a STARTING value, not a
      # measured one — re-derive it from the observed flap interval the first
      # time this fires in anger, and say so in the plan doc when you do.
      # ⚠️ A policy key not listed in model_catalog.build_endpoint_kwargs()'s
      # copy tuple is SILENTLY DROPPED; this one is pinned by
      # test_failover.py::test_dwell_reaches_endpoint_config.
      failover_dwell_s: 120
    capabilities:
      vision: false
      streaming: true
      # Hybrid thinking model, OFF by default at the server
      # (--default-chat-template-kwargs '{"thinking":false}'); callers opt IN per
      # request via chat_template_kwargs {"thinking": true}. Verified 2026-08-22.
      # 🚨 The response key is `reasoning`. `reasoning_content` is ALWAYS EMPTY on
      # this runtime -- a client reading it sees nothing and concludes reasoning is
      # broken. Opposite polarity to the Laguna trap, identical shape.
      # 🚨 Do NOT flip the default ON: reasoning spends the budget BEFORE content,
      # and tier3's measured mean output is 172 tokens/req. At max_tokens=200
      # thinking returned EMPTY content 3/5; at 400, 1/5; at 800+, 0/5. Opt-in
      # lanes should use max_tokens >= 800. Also measured: with thinking ON a
      # structured call emits a reasoning field 8/8 (vLLM #41132) -- pure overhead
      # on extraction paths, so keep structured calls thinking-off.
      reasoning: true
      tool_calling: true
      structured_output: auto      # no --structured-outputs-config; see policy note above
    # OURS, measured 2026-08-22 warm, stream:false, reading usage.completion_tokens
    # (streamed deltas under spec-decode count steps/s and under-report ~4x):
    # code 61.1 t/s, prose 32.8 t/s. Incumbent Laguna measured 43.9 / 30.6.
    # DSpark acceptance 47.9% pooled over 2,022 drafts, effective k=5.
    token_speed: {decode_tok_s_at_1: 61, aggregate_tok_s_full: 120}
    purpose: Heavy MoE reasoning + agentic-coding tier (tier3 — the fleet's deepest model), TP=2 across anvil + anvil2.
    when_used:
      - knowledge extraction, news synthesis, thread/device enrichment
      - browser-broker default, forum-agent thread summary
    # 🚨 `fallback:` IS NOW LOAD-BEARING (§ 9 of the anvil2/V4-Flash plan,
    # implemented 2026-08-20). It was advisory metadata that nothing consumed
    # for routing — this stanza's own comments said so, and the tier3_backup it
    # named was `proxy_endpoint: false`, i.e. a declared backup that could not
    # serve. It now declares the endpoint CLASS this one degrades to while it is
    # unhealthy: opted-in callers (llmproxy/agents.yaml `degrade_ok`) are served
    # by tier2-analyst instead of getting a 503, and everyone else gets the same
    # clean 503 as before, labelled and with Retry-After.
    #
    # `creative` is tier2-analyst's endpoint class (the boxa, :9196). It is NOT
    # registered as an alias of anything here: aliasing is precisely what made
    # `tier3-backup -> companion -> thinker` non-idempotent and served every
    # backup request from tier3 itself (ledger `endpoint-class-alias-collision`).
    #
    # Guards: test_failover.py::test_declared_fallbacks_resolve_to_live_endpoints
    # (a fallback must name a LIVE, ACTIVE proxy endpoint — the moment a field
    # becomes load-bearing it needs a guard or it rots back into a comment) and
    # test_model_naming_doctrine.py::test_catalog_loads_and_is_consistent.
    fallback: creative
    notes: |
      TIER 3 — DeepSeek-V4-Flash-0731 on vLLM, TENSOR-PARALLEL ACROSS TWO BOXES:
      anvil (10.0.0.3) is rank 0 and serves :9083; anvil2 (10.0.0.29) is rank 1
      and is --headless, serving no port of its own. They are joined by a direct
      200GbE ConnectX-7 DAC (no switch). Image is pinned BY DIGEST to
      eugr/spark-vllm-b12x@sha256:52f8e633… (nightly-20260822); the serve config is
      infra/anvil/vllm/v4flash/tier3_env.sh. DSpark MTP is IN-MODEL (no separate
      drafter checkpoint) at num_speculative_tokens=5. Weights are on each node's
      LOCAL NVMe at /srv/models/deepseek-v4-flash-0731 (155.44 GiB per node) — NOT
      the nasbox share, so tier3 no longer fails to boot when that share is away.

      Measured at cutover 2026-08-22 (warm, stream:false, usage.completion_tokens —
      streamed deltas under spec-decode count steps/s and under-report ~4x):
      decode 61.1 t/s code / 32.8 t/s prose; DSpark acceptance 73.8% on code and
      28.5% on prose (the pooled figure is workload-dependent, so quote the split);
      prefix-cache hit 99% on a repeated 21K prefix; mixed-traffic c4 soak 328 req,
      0 errors, ~83 t/s aggregate / ~21 per-stream. Full 1M context VALIDATED with a
      994,120-token needle-in-haystack retrieved correctly from mid-depth.

      ⚠️ A ~1M call costs ~974s of PREFILL, over the inherited 600s interactive
      ceiling — ultra-long context is BACKGROUND-ONLY. See context_per_slot above.

      --- history below refers to the RETIRED Laguna S 2.1, kept for archaeology ---
      TIER 3 was Laguna S 2.1 INT4 on vLLM (anvil/GB10, sm_121a image
      ghcr.io/timothystewart6/vllm-gb10), with the MATCHED Laguna-S-2.1-DFlash-INT4
      drafter at num_speculative_tokens=3. Replaced the dense Qwen3.6-27B NVFP4 on
      2026-07-30. Weights lived on the NVMe-backed `llmmodels` share (67 GB + 2.1 GB).

      Measured at cutover: decode 29.9 t/s, DFlash acceptance 43.1% (2.29 tok/forward),
      prefix-cache hit 64-70%. Prefix caching WORKS here — it was structurally 0% on
      Qwen3.5's DeltaNet hybrid — which matters a lot on a prefill-dominated load.

      KV sizing is EXPLICIT: `--kv-cache-memory 27917287424` (26 GiB) rather than letting the
      util number decide what is left over. Measured 2026-07-30: 670,750 KV tokens
      (~41.6 KiB/token), 2.56x concurrency at a full 256K request.

      ⚠️ Host headroom is **~8 GiB under load, NOT the ~12 GiB you see just after startup** —
      the idle figure is measured before KV blocks are actually touched, and it drops once real
      traffic populates the pool. Budget against 8. That is the number to use before deciding
      anything else can move onto this box: the two hard-hangs happened at ~0 GiB free, and on
      a unified-memory box the reserve IS the recovery path (no shell ⇒ no `docker rm` ⇒
      operator power cycle). Do NOT take another 6 GiB on the strength of the idle number.
      Prefer this lever over --gpu-memory-utilization: util is "whatever remains after weights,
      activation and cudagraphs", which is exactly what makes it easy to get wrong when a
      drafter is also allocating outside the budget. vLLM prints the suggested value at startup.

      🚨 `disable_any_whitespace: true` IS LOAD-BEARING — do not drop it (fixed 2026-07-31).
      Without it, structured output RUNS AWAY on whitespace. A real durability-gate pass
      produced, 10 times out of 10:
          completion_tokens = 1540 (the entire budget)
          real content      = 54 chars: `{"notes": [{"n": 1, "holds": true`
          trailing          = 3032 chars of pure whitespace (2274 spaces, 758 \n)
      The model reaches a STRUCTURAL position — where a `,` must precede the next
      required key — and the grammar also permits whitespace there, so greedy decoding
      emits whitespace until the budget dies. `disable_any_whitespace` removes that
      freedom. After: 0/10 runaway, median 7.6 s (was 29 s), no measured cost to plain
      chat (2.17 s / ~25 tok/s, unchanged).

      `maxLength` IS and always WAS enforced — at 20/40/60/80/100/120 the longest emitted
      string equals the bound EXACTLY, before and after the fix. Anyone reporting
      "tier3 ignores maxLength" has met THIS bug, not a bound failure.

      What it is NOT, all measured, so nobody re-runs these:
        * NOT the backend — `xgrammar` reproduced it 10/10 too (and is otherwise worse).
        * NOT speculative decoding — 10/10 with DFlash disabled (and disabling it costs
          ~26 -> ~19 tok/s, so it stays ON).
        * NOT temperature (2/3 at 0.7), NOT item count (3/3 at maxItems=6+minItems=6),
          NOT `additionalProperties`.
        * A synthetic schema reproduced only ~2/50 — DO NOT conclude "fine" from a toy.
      Proxy-side fallback if the flag is ever unavailable: `frequency_penalty=0.2` gave
      4/4 clean (0.5 over-corrects). Do NOT use `stop` on runs of whitespace — it fires
      on pretty-printed JSON indentation and truncates at ~14 tokens.

      ⚠️ Why this hid for so long: the proxy turns the truncation into a 502 and callers
      turn a 502 into "", so a silently-dead gate looks exactly like "the model had
      nothing to say". Each occurrence also burned 30-60 s of a tier3 slot.
      The backend/flags are server-level; they CANNOT be overridden per request —
      verified, all three override shapes were ignored or rejected.

      🚨 `--long-prefill-token-threshold 1024` IS SLOT FAIRNESS (2026-07-31).
      It caps how many prefill tokens ONE request may take per scheduler step, BEFORE
      the shared `--max-num-batched-tokens 8192` budget is applied
      (vllm/v1/core/sched/scheduler.py:507). Without it a single giant prefill owns the
      whole budget for ~25 consecutive steps and nothing else prefills at all.

      Measured with one 100K-token request in flight alongside short interactive ones.
      Read the WORST short request, not the median — the median hides it completely,
      because only the FIRST short request is starved and the rest run free:

          threshold   worst short   long request
          none(8192)     45.26 s       49.2 s     <- one caller stalled 100x
          4096            9.76 s       49.1 s
          2048            4.16 s       50.0 s
          1024            1.86 s       51.5 s     <- CHOSEN

      1024 buys a 24x better interactive tail for 4.7% on the giant. That is the right
      direction because this stanza ALREADY declares ultra-long traffic background-only,
      and a 45 s stall reads to a caller as a hang and blows _INTERACTIVE_CEILING_S.

      🚨 ATTENTION BACKEND IS FLASHINFER, AND THAT IS DELIBERATE (2026-08-04).
      `docs/inference_thinker_triton_attn_fix.md` (2026-06-03) moved the THEN-current
      model to TRITON_ATTN. Do not carry that conclusion to Laguna S 2.1 — it was
      measured on Qwen3.6-27B where the two tied. Head-to-head on THIS model, identical
      prompts, 3 reps:

          backend       small conc1   200k decode   200k cold TTFT   worst-short
          triton_attn      26.0          5.1 t/s        10.95 s         7.81 s
          FLASHINFER       25.6         10.7 t/s         7.06 s         3.54 s

      Small context ties; FlashInfer is 2.1x on long-context decode and 2.2x better on
      the interactive tail (the giant occupies the engine 133 s vs 272 s). Overnight
      big-context work is exactly where triton loses.
      ALSO: that doc's mechanism (`VLLM_ATTENTION_BACKEND=...`) is a SILENT NO-OP on
      vLLM 0.26.1 — the env var does not exist in the package. Forcing triton now needs
      the CLI flag PLUS `attention_backend` inside `--speculative-config` (the draft
      model otherwise falls through to priority selection, and FLASHINFER wins).

      ⛔ TWO TUNING FLAGS THAT CANNOT WORK HERE — do not retry (each costs a 40-min
      window to rediscover, because both present as a boot hang, not an error):
        * `--moe-backend triton` (Poolside's OWN published recipe) ->
          `ValueError: moe_backend='triton' is not supported for WNA16 MoE.
           Expected one of ['marlin','humming','flashinfer_trtllm','emulation']`.
          Their recipe assumes a different quantization; ours is WNA16 -> MARLIN.
        * `--kv-cache-dtype-skip-layers sliding_window` (vLLM's own recommended FP8
          variant) -> `AssertionError: page_size_padded >= unpadded_page_size_bytes`
          in `unify_kv_cache_spec_page_size`. Mixed fp8/bf16 KV yields unequal page
          sizes the hybrid coordinator cannot unify — a direct consequence of this
          model's 12 full + 36 sliding attention split.
      Idle short latency was 0.30 s at every setting — normal traffic pays nothing.
      Our real distribution (1157 reqs) is 96% <=10k tokens, 0.7% >50k, so the giants
      this protects against are rare but severe.

      ⚠️ `--max-num-partial-prefills` / `--max-long-partial-prefills` are NOT usable:
      vLLM's V1 engine raises `NotImplementedError: Concurrent Partial Prefill is not
      supported` at startup (engine/arg_utils.py `_check_feature_supported`) and
      crash-loops. The fields exist on the legacy SchedulerConfig, which makes them look
      available — they are not. Only the threshold is honoured. Don't re-try them.

      🚨 TWO LOAD-BEARING FLAGS. Neither is cosmetic. ⚠️ They are gated by
      `tier3_gates.py`, which lives ONLY on anvil (`/opt/anvil-bench/`) and is NOT in
      this repo — so neither CI nor ship.sh can run it, and nothing here will catch a
      regression in these two flags. Treat the text below as the authority and verify
      against serve_tier3_prod.sh on the box.
      ⚠️ Both entries below were WRONG until 2026-07-31 and each would have sent a reader
      to "correct" the live config into a broken state. Verify against
      serve_tier3_prod.sh, which is the truth.

      1. `--default-chat-template-kwargs '{"enable_thinking": false}'` — FALSE, not true.
         The mechanism is real: Laguna's chat template defaults enable_thinking=true,
         while vLLM's DeepSeekV3-derived `poolside_v1` reasoning parser defaults it
         FALSE and then installs an IdentityReasoningParser that separates NOTHING, so
         any caller sending no chat_template_kwargs — EVERY fleet caller — got raw
         chain-of-thought plus a stray `</think>` inside `content`.
         But setting it TRUE (the first fix, which this comment used to prescribe) is
         WORSE: the model then spends the whole budget reasoning and returns NOTHING.
         Measured: max_tokens=120 thinking=true -> out=120, finish=length, content_len=0,
         status=ok — no error, no alert, callers just got empty strings.
         FALSE fixes both: no thinking is generated, so there is nothing to leak.
         The reason the leak "fix" looked verified was an ABSENCE assertion
         (`"</think>" not in content`), which an empty string also satisfies. Gate G4
         must assert a POSITIVE property (non-empty, finish_reason=stop) too.
         🚨 WHEN A CALLER OPTS IN (`thinking: true`), TWO THINGS SUPPRESS THE <think>
         IT ASKED FOR — both silently, both looking exactly like "the model chose not
         to reason". Measured 2026-08-02 against this endpoint, streamed, one unique
         payload per request so nothing came from the proxy's identical-payload cache
         (the first cut of the history row WAS cache-confounded — three identical
         102-char replies — so re-check that before trusting a repeat):
             [user]                    reasoned 4/4   (1321-3339 chars)
             [user, assistant, user]   reasoned 0/4   <- ONE prior assistant turn
             [system, user]            reasoned 1/4   (vs 4/4 without a system role)
         The system-message case is the known template quirk, and the proxy's fold
         (correction.fold_system_for_thinking) RAISES the rate without closing it.
         The HISTORY case is not documented anywhere else and is the harder one:
         treat `thinking: true` as a FIRST-TURN capability here. Any multi-turn
         caller that opts in gets reasoning on turn 1 and silently never again.
         Nothing in the proxy compensates for this today — a wrong guess would
         corrupt replayed history, so it is surfaced to the user instead (the
         Playground warns at the toggle and on any zero-reasoning turn).
         ⚠️ Also: reasoning streams as `delta.reasoning` on this backend, NOT
         `delta.reasoning_content`. A reader matching only the latter drops the whole
         reasoning stream and reports zero while usage shows the tokens were spent.
      2. `--gpu-memory-utilization 0.81` is the live value; the old "0.72 is a HARD
         CEILING" line described a DIFFERENT configuration and no longer applies.
         When util sized the KV pool, 0.72 was the ceiling and 0.78 + a drafter
         hard-hung anvil twice on 2026-07-30, each needing an operator power cycle.
         We now pass `--kv-cache-memory 27917287424` (26 GiB), which sizes the pool
         DIRECTLY, so util is a bound rather than the allocator and 0.81 is stable
         (re-measured 2026-07-31 at 20 slots: 11 GiB free after load).
         ⚠️ The underlying HAZARD is unchanged and is about the MECHANISM, not the
         number: a spec-decode drafter allocates OUTSIDE the util budget. Re-measure
         headroom after any change that adds concurrency or a drafter.

      Structured outputs use the `guidance` backend (see `structured_output: guidance`
      below) — NOT llama.cpp GBNF, which is the `creative`/tier2 stanza's backend.
      Verified 2026-07-31 with a real json_schema call: 29 tokens, finish_reason=stop,
      valid parseable JSON.

      TRUNCATION, re-measured after the disable_any_whitespace fix (2026-07-31):
        pre-fix : 0.104% overall (28 / 26,993 per 24h), dominated by the runaway
        post-fix: 0.155% overall (11 / 7,095 per 4h) — but the COMPOSITION inverted
                  and that is the number that matters:
                    * structured truncation is now 1 in 7,095 = 0.014%
                    * 8 of the 11 are `structured=False` — plain generations hitting
                      a small cap, i.e. CALLER under-budgeting, not a tier3 defect
                    * 6 of those 8 were one burst from `lan-generic.openai_compat`
                      at max_tokens=512 inside 5 seconds
        The single structured case was `forum-agent.thread_summary`, which uses
        `response_format: {"type":"json_object"}` (no schema, 800-token cap) — a long
        summary hitting its budget, not a structural-position runaway.
      ⚠️ Do NOT read the overall rate going 0.104% -> 0.155% as a regression. The
      runaway class it was measuring is gone (the real gate went 10/10 -> 0/10); what
      is left is a different, caller-side phenomenon that the earlier number was
      never isolating.
      Known log noise: `discord.schema_smoke` truncates repeatedly at max_tokens=96,
      which is a smoke test with a deliberately tiny budget — it is not a fault, but
      it does dilute this signal.

      Tool calling and reasoning both use `poolside_v1` (Laguna's template is
      GLM-derived: `<tool_call>name<arg_key>k</arg_key><arg_value>v</arg_value>`).
      Served window is 32K (down from the 27B's 128K), matching the fleet chunkers.

