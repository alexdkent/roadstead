decommissioned:
  classify-anvil:
    aliases: [qwen-classify, classify, chat, nexus-chat]
    host: anvil
    port: 9092
    retired: 2026-07-11
    notes: |
      The anvil `llama-classify.service` (Qwen3.6-35B-A3B UD-Q4_K_M + native mmproj on the GB10
      CUDA, :9092, kv-unified 131072/4 slots, evictable co-tenant of the imagegen/videogen
      dispatcher). RE-HOMED onto the always-resident boxa `creative` endpoint (:9196) in the
      2026-07-11 three-role consolidation (creative + companion-lite + classify on one abliterated
      Qwen3.6-35B-A3B). Its role names — `classify`/`qwen-classify`/`chat`/`nexus-chat` plus the
      analyst/vision aliases below — are now ALIASES of `creative`. Motivation: creative is used
      ~6.4x more than classify, so classify was the light model; moving it to its own card fixes its
      ~36s p95 queue-wait AND frees the anvil GB10 for imagegen/videogen (no more eviction dance).
      The anvil unit is stopped+disabled (unit file + GGUF kept for rollback); the classify eviction
      coupling in anvil_dispatcher/classify_evict.py is disabled and imagegen's idle-unload timeout
      was relaxed since nothing competes for the card now. Behavior-preserving: same weights/mmproj,
      same 32K chunking policy, reasoning-off, grammar tool-calling. Prior history (nexus->anvil
      migration 2026-07-09, the 2026-07-02 3-way classify bake-off, the 2026-07-03 vision
      consolidation) is in git + the bench_results/ docs referenced by the old analyst entries below.
  analyst:
