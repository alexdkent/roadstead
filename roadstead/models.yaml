      control — pinned en-US and `auto` scored identically); pinning the WRONG
      language returns an EMPTY transcript, not a wrong one.

  # ---------------------------------------------------------------- media / generation
  # All dispatcher-managed, on-demand (GPU-slot lease). Keyed by
  # dispatcher_capability; `unit` is the systemd unit the dispatcher brokers.
  imagegen:
    kind: media
    status: on_demand
    proxy_endpoint: false
    role: flux1-imagegen
    aliases: [flux1-imagegen, anvil-imagegen, nexus-imagegen]
    # 2026-07-31 Phase E: MOVED anvil -> nexus (ROCm/gfx1151), unit `nexus-imagegen`.
    # anvil's copy was DELETED with its 166 GB of weights — it is not a rollback target.
    # The `anvil-imagegen` alias is nevertheless KEPT (2026-08-30): it is DATA, not a name.
    # It is still the tenant key `anvil_dispatcher`'s MODEL_REGISTRY brokers the GPU slot
    # under, and health-verifier's catalog-drift scenario reconciles against it. Dropping it here
    # while the dispatcher side is unrenamed would break that join, so both sides move
    # together or not at all — the package/dir/deploy-path rename of 2026-08-30 deliberately
    # stopped short of it.
    host: nexus
    port: 9210
    backend_engine: shim
    dispatcher_capability: image_diffusers
    dispatcher_capability_aliases: [image_fast, image_hq]
    dispatcher_unit_key: nexus-imagegen
    unit: nexus-imagegen.service
    manage_process: false            # self-managing; dispatcher brokers the slot only
    health_path: /healthz
    warmup_sec: 15
    model_family: Diffusers (Flux / SDXL, ~150 swappable checkpoints)
    purpose: On-demand image generation.
    when_used:
      - Image Studio, sidekick/dj artwork
    fallback: null
    notes: |
      Hosts ~150 swappable checkpoints behind one FastAPI — the per-checkpoint
      sub-registry lives in infra/imagegen/models.yaml (a finer
      granularity; NOT folded into this authority). On nexus that sub-registry is
      /opt/imagegen/registry.yaml (25 rows, 16 with weights present) plus
      /opt/imagegen/loras.yaml (103 LoRAs).

      🚨 REQUIRES A GPU-SLOT DISPATCHER. imagegen leases a slot from `nexus-dispatcher`
      (:9201) before committing VRAM; without it EVERY generate fails immediately with
      "dispatcher /ensure unreachable". That dispatcher was ported from anvil with the
      service — it is not optional infrastructure.

      ⚠️ BULK `to("cuda")` IS PATHOLOGICALLY SLOW ON gfx1151 — OPEN ISSUE, NOT YET ROOT-CAUSED.
      Measured 2026-07-31 on a 7 GiB SDXL checkpoint: disk 4.1 GB/s, `from_pretrained` 0.4 s,
      then `to("cuda")` runs >400 s ALONE on an idle box (97 GiB free) and 10-25 min under
      load. That is ~4-17 MB/s for a copy that on a UNIFIED-memory part should barely copy at
      all. Ruled OUT by measurement, each disproved in turn:
        * HSA_ENABLE_SDMA — same slowness at 0 and 1.
        * the venv — /opt/rocmtest/venv (no torchvision) is equally slow.
        * GPU contention — still slow with the box quiet and nothing else loaded.
      🔑 STRONG LEAD: the earlier "SDXL is fine on nexus, 18 s" result was per-IMAGE
      GENERATION, not load, and it used `enable_model_cpu_offload()` — which streams layers on
      demand and therefore NEVER performs a bulk to("cuda"). Generation itself is healthy
      (~20 s/image). So the cost is specifically the fully-resident bulk transfer the service
      does, and offload may sidestep it entirely. Worth testing before accepting the timeouts
      below as permanent.
      ⚠️ Do NOT claim parity with anvil: anvil can no longer load these checkpoints at all
      (tier3 leaves ~8 GiB against a ~22 GiB need), so no same-model baseline exists. An earlier
      revision of this note asserted "not a regression from the move" on the strength of
      anvil's registry comment about 17-24 GB DiT models — a different, much larger class.
      That claim was not supported and has been withdrawn.
      Same-checkpoint reuse IS cheap (SDXL variants 15-20 s once resident). Mitigated in the unit: IMAGEGEN_IDLE_UNLOAD_S=5400 and
      IMAGEGEN_GENERATION_TIMEOUT_S=3600 — the service counts model LOAD inside the
      generation deadline, so the default 960 s failed healthy loads.

      Also on nexus: HSA_ENABLE_SDMA=0 (gfx1151 libhsa segfault), diffusers needs
      variant="fp16", and a /models -> /srv/models/imagegen symlink covers aux paths that are
      hardcoded absolute with no env override (e.g. hand_detect).

  meshgen:
    kind: media
    status: on_demand
    proxy_endpoint: false
    role: hunyuan3d-meshgen
    aliases: [hunyuan3d-meshgen, nexus-meshgen, mesh_generate]
    # NEW 2026-08-11, promoted from the D13 experiment (E1/E3 in
    # mesh_generation_nexus_design.md): shape-only, hy3dpaint/ (the texture
    # half — the half that fails on ROCm and printing does not need) never
    # installed. 10/10 generations, 10/10 watertight, 10/10 winding-consistent,
    # median 505s, on torch==2.13.0+rocm7.2 / torchvision==0.28.0+rocm7.2 — the
    # SAME matched pair `imagegen` already validates on this box.
    host: nexus
    port: 9212
    backend_engine: shim
    dispatcher_capability: mesh_generate
    dispatcher_unit_key: nexus-meshgen
    unit: nexus-meshgen.service
    manage_process: false            # self-managing; dispatcher brokers the slot only
    health_path: /healthz
    warmup_sec: 15
    model_family: Hunyuan3D-2.1 (hy3dshape, shape-only)
    purpose: On-demand image-to-mesh generation (raw geometry, no gate/repair).
    when_used:
      - Workshop / prusa organic-lane mesh generation (image -> mesh)
    fallback: null
    notes: |
      RAW GENERATION ONLY — image in, mesh out. Does NOT gate, scale or repair
      its own output; a caller wanting a printable mesh composes THIS service
      with CTnnn's own `POST /gate` (mesh in, Measurement + GateVerdict out —
      built concurrently, mesh_generation_nexus_design.md E-results III), a
      separate service on a separate host. Neither service calls the other.
      A caller MUST NOT treat a mesh from this service as print-ready on its
      own. Measured gate pass rate pre-repair-ladder (E1/E3, offline harness):
      20% first try, 30-40% after a scale/thicken ladder that the design doc's
      own verdict says NOT to build (E3: "Do not build the thickening rung" —
      the residual refusals are a measurement artifact of CTnnn's 8000-face wall
      probe, not real thinness). Treat this entry as a raw geometry generator,
      not a finished printability pipeline.

      🚨 REQUIRES A GPU-SLOT DISPATCHER, same as imagegen — leases from
      `nexus-dispatcher` (:9201) before committing VRAM. UNLIKE imagegen it
      does NOT stay resident between jobs: the lease is held for the duration
      of ONE generation only (~505s measured) and released immediately after,
      because reload cost (~14s) is trivial against generation time — see
      nexus_meshgen/server.py's module docstring for the full lease-chaining
      rationale (a caller sequencing imagegen -> meshgen must let imagegen's
      own request complete and release before calling meshgen; never hold one
      dispatcher lease open while acquiring the other in the same task, which
      is the reentrant deadlock this design avoids structurally).

      Own venv (/opt/meshgen-venv) — nexus's per-service venvs are mutually
      incompatible, do not consolidate. hy3dshape source + weights (13.8 GB:
      HF cache + hy3dgen's own second copy) are NOT vendored by
      infra/nexus/scripts/manifest.sh (too large); only the FastAPI server
      package (nexus_meshgen/) is tracked there. octree_resolution=512 is
      the non-negotiable default (256 is 2x nozzle width on a 0.4mm nozzle).

      NEW 2026-08-12: `POST /generate` takes an optional `generator` field
      (default "hunyuan3d-2.1"; "triposg" selectable, unknown value = 400)
      and a new `POST /preprocess` returns the conditioning image with no
      generation and no lease. TripoSG runs in its OWN subprocess/venv
      (/opt/triposg-venv, weights at /srv/models/triposg, ~23.5 GB) and is
      NOT a separate catalog entry here — see mesh_generation_nexus_design.md
      E-results IX for why (one service, one host:port, one dispatcher
      capability; the generator choice is a body parameter on this same
      route, not a second routable model). Measured typical_s: hunyuan 535,
      triposg 132 (~4x, not the ~11x first inferred from diffusion-time-alone).

