    host: nexus
    port: 8080
    retired: 2026-07-03
    notes: |
      Qwen3-VL-30B-A3B-Instruct — fully replaced by `classify` (Qwen3.6-35B-A3B
      + mmproj, :8091), same day as the composer 122B swap and the
      analyst-vision consolidation below. Nexus runs exactly TWO models:
      `composer` (:8081) and `classify` (:8091) — no third on-demand/fallback
      tier. `llama-vision.service` is stopped+disabled on nexus (unit file +
      GGUF kept on disk for rollback only, per the repo's stated rollback
      doctrine — NOT a routinely-reachable escalation path). Freed ~17.7 GiB
