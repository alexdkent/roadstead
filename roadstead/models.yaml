# ===========================================================================
# THE model naming + capability AUTHORITY for the whole fleet.
#
# This file is owned by the LLM proxy and is the SINGLE SOURCE OF TRUTH for
# every model the fleet runs — chat / embed / rerank / vision / speech / media.
# The proxy routing table, the framework client port+alias maps, the gateway
# facade, the telemetry UNITS, the dispatcher registry, the model cards, the
# frontend catalog and the `inferctl models` CLI all DERIVE from this file
# (see originfleet/llmproxy/model_catalog.py). Do not hand-maintain those
# copies — edit HERE.
#
# Naming strategy: FUNCTION-BASED. The top-level key names the JOB
# (router / analyst / composer / reasoner / creative / embed / rerank / ocr /
# tts / stt / imagegen / ...). The model family is an ATTRIBUTE that may change
# without renaming the role. Old names live on under `aliases:` so existing
# callers keep working through a compat window.
#
# ---------------------------------------------------------------------------
# WHEN YOU ADD / MOVE / RENAME / RETIRE A MODEL — edit THIS file first, then:
#   add     → set status:active; drop a systemd unit on the box + `sync-to-*`;
#             add the name to the vLLM `--served-model-name` list if vLLM;
#             verify the frontend catalog row renders (parity gate);
#             confirm telemetry UNITS probe + dashboard tile appear.
#   move    → change host/port here; edit the unit + redeploy that box.
#   rename  → change the key; move the old name into `aliases:` (auto-resolves).
#   retire  → set status:decommissioned; disable/remove the unit; drop the
#             served-model-name alias.
# The doctrine test (tests/framework/test_model_naming_doctrine.py) FAILS if a
# role string / served-model-name / port can't resolve to an entry here, so a
# forgotten location can't merge silently. Full checklist: `model-selection` skill.
# ---------------------------------------------------------------------------
#
# Field reference (per entry):
#   kind            chat | embed | rerank | ocr | tts | stt | diarize | stream | media
#   status          active | on_demand | planned | deprecated | decommissioned
#                   (planned = name/port reserved but NOT deployed — not live)
#   aliases         every legacy / shorthand name that must resolve to this entry
#   host            nexus | anvil | nasbox   (resolved to IP via meta.hosts + env)
#   port            backend port on `host`
#   proxy_endpoint  true if this role OWNS the DEFAULT_ENDPOINTS[endpoint_class]
#                   row (chat/embed/rerank roles routed by the proxy). false for
#                   facade-only (ocr/tts/stt/...) and media (dispatcher) roles.
#   endpoint_class  the proxy QoS class (only for proxy_endpoint / shared roles)
#   role            the proxy EndpointConfig.role / telemetry role string (the
#                   pre-rename canonical — kept until the call-site sweep lands)
#   backend_engine  llama.cpp | vllm | shim
#   served_model_names  vLLM --served-model-name tokens that MUST match here
#   context_per_slot    proxy EndpointConfig seed (live value comes from /props)
#   context_window      framework chunker/preflight default (_DEFAULT_CONTEXT_WINDOW)
#   slots               max_slots seed
#   timeout_floor_s     per-class floor (llmproxy/timeout_model.FLOOR_S)
#   policy.*            EndpointConfig knobs (reserve / floor_pct / cap / affinity / skip_discovery)
#   capabilities.*      vision / streaming / reasoning / tool_calling / structured_output
#   dispatcher_capability   media: the GenerationCapability key the dispatcher uses
#   unit                media: systemd unit name
#   token_speed         approx decode throughput / latency note (advisory)
# ===========================================================================

meta:
  hosts:
    nexus: 10.0.0.6
    anvil: 10.0.0.3
    nasbox: 10.0.0.10
  # Provider context-window values preserved VERBATIM for callers/DB rows that
  # are not (yet) covered by a role entry. anthropic is the no-op v2 fallback;
  # the nexus-* legacy values are intentionally the OLD numbers — un-migrated
  # DB rows fall back here until llm_provider._migrate_provider_names() renames
  # them on boot. (nexus-companion/nexus-gemma differ from their live roles.)
  extra_context_windows:
    anthropic: 200000
    nexus-companion: 16384
    nexus-gemma: 16384

models:

  # ---------------------------------------------------------------- chat / reasoning
  analyst:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: chat
    role: qwen-analyst
    aliases: [qwen-analyst, chat, nexus-chat]
    host: nexus
    port: 8080
    backend_engine: llama.cpp
    systemd_unit: llama-vision
    probe_kind: llama
    model_family: Qwen3-VL-30B-A3B-Instruct (vision)
    quant: UD-Q4_K_XL
    context_per_slot: 32768
    context_window: 32768
    slots: 2
    timeout_floor_s: 30
    capabilities:
      vision: true
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "~0.1-1.5s classify; ~1-2s vision"}
    purpose: Vision (OCR/description) + fast prefill-bound classification tier.
    when_used:
      - Image/screenshot/calendar-photo vision (description + OCR)
      - Tier-1.5 / Tier-2 classification (email triage, relationship, attachments)
      - Vision fallback behind `ocr` (got-ocr)
    fallback: composer
    notes: |
      Not the streaming-synth path. Lives on nexus so anvil stays free for
      the user-facing composer slot.

  composer:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: companion
    role: qwen-composer
    aliases: [qwen-composer, companion, nexus-companion]
    host: nexus
    port: 8081
    backend_engine: llama.cpp
    systemd_unit: llama-companion
    probe_kind: llama
    model_family: Qwen3-Next-80B-A3B (Huihui abliterated)
    quant: Q4_K_M
    context_per_slot: 32768
    context_window: 98304
    slots: 3
    timeout_floor_s: 180
    policy:
      dispatch_concurrency_cap: 3   # G1: KV-seq-rm headroom on the 80B
      fast_path_reserve_slots: 1
      slot_affinity: true           # pin a conversation to one slot (KV reuse)
    capabilities:
      vision: false
      streaming: true
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "streaming synth; decode-bound"}
    purpose: Streaming user-facing synth + high-capability composer/summarizer.
    when_used:
      - Inner-loop final-answer synthesis + tier2_synth streaming reply
      - Speech-frame voice replies, recipe-runner recipe execution
      - Large-context summary fallover (>24k tokens)
    fallback: reasoner
    notes: |
      /props discovery is unreliable on the 80B — the context_per_slot seed is
      load-bearing, keep it exact. slot_affinity reuses the checkpoint cache.

  router:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: gemma
    role: gemma-router
    aliases: [gemma-router, gemma, nexus-gemma]
    host: anvil
    port: 9091
    backend_engine: llama.cpp
    systemd_unit: llama-gemma
    probe_kind: llama
    model_family: Gemma-4-E4B-it
    quant: Q5_K_M
    context_per_slot: 16384
    context_window: 16384
    slots: 2
    timeout_floor_s: 60
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; first-token fast"}
    purpose: Tier-1.5 LLM router + cheap classification / tool routing.
    when_used:
      - Tool routers (temporal / health-verifier / research), email + proposal classify
      - knowledge audit/dedup classifiers
    fallback: classifier
    notes: |
      Since 2026-06-08 this E4B backend ALSO serves the `classifier`
      (gemma-greeter) role — the E2B-hot :9090 was decommissioned.

  classifier:
    kind: chat
    status: active
    proxy_endpoint: false            # shares the `gemma` endpoint with `router`
    endpoint_class: gemma
    role: gemma-greeter
    aliases: [gemma-greeter, gemma-hot, nexus-gemma-hot]
    host: anvil
    port: 9091
    backend_engine: llama.cpp
    model_family: Gemma-4-E4B-it
    quant: Q5_K_M
    context_per_slot: 16384
    context_window: 4096             # legacy greeter default (small prompts)
    slots: 2
    timeout_floor_s: 60
    capabilities:
      vision: false
      streaming: false
      reasoning: false
      tool_calling: true
      structured_output: grammar
    token_speed: {note: "cheap classify; rare fallback path"}
    purpose: Tier-1.5 router/classifier fallback (greeter); lands on the E4B backend.
    when_used:
      - tool_router fallback (health-verifier / temporal), chip narration
    fallback: router
    notes: |
      Two logical roles (router + classifier) legitimately SHARE one physical
      backend (E4B :9091). proxy_endpoint:false — `router` owns the `gemma`
      DEFAULT_ENDPOINTS row; this entry only contributes gemma-greeter→gemma to
      ROLE_TO_CLASS + its own context window.

  reasoner:
    kind: chat
    status: active
    proxy_endpoint: true
    endpoint_class: thinker
    role: llama-thinker
    aliases: [llama-thinker, thinker]
    host: anvil
    port: 9083
    backend_engine: vllm
    systemd_unit: vllm-thinker
    probe_kind: vllm
    served_model_names: [llama-thinker, thinker, claude-sonnet-4-5, llama]
    model_family: Qwen3.6-27B-Text-NVFP4-MTP
    quant: NVFP4
    params: {active: 27B, total: 27B}
    context_per_slot: 131072
    context_window: 32768            # fleet chunkers size against 32K on purpose
    # 20 = the backend's HARD cap (vllm-thinker `--max-num-seqs 20`, lowered
    # 32->20 on 2026-06-11 for DECKARD co-residency — see serve_thinker_prod.sh).
    # vLLM does NOT expose --max-num-seqs over its API, so this seed is the ONLY
    # source of the proxy's admission ceiling; a stale 32 here over-admitted the
    # thinker by 12 (the extra 12 just queued at the backend, bypassing the
    # proxy's DRR fairness). Reconciled to the documented launch value 2026-07-01
    # (Phase-0 discovery). NOTE: llama.cpp roles self-correct via /props; vLLM
    # ones like this do NOT — a Phase-1 shadow reconciler will warn on future
    # drift. Keep this equal to serve_thinker_prod.sh's --max-num-seqs.
    slots: 20
    timeout_floor_s: 180
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 1
      # Step 4c: the backend's real --max-num-seqs (serve_thinker_prod.sh). Keep
      # EQUAL to `slots` above; the shadow reconciler warns if they drift (the
      # 32-vs-20 class). Update BOTH whenever serve_thinker_prod.sh changes.
      documented_max_num_seqs: 20
    capabilities:
      vision: false
      streaming: true
      reasoning: true               # MTP speculative + per-request thinking
      tool_calling: true
      structured_output: guidance
    token_speed: {decode_tok_s_at_1: 40, aggregate_tok_s_full: 120}
    purpose: Dense agentic reasoning tier (the fleet's heavy reasoner).
    when_used:
      - knowledge extraction, news synthesis, thread/device enrichment
      - browser-broker default, forum-agent thread summary
    fallback: composer
    notes: |
      Function-named: actually a Qwen3.6 dense model on vLLM with qwen3_5_mtp
      n=3 speculative decoding. served window is 128K (opencode); fleet chunkers
      deliberately use 32K (context_window) to keep extraction chunks small.

  creative:
    kind: chat
    status: active                  # PINNED always-resident on the DEDICATED boxa (docker --restart unless-stopped auto-starts vLLM); standalone — no dispatcher/systemd, proxy dispatches directly
    proxy_endpoint: true
    endpoint_class: creative
    role: creative
    aliases: [deckard, deckard-31b]   # HISTORICAL — from the prior anvil NVFP4 DECKARD model; kept as compat role aliases only (the deployed model is NOT a DECKARD finetune)
    host: nasbox
    port: 9196
    backend_engine: vllm
    served_model_names: [creative, deckard-31b, deckard]   # `creative` = the LIVE boxa server (serve_prod.sh); `deckard`/`deckard-31b` = the DORMANT anvil rollback (serve_deckard.sh) — all declared so the naming-doctrine test covers both serve scripts
    model_family: Gemma-4-31B-it abliterated (Heretic-ARA), AWQ W4A16
    quant: W4A16
    params: {active: 31B, total: 31B}
    context_per_slot: 40960          # boxa vLLM --max-model-len (config-C cutover 2026-06-27)
    slots: 16                        # boxa vLLM --max-num-seqs hard cap
    # Vision resolution: Gemma-4 default visual budget is 280 tokens/image. Callers can raise it
    # PER-REQUEST for fine OCR via extra_body={"mm_processor_kwargs":{"max_soft_tokens": 560}} — the
    # proxy forwards it verbatim (no boxa change). VERIFIED 2026-06-30: 560 is safe + lifts fine-text
    # (fixed an SSN date the default missed); 1120 OOM-crashes the boxa engine — do NOT exceed ~560.
    timeout_floor_s: 900            # tolerates cold multi-minute vLLM load + long-context prefill
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 1
      # Step 4c: the boxa's real --max-num-seqs (serve_prod.sh). Keep EQUAL to
      # `slots: 16` above; the shadow reconciler warns on drift.
      documented_max_num_seqs: 16
    capabilities:
      vision: true                  # IMAGE + VIDEO input LIVE in prod since 2026-06-21 (serve_prod.sh: --dtype bfloat16 + --limit-mm-per-prompt image:2,video:1). Validated end-to-end through the proxy (Anthropic image block → OAI translate → vLLM). bf16 is MANDATORY for vision (fp16 silently breaks it via SigLIP overflow, vLLM #40290); text throughput unchanged (24.8 vs 25.9 tok/s). AUDIO is NOT supported — the checkpoint has no audio tower (audio_config vestigial → vLLM 400s); keep audio:0. Video routes as frames THROUGH the vision tower (no separate video tower).
      streaming: true
      reasoning: false              # served as a non-thinking chat model — no <think>/reasoning_content channel
      tool_calling: false           # auto-tool-choice OFF
      structured_output: guidance
    token_speed: {decode_tok_s_at_1: 25, aggregate_tok_s_full: 250}
    purpose: Creative / counterpoint voice — a different-family generative model.
    when_used:
      - sidekick song authoring (theme/hook/expand), dj crew speaker voice
    fallback: composer
    notes: |
      DEPLOYED MODEL (ground-truth, /models/alonsoko-ct-w4a16 on the box): the pre-quantized HF
      download `alonsoko/Gemma-4-31B-it-abliterated-heretic-AWQ-W4A16` — an AWQ W4A16 quant
      (group_size 128 symmetric, compressed-tensors, calibrated on ultrachat_200k) of
      `trohrbaugh/gemma-4-31b-it-heretic-ara`, itself a HERETIC-ARA abliterated derivative of
      `google/gemma-4-31b-it`. This is NOT the DavidAU "DECKARD" finetune nor a locally
      AutoRound-quantized model — the earlier `infra/nasbox-vllm-xpu/` build plan targeted DECKARD
      but production switched to this downloaded AWQ artifact. Runs on the DEDICATED Intel Arc Pro
      boxa (10.0.0.10:9196, custom vLLM 0.23 XPU build) since 2026-06-20 — replaced the anvil GB10
      NVFP4 DECKARD (kept as hot rollback; the `deckard` aliases are historical from that prior
      model). Standalone always-on docker container `vllm-creative-boxa` (--restart unless-stopped;
      entrypoint auto-starts vLLM on boot/crash); NO anvil dispatcher, NO systemd. gpu-mem-util
      0.98, max-num-seqs 16, max-model-len 65536 (~108K KV tokens). Depends on the /mnt/cache/llm
      NVMe mount (editable vLLM install + model + serve_prod.sh). MULTIMODAL LIVE (2026-06-21, see
      capabilities + PRODUCTION.md): prod serves --dtype bfloat16 with --limit-mm-per-prompt
      image:2,video:1 → IMAGE + VIDEO input work (vision tower = 356 tensors; video = frames through
      the vision tower). bf16 is mandatory (fp16 silently breaks vision: SigLIP overflow, vLLM #40290);
      text throughput unchanged. NO audio tower → audio unsupported (audio:0). Callers reach it like any
      vision role: make_nexus_client("creative") with image content; the proxy translates + forwards.

  # ---------------------------------------------------------------- retrieval
  embed:
    kind: embed
    status: active
    proxy_endpoint: true
    endpoint_class: embed
    role: bge-m3-embed
    aliases: [bge-m3-embed]
    host: anvil
    port: 9087
    backend_engine: shim
    systemd_unit: bge-m3-embed
    probe_kind: health
    model_family: BGE-M3 (dense + sparse + colbert)
    quant: fp16
    context_per_slot: 8192
    slots: 4
    timeout_floor_s: 15
    policy:
      skip_discovery: true          # FastAPI shim — no /props or /v1/models
    capabilities:
      vision: false
      streaming: false
      structured_output: none
    token_speed: {note: "hybrid embed, one forward pass"}
    purpose: Dense/sparse/colbert hybrid embeddings for retrieval (the canonical fleet embed).
    when_used:
      - knowledge ingest + retrieval, forum-agent similarity gate, dedup
    fallback: null
    notes: |
      NOT OpenAI-compatible — POST /embed returning dense+sparse+colbert. The
      nexus CPU copy (:8091) was removed 2026-06-05.

  rerank:
    kind: rerank
    status: active
    proxy_endpoint: true
    endpoint_class: rerank
    role: bge-reranker
    aliases: [bge-reranker, rerank, nexus-rerank]
    host: anvil
    port: 9084
    backend_engine: shim
    systemd_unit: bge-reranker-shim
    probe_kind: infinity
    model_family: BGE-Reranker v2-m3 (cross-encoder)
    quant: fp16
    context_per_slot: 8192
    slots: 1
    timeout_floor_s: 10
    policy:
      background_floor_pct: 0.0
      skip_discovery: true
    capabilities:
      vision: false
      streaming: false
      structured_output: none
    token_speed: {note: "cross-encode candidate batch"}
    purpose: Late-stage retrieval candidate reranking.
    when_used:
      - knowledge retrieval rerank stage
    fallback: null
    notes: |
      Cohere-style POST /rerank (not OpenAI). Upstream `infinity-bge-reranker`
      (:9085) is the INTERNAL backend behind this shim — not a public role.

  # ---------------------------------------------------------------- vision / OCR
  ocr:
    kind: ocr
    status: active
    proxy_endpoint: false           # facade-only (gateway), not a proxy LLM role
    role: got-ocr
    aliases: [got-ocr, got_ocr]
    host: nexus
    port: 8087
    backend_engine: shim
    systemd_unit: nexus-got-ocr
    probe_kind: health
    model_family: GOT-OCR-2.0
    quant: fp16
    capabilities:
      vision: true
      structured_output: none
    purpose: Primary OCR (document/image text extraction).
    when_used:
      - attachments + email document OCR
    fallback: analyst                # qwen-analyst vision is the OCR fallback
    notes: Reached via the gateway facade, not make_nexus_client.

  # ---------------------------------------------------------------- speech
  tts:
    kind: tts
    status: active
    proxy_endpoint: false
    role: orpheus-tts
    aliases: [orpheus-tts, orpheus]
    host: nexus
    port: 8098
    backend_engine: shim
    systemd_unit: orpheus-tts
    probe_kind: health
    model_family: Orpheus 8-voice (Llama-3.2-3B + SNAC)
    purpose: Text-to-speech — DJ + voice replies.
    when_used:
      - dj crew voice, speech-frame replies
    fallback: null
    notes: |
      Backbone `orpheus-llama` (Llama-3.2-3B) on :8096 emits SNAC codes;
      orpheus-tts (:8098) is the front. Replaced chatterbox-tts (2026-06-07).

  stt:
    kind: stt
    status: active
    proxy_endpoint: false
    role: whisper-1
    aliases: [whisper-1, whisper]
    host: nasbox                     # RELOCATED off nexus 2026-06-12 (OpenVINO NPU)
    port: 8086
    backend_engine: shim
    model_family: Whisper Large v3 (int8, OpenVINO)
    purpose: Speech-to-text transcription.
    when_used:
      - Tideway transcription, voice intake, Wyoming ASR for HA
    fallback: null
    notes: Runs on the Nasbox Intel Xe/NPU box (10.0.0.10) since 2026-06-12.

  diarize:
    kind: diarize
    status: on_demand
    proxy_endpoint: false
    role: diarize-gpu
    aliases: [diarize-gpu, nexus-diarize-gpu]
    host: nasbox                     # RELOCATED off anvil 2026-06-12 (OpenVINO iGPU)
    port: 8086
    backend_engine: shim
    model_family: DiariZen (WavLM, OpenVINO)
    dispatcher_capability: diarize
    unit: diarize-gpu.service
    purpose: Speaker diarization.
    when_used:
      - multi-speaker transcript attribution
    fallback: null
    notes: |
      Gated by DIARIZE_ENABLED (default off). Runs on the Nasbox iGPU (10.0.0.10:8086,
      OpenVINO) since 2026-06-12, reached via the gateway facade. The anvil
      dispatcher row was removed 2026-06-16 (build_dispatcher_entries excludes
      non-anvil hosts), so this is no longer a anvil-dispatcher capability.

  stream:
    kind: stream
    status: active
    proxy_endpoint: false
    role: nexus-stream
    aliases: [nexus-stream, stream]
    host: nasbox                     # RELOCATED off anvil 2026-06-12
    port: 8190
    wyoming_port: 10300
    backend_engine: shim
    model_family: nexus-stream audio mux (WS + OpenAI batch + Wyoming TCP)
    purpose: Speech audio mux / streaming relay (+ Wyoming bridge for Home Assistant).
    when_used:
      - real-time voice capture pipeline, HA Wyoming ASR
    fallback: null
    notes: Nasbox (10.0.0.10) :8190 + Wyoming :10300 since 2026-06-12.

  # ---------------------------------------------------------------- media / generation
  # All dispatcher-managed, on-demand (GPU-slot lease). Keyed by
  # dispatcher_capability; `unit` is the systemd unit the dispatcher brokers.
  imagegen:
    kind: media
    status: on_demand
    proxy_endpoint: false
    role: flux1-imagegen
    aliases: [flux1-imagegen, anvil-imagegen]
    host: anvil
    port: 9210
    backend_engine: shim
    dispatcher_capability: image_diffusers
    dispatcher_capability_aliases: [image_fast, image_hq]
    dispatcher_unit_key: anvil-imagegen
    unit: anvil-imagegen.service
    manage_process: false            # self-managing; dispatcher brokers the slot only
    health_path: /healthz
    warmup_sec: 15
    model_family: Diffusers (Flux / SDXL, ~150 swappable checkpoints)
    purpose: On-demand image generation.
    when_used:
      - Image Studio, sidekick/dj artwork
    fallback: null
    notes: |
      Hosts ~150 swappable checkpoints behind one FastAPI — the per-checkpoint
      sub-registry lives in infra/anvil/anvil_imagegen/models.yaml (a finer
      granularity; NOT folded into this authority).

  video:
    kind: media
    status: on_demand                # LIVE 2026-06-21 — Phase 0 validated on the GB10
    proxy_endpoint: false
    role: ltx2-videogen
    aliases: [ltx2-videogen, anvil-videogen, anvil-ltx]
    host: anvil
    port: 9211                       # anvil-videogen FastAPI service (adjacent to imagegen :9210)
    backend_engine: shim
    dispatcher_capability: video_fast
    dispatcher_capability_aliases: [video_hq]
    dispatcher_unit_key: anvil-videogen
    unit: anvil-videogen.service
    manage_process: false            # always-on service; self-manages ComfyUI residency + the slot lease
    health_path: /healthz
    warmup_sec: 30
    model_family: LTX-2.3 (LTX 2.3 22B distilled, fp8-scaled)
    quant: fp8-scaled
    purpose: On-demand text-to-video and image-to-video.
    when_used:
      - short-form video gen, animate Image-Studio stills
    fallback: null
    notes: |
      LTX-2.3 22B distilled fp8 on the anvil GB10 via an isolated headless
      ComfyUI (/opt/comfyui-video, PyTorch SDPA — sm_121 has no FlashAttention;
      SageAttention deferred). The anvil-videogen FastAPI service (:9211,
      manage_process:false) is always-on, owns the dispatcher GPU-slot lease, and
      lazy-starts / idle-stops the ComfyUI child + memory-guards loads — the ~80GB
      video stack shares the 121GB unified pool with the always-resident vLLM
      thinker, so generation is strictly serialized + memory-preflighted. Gemma-3-12B
      is the prompt text encoder. Per-checkpoint sub-registry lives in
      infra/anvil/anvil_videogen/models.yaml (not folded into this authority).

  musicgen:
    kind: media
    status: on_demand
    proxy_endpoint: false
    role: anvil-musicgen
    aliases: [anvil-musicgen, musicgen]
    host: anvil
    port: 9220
    backend_engine: shim
    dispatcher_capability: music_generate
    dispatcher_unit_key: anvil-musicgen
    unit: musicgen.service
    health_path: /healthz
    warmup_sec: 45
    model_family: MusicGen
    purpose: AI music generation bridge.
    when_used: [dj audio production]
    fallback: null

  stem:
    kind: media
