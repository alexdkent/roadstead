    status: active                  # PINNED always-resident on the boxa. Standalone docker container `llamacpp-creative-boxa` (--restart always) on :9196 — no dispatcher/systemd; proxy dispatches directly, capacity self-discovered via /props. CONSOLIDATED 2026-07-11: ONE Qwen3.6-35B-A3B-abliterated container (+mmproj) now backs THREE roles — `creative`, `companion-lite`(alias, chat loop), AND the `classify`/`analyst`/vision family(alias, re-homed off anvil :9092). Superseded the Trinity-Mini(creative)/Gemma-4-26B(companion-lite) split AND the anvil llama-classify.service (stopped). Not evictable (dedicated card) — the anvil eviction dance is gone.
    proxy_endpoint: true
    endpoint_class: creative
    role: creative
    # 🚨 `tier2-analyst` MUST be listed here even though it is the entry's KEY. The proxy's
    # dispatch map comes from build_role_aliases(), which iterates `aliases` ONLY and maps each
    # to `role:` — the catalog key never enters it. Measured 2026-08-18: with the key alone, a
    # live call for role `tier2-analyst` got `404 unknown_endpoint` (known: creative, embed,
    # gemma, rerank, thinker) while `creative`/`tier2` answered fine. cat.canonical() resolving
    # the name is NOT evidence that the proxy will route it.
    aliases: [tier2-analyst, creative, tier2, deckard, deckard-31b, companion-lite, qwen-classify, classify, chat, nexus-chat, analyst-vision, qwen-vision-8b, qwen-vision-9b, vision-8b, qwen-analyst, analyst]   # THREE roles now resolve to this ONE boxa endpoint (2026-07-11 consolidation): (1) creative, (2) companion-lite = the orchestrator inner chat loop, (3) the whole classify/analyst/vision family (re-homed off anvil :9092). All pure ALIASES of the single endpoint so no caller changes AND slots aren't double-counted (two stanzas at one URL would double-count the 6 slots). deckard/deckard-31b are HISTORICAL anvil NVFP4 rollback aliases (the deployed model is NOT a DECKARD finetune). `creative` became an alias in the 2026-08-18 rename. ⚠️ Bare `tier2` DELIBERATELY stays here rather than following the conversational role (operator decision 2026-08-18) — it has live callers (sidekick/song_studio.py:425, discord_schema_smoke, llm_benchmark, external_facade, ~10 tools) and re-pointing a live alias at a different model is the exact July `companion` failure. Revisit at Phase 3: if `tier2` should mean the chat tier, SWEEP THE CALLERS, do not silently re-point.
    host: nasbox
    port: 9196
    backend_engine: llama.cpp
    probe_kind: llama
    served_model_names: [creative, deckard-31b, deckard]   # `creative` = the LIVE boxa llama.cpp server (-a creative); `deckard`/`deckard-31b` = the DORMANT anvil rollback (serve_deckard.sh, on anvil) — declared so the naming-doctrine test covers them. `companion-lite` is a ROUTING alias, NOT a served -a name — the container runs `-a creative`.
    model_family: Qwen3.6-35B-A3B (abliterated, Heretic) — MoE 35B total / ~3B active, Q4_K_M GGUF
    quant: Q4_K_M
    params: {active: 3B, total: 35B}
    context_per_slot: 65536          # llama.cpp -c 393216 --parallel 6 = 65536/slot, f16 KV cache. Trimmed 76800->65536 (2026-07-11) to make room for the mmproj (861 MB) + vision-encoder compute buffer now that classify/vision re-homed here; ~30.5 GiB resident of the 32GB boxa, no GTT spill.
    context_window: 32768            # fleet chunkers size against 32K on purpose (policy, not slot size) — same policy classify used, so re-homing classify here changes no chunk sizing
    slots: 6                         # llama.cpp --parallel 6 — the shadow reconciler warns if this drifts from actual --parallel (6)
    timeout_floor_s: 120            # compromise: this endpoint now serves BOTH long creative song-compose AND latency-sensitive chat (companion-lite alias). 120s min-budget; adaptive surge×size widens to the ceiling for big song-compose, and a stuck chat turn fails in ~120s instead of 900s. (mirrors timeout_model FLOOR_S["creative"] — bump BOTH in lockstep.)
    timeout_ceiling_s: 1800         # inherently long-running (long-form gen); a role override so the generous background band applies on EVERY tier (song-compose runs at an interactive tier). Adaptive surge×size widens up to here.
    policy:
      background_floor_pct: 0.0
      fast_path_reserve_slots: 2     # reserve 2 of 6 slots for interactive chat turns (companion-lite alias) so a real-time chat turn isn't head-of-line blocked behind a background song-compose.
      # llama.cpp --parallel. Keep EQUAL to `slots: 6` above; the shadow reconciler warns on drift.
      documented_max_num_seqs: 6
    capabilities:
      vision: true                  # mmproj loaded (mmproj-bf16.gguf, 861 MB) — classify's vision callers (attachments stage-2, knowledge_store intake, browser_broker perceive./vision.) route here now. Verified 2026-07-11: perfect OCR + shape/number extraction on the boxa/SYCL, ~79 t/s vision decode.
      streaming: true
      reasoning: false              # Qwen3.6 reasoning is DISABLED via `--jinja --chat-template-kwargs '{"enable_thinking":false}'` (VERIFIED 0 reasoning_content).
      tool_calling: grammar         # now backs the inner-loop chat tool-calling (companion-lite alias): the orchestrator's tool catalog is GBNF grammar-constrained.
      structured_output: grammar    # llama.cpp GBNF / response_format json_schema. NOTE: give structured calls a generous max_tokens.
    token_speed: {note: "Qwen3.6-35B-A3B MoE (~3B active) Q4_K_M on the boxa (SYCL), --parallel 6 / 76800 ctx-per-slot; consolidated creative+companion-lite endpoint. Per-model decode/prefill numbers not yet re-benchmarked on this loadout — the prior Trinity-Mini/Gemma-4-26B figures are retired."}
    purpose: |
      The consolidated boxa core model — ONE abliterated Qwen3.6-35B-A3B (+mmproj) serving THREE roles:
      (1) creative / counterpoint generative voice, (2) the orchestrator inner chat-loop backend
      (companion-lite alias), and (3) the fleet text-classify + vision tier (classify/analyst family,
      re-homed off the anvil GB10 — which is now free for imagegen/videogen).
    when_used:
      - sidekick song authoring (theme/hook/expand), dj crew speaker voice
      - orchestrator inner chat loop (Sidekick's chat turn) via the companion-lite alias
      - Tier-1.5/Tier-2 text classification (sidekick.extract_pad fallback, temporal.daily_summary, mail-agent.email_recent_overview, orchestrator.autonomous_chat-agent.reflect, forum-agent.peer_playbook) via the classify alias
      - attachments stage-2 full-resolution image extraction; knowledge_store ground-truth PII/document intake; browser_broker vision-routed capabilities (perceive./vision./insurance./portal.) via the vision aliases
    fallback: tier3_backup
    notes: |
      CONSOLIDATED 2026-07-11 (three roles → one model): ONE standalone always-on docker container
      `llamacpp-creative-boxa` (`ghcr.io/ggml-org/llama.cpp:server-intel`, SYCL/level_zero:0,
      --restart always) on the Intel Arc Pro boxa (10.0.0.10:9196) now backs the `creative` role, the
      `companion-lite` role (orchestrator chat loop), AND the `classify`/`analyst`/vision family
      (re-homed off anvil). ALL non-creative roles are ALIASES of this one endpoint — no caller
      changes, and keeping ONE stanza at ONE URL keeps 6-slot capacity accounting correct (two stanzas
      at one URL would double-count the slots).
      DEPLOYED MODEL: an abliterated (Heretic) `Qwen3.6-35B-A3B` MoE (35B total / ~3B active), Q4_K_M
      GGUF + its native mmproj (mmproj-bf16.gguf, 861 MB) on the /mnt/cache/llm NVMe. Tool-calling +
      VISION both live (vision verified 2026-07-11: perfect OCR/shape/number extraction, ~79 t/s).
      Reasoning is DISABLED via `--jinja --chat-template-kwargs '{"enable_thinking":false}'` (verified
      0 reasoning_content). NOTE: llama.cpp disables `--cache-reuse` when an mmproj is loaded (logged
      at boot); cross-turn token reuse is off, but `--slot-prompt-similarity 0.5` still routes each
      request to its warm slot.
      Launch: `-ngl 99 -c 393216 --parallel 6 -fa on -ctk f16 -ctv f16 --mmproj …` => 65536 ctx/slot,
      ~30.5 GiB resident of the 32GB card (trimmed from 76800 to make room for the mmproj + vision
      compute). NO dispatcher, NO systemd — docker owns lifecycle; depends on the /mnt/cache/llm mount.
      CANONICAL LAUNCH + per-flag rationale: `infra/nasbox-vllm-xpu/serve_creative_llamacpp.sh`.
      This SUPERSEDED (a) the prior two-model creative/chat split (Trinity-Mini :9196 + Gemma-4-26B-A4B
      :9197 — old `llamacpp-companion-lite-boxa` container STOPPED), AND (b) the anvil
      `llama-classify.service` (Qwen3.6-35B-A3B+mmproj on the GB10 :9092 — STOPPED + disabled; the
      GB10 is now free for imagegen/videogen, and classify no longer has to evict them). Moving the
      light classify model OFF the contended anvil card also fixes classify's ~36s p95 queue-wait.
      ROLLBACK: git-revert `serve_creative_llamacpp.sh` + re-run `serve_companion-lite_llamacpp.sh` +
      re-enable `llama-classify.service` on anvil + revert these stanzas (all prior GGUFs remain
