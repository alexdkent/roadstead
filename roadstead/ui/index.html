<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Roadstead — management</title>
<!--
  🚨 ONE FILE. No bundler, no node_modules, no framework, no external anything.

  Roadstead's dependency list is six packages on purpose (CLAUDE.md), and the
  same judgement that keeps `roadstead.client` on httpx-and-stdlib keeps this on
  the platform. It ships in the wheel, so every byte here is public surface: a
  <script src>, a webfont or a CDN stylesheet would be a new external reference
  for everyone who installs Roadstead. The Content-Security-Policy the server
  sends forbids all of them outright rather than trusting a reviewer to notice.

  WHAT THIS PAGE IS FOR — read management.py's module docstring first. An
  operator's question is not the caller's question one level up. It is:

      "what did I write that is not in force?"

  So this shows the GAP. Wherever a declared value and an in-force value can
  disagree, both are rendered side by side and a difference is made loud. A page
  that echoed models.yaml back would be a worse `cat`, and every expensive
  failure in docs/ledger.md lives in a gap between two sources that agree most
  of the time.

  AUTH. There is no login form and no session. The page is served behind HTTP
  Basic; the PASSWORD is an admin API key (identity.py, §1.5) and the username is
  ignored. Nothing here reads, stores or forwards the credential — the browser
  attaches it, which is also why the live stream is reached at
  /rs/v1/admin/stream: EventSource cannot set a header at all. No cookie is ever
  minted, so CSRF never becomes reachable on these mutating routes.
-->
<style>
/* ---------------------------------------------------------------------
 * A roadstead is the sheltered anchorage OUTSIDE a harbour, where vessels
 * wait for a berth to free up. The palette is that place at night, and the
 * state colours are navigation lights — which is not decoration: port red
 * and starboard green are a real, directional vocabulary, and this console
 * has exactly that job. Green is alongside and serving, amber is riding at
 * anchor, red is refused or dark.
 *
 * No web fonts: the CSP forbids every external reference, so the character
 * has to come from how the system faces are SET. Instrument panel — tiny
 * uppercase mono labels with wide tracking, large tabular mono numerals.
 * ------------------------------------------------------------------- */
:root {
  color-scheme: dark light;
  --bg:        #0a1620;   /* harbour water at night — blue-green, not black */
  --bg-raise:  #0f2130;
  --bg-sink:   #071119;
  --line:      #1d3a4a;
  --line-soft: #142835;
  --ink:       #e6dcc4;   /* chart paper, warm — never pure white */
  --ink-dim:   #93a9b4;
  --ink-faint: #5f7783;
  --accent:    #56b6c2;   /* channel marker */
  --ok:        #4fd08a;   /* starboard */
  --warn:      #f0b429;   /* riding at anchor */
  --bad:       #e5484d;   /* port */
  --gap:       #f0b429;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f2ede1; --bg-raise: #fbf8f0; --bg-sink: #e8e1d0;
    --line: #cabfa4; --line-soft: #ded5be;
    --ink: #16303d; --ink-dim: #4d6675; --ink-faint: #7d94a0;
    --accent: #0f6d7a; --ok: #1a7f4b; --warn: #8a5a00; --bad: #c0272d;
    --gap: #8a5a00;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  color: var(--ink);
  font: 13px/1.5 var(--sans);
  -webkit-font-smoothing: antialiased;
  /* An admiralty chart's depth contours, at the threshold of visible. Two
   * repeating gradients, no image, no request — the CSP forbids every
   * external reference and this page has no build step to inline one with.
   * It gives the ground a grain so the panels read as sitting ON something
   * rather than floating in a void, which is most of what made the old
   * near-black feel like a terminal with tables in it. */
  background:
    repeating-linear-gradient(
      90deg, transparent 0 63px,
      color-mix(in srgb, var(--accent) 5%, transparent) 63px 64px),
    repeating-linear-gradient(
      0deg, transparent 0 63px,
      color-mix(in srgb, var(--accent) 5%, transparent) 63px 64px),
    var(--bg);
  background-attachment: fixed;
}
@media (prefers-reduced-motion: no-preference) {
  main > section { animation: rise .18s ease both; }
  main > section:nth-child(2) { animation-delay: .03s; }
  main > section:nth-child(3) { animation-delay: .06s; }
}
@keyframes rise { from { opacity: 0; transform: translateY(4px); } }
a { color: var(--accent); }
code, .mono, td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---- chrome ---------------------------------------------------------- */
header {
  display: flex; align-items: center; gap: 16px;
  padding: 10px 18px; background: var(--bg-sink);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5;
}
.brand { font-weight: 650; letter-spacing: .04em; }
.brand span { color: var(--ink-faint); font-weight: 400; margin-left: 8px; }
.spacer { flex: 1; }
.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
  border: 1px solid var(--line); color: var(--ink-dim); background: var(--bg-raise);
}
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
.pill[data-state="live"]  .dot { background: var(--ok); }
.pill[data-state="lost"]  .dot { background: var(--bad); }
.pill[data-state="idle"]  .dot { background: var(--warn); }

nav { display: flex; gap: 2px; padding: 0 12px; background: var(--bg-sink);
      border-bottom: 1px solid var(--line); overflow-x: auto; }
nav button {
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--ink-dim); font: inherit; padding: 9px 13px; cursor: pointer;
  white-space: nowrap;
}
nav button:hover { color: var(--ink); }
nav button[aria-current="true"] { color: var(--ink); border-bottom-color: var(--accent); }
nav .badge {
  margin-left: 6px; font-size: 10.5px; padding: 0 5px; border-radius: 999px;
  background: var(--gap); color: #12151a; font-weight: 700;
}
/* No max-width: this is a console, and a 1500px cap wasted a third of a wide
 * monitor on a page whose whole job is dense tables. Prose is capped instead,
 * where the measure actually matters (`.lede`, 74ch). */
main { padding: 20px 26px 60px; }

/* ---- structure ------------------------------------------------------- */
section { margin-bottom: 26px; }
/* Section headings as panel labels: mono, wide-tracked, with a rule running
 * off to the right so a heading reads as the top of a bounded instrument
 * rather than as a line of prose. */
h2 {
  font: 10px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase;
  color: var(--accent); margin: 0 0 10px; font-weight: 600;
  display: flex; align-items: center; gap: 12px;
}
h2::after {
  content: ""; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--line), transparent);
}
main > section { margin-bottom: 30px; }
.lede { color: var(--ink-faint); margin: 0 0 12px; max-width: 74ch; }

/* ---- the wall of text, demoted -------------------------------------- *
 * Every section carried a paragraph of doctrine as permanent body copy.
 * The reasoning is the most valuable thing on the page and it was also the
 * first thing on it, so the DATA — which is what an operator opened the
 * page for — started below the fold of prose. `<details>` keeps every word
 * one click away, costs no JavaScript, and is keyboard-accessible for free.
 * --------------------------------------------------------------------- */
details.why { margin: 0 0 14px; }
details.why > summary {
  cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10px; text-transform: uppercase;
  letter-spacing: .14em; color: var(--ink-faint); list-style: none;
  padding: 3px 0; user-select: none;
}
details.why > summary::-webkit-details-marker { display: none; }
details.why > summary::before { content: "›"; transition: transform .12s ease; }
details.why[open] > summary::before { transform: rotate(90deg); }
details.why > summary:hover { color: var(--accent); }
details.why > summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
details.why .lede { margin-top: 8px; }
.cards { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); }
.card {
  background: linear-gradient(180deg,
      color-mix(in srgb, var(--accent) 6%, var(--bg-raise)), var(--bg-raise));
  border: 1px solid var(--line); border-radius: 6px; padding: 11px 14px 13px;
  position: relative; overflow: hidden;
}
/* A hairline in the accent along the top edge — a lit channel marker. */
.card::after {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 2px;
  background: color-mix(in srgb, var(--accent) 55%, transparent);
}
.card .k { color: var(--ink-faint); font-size: 10px; text-transform: uppercase;
           letter-spacing: .14em; font-family: var(--mono); }
.card .v { font-family: var(--mono); font-size: 30px; margin-top: 6px;
           letter-spacing: -.02em; font-variant-numeric: tabular-nums;
           color: var(--ink); line-height: 1; }
/* The metric that is actually moving reads warm; the rest stay quiet. */
.card[data-live="1"] .v { color: var(--accent); }

/* ---- the berth strip — the signature -------------------------------- *
 * The whole thesis of this scheduler is that capacity is a fixed number of
 * BERTHS and the unit of fairness is time spent occupying one. The page
 * rendered that as the string "0 / 4". One cell per slot, filled when
 * occupied, is the same number said in the subject's own terms, and it is
 * readable at a glance across a column of endpoints in a way two integers
 * separated by a slash never is.
 * --------------------------------------------------------------------- */
.berths { display: inline-flex; gap: 3px; align-items: center; vertical-align: middle; }
.berth {
  width: 11px; height: 19px; border-radius: 2px;
  border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent);
  background: color-mix(in srgb, var(--accent) 10%, transparent);
}
.berth.full { background: var(--ok); border-color: var(--ok); }
.berth.queued { background: var(--warn); border-color: var(--warn); }
.berths .count { font-family: var(--mono); font-size: 11.5px; color: var(--ink-dim);
                 margin-left: 8px; font-variant-numeric: tabular-nums; }
/* An endpoint with no berths to draw — unrouted, or capacity undiscovered. */
.berths.none { color: var(--ink-faint); font-family: var(--mono); font-size: 11px; }

table { width: 100%; border-collapse: collapse; background: var(--bg-raise);
        border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
th, td { text-align: left; padding: 7px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { color: var(--ink-faint); font-weight: 600; font-size: 11px;
     text-transform: uppercase; letter-spacing: .05em; background: var(--bg-sink); }
tr:last-child td { border-bottom: 0; }
td.num { text-align: right; }
.wrap { overflow-x: auto; }

/* ---- the gap: the whole point of this page --------------------------- */
.pair { display: inline-flex; align-items: baseline; gap: 5px; font-family: var(--mono); }
.pair .arrow { color: var(--ink-faint); }
.pair .d { color: var(--ink-faint); }
.pair .f { color: var(--ink); }
.pair[data-differs="true"] { background: color-mix(in srgb, var(--gap) 16%, transparent);
  border-radius: 4px; padding: 0 5px; }
.pair[data-differs="true"] .f { color: var(--gap); font-weight: 650; }
.pair[data-same="true"] .arrow, .pair[data-same="true"] .d { display: none; }

.tag { display: inline-block; padding: 1px 7px; border-radius: 4px; font-size: 11px;
       border: 1px solid var(--line); color: var(--ink-dim); font-family: var(--mono); }
.tag.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 45%, transparent); }
.tag.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, transparent); }
.tag.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 45%, transparent); }

.notice { border-left: 3px solid var(--gap); background: var(--bg-raise);
          border-radius: 0 6px 6px 0; padding: 9px 13px; margin-bottom: 8px; }
.notice .h { font-family: var(--mono); font-size: 12px; }
.notice .d { color: var(--ink-dim); margin-top: 2px; }
.empty { color: var(--ink-faint); padding: 14px; border: 1px dashed var(--line);
         border-radius: 8px; text-align: center; }

/* ---- controls -------------------------------------------------------- */
button.act, input, select {
  font: inherit; color: var(--ink); background: var(--bg-sink);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 9px;
}
input[type="checkbox"] { padding: 0; width: 15px; height: 15px; accent-color: var(--accent); }
button.act { cursor: pointer; }
button.act:hover { border-color: var(--accent); color: var(--accent); }
button.act.danger:hover { border-color: var(--bad); color: var(--bad); }
button.act:disabled { opacity: .45; cursor: not-allowed; }
input, select { min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
label.f { display: flex; flex-direction: column; gap: 3px; font-size: 11px; color: var(--ink-faint); }

.banner { padding: 10px 14px; border-radius: 8px; margin-bottom: 14px;
          border: 1px solid var(--line); background: var(--bg-raise); }
.banner.bad  { border-color: color-mix(in srgb, var(--bad) 50%, transparent); }
.banner.ok   { border-color: color-mix(in srgb, var(--ok) 50%, transparent); }
.secret { font-family: var(--mono); word-break: break-all; user-select: all;
          background: var(--bg-sink); padding: 7px 9px; border-radius: 6px; display: block; margin-top: 6px; }
.feed { max-height: 300px; overflow-y: auto; font-family: var(--mono); font-size: 11.5px; }
.feed div { padding: 2px 0; border-bottom: 1px solid var(--line-soft); color: var(--ink-dim); }
.feed b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>

<header>
  <div class="brand">ROADSTEAD<span>management</span></div>
  <div class="spacer"></div>
  <span class="pill" id="uptime">—</span>
  <span class="pill" id="live" data-state="idle"><span class="dot"></span><span id="livetext">connecting</span></span>
  <button class="act" id="refresh">Refresh</button>
</header>

<nav id="tabs"></nav>
<main>
  <div id="banner"></div>
  <!-- Editors render here rather than into #banner: a form an operator is
       filling in must not be wiped by the next status message. -->
  <div id="editor"></div>
  <div id="view"><div class="empty">loading…</div></div>
</main>

<script>
"use strict";

/* ---------------------------------------------------------------------------
 * The routes this page depends on, in ONE table.
 *
 * 🚨 Not scattered through the handlers: tests/test_admin_ui.py reads these
 * literals back and fails if one names a route the server does not serve. A UI
 * is a client of a contract like any other, and a client whose URLs drift is a
 * page that 404s in the one view nobody opened this week — the same failure the
 * SDK's transcribed literals are pinned against.
 * ------------------------------------------------------------------------- */
const API = {
  status:      "/v1/status",
  config:      "/rs/v1/admin/config",
  keys:        "/rs/v1/admin/keys",
  key:         (id) => "/rs/v1/admin/keys/" + encodeURIComponent(id),
  rotate:      (id) => "/rs/v1/admin/keys/" + encodeURIComponent(id) + "/rotate",
  callers:     "/rs/v1/admin/callers",
  caller:      (id) => "/rs/v1/admin/callers/" + encodeURIComponent(id),
  providers:   "/rs/v1/admin/providers",
  provider:    (p) => "/rs/v1/admin/providers/" + encodeURIComponent(p),
  endpoint:    (e) => "/rs/v1/admin/endpoints/" + encodeURIComponent(e),
  credential:  (p) => "/rs/v1/admin/providers/" + encodeURIComponent(p) + "/credential",
  epStatus:    (ep) => "/rs/v1/admin/endpoints/" + encodeURIComponent(ep) + "/status",
  audit:       "/rs/v1/admin/audit",
  flags:       "/rs/v1/admin/flags",
  maintenance: "/rs/v1/admin/maintenance",
  pause:       (ep) => "/rs/v1/admin/endpoints/" + encodeURIComponent(ep) + "/pause",
  resume:      (ep) => "/rs/v1/admin/endpoints/" + encodeURIComponent(ep) + "/resume",
  stream:      "/rs/v1/admin/stream",
};

/* ---- plumbing -------------------------------------------------------- */

const $ = (sel) => document.querySelector(sel);
const el = (tag, attrs, ...kids) => {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "text") n.textContent = String(v);
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : String(v));
  }
  // flat(Infinity), not flat(): a view that maps rows to [node, " "] pairs hands
  // this an array of arrays, and one level of flattening leaves the inner arrays
  // to be stringified as "[object HTMLSpanElement]" — which renders, does not
  // throw, and looks like data until somebody reads it.
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
};

/* ---------------------------------------------------------------------------
 * EVERY field read off an API response goes through pick(), and that is a rule
 * with a test rather than a style.
 *
 * 🚨 A UI is a client of a contract, and this one has no compiler, no schema and
 * no types. Rename `capacity.slots.in_force` on the server and the page renders
 * "—" in one cell of one view, forever, looking entirely healthy — which is the
 * failure mode a dashboard is worst at and the exact shape of the vision
 * capability nothing read. Routing the reads through one function makes the
 * paths EXTRACTABLE, so tests/test_admin_ui.py can walk every one of them
 * against a real response from a real service and fail when one stops resolving.
 * ------------------------------------------------------------------------- */
function pick(obj, path, dflt) {
  let cur = obj;
  for (const seg of path.split(".")) {
    if (cur === null || cur === undefined) return dflt;
    cur = cur[seg];
  }
  return cur === undefined ? dflt : cur;
}

/* ---------------------------------------------------------------------------
 * THE WRITE GUARD.
 *
 * 🚨 A page whose write controls are live and whose writes 403 is worse than one
 * that shows them disabled: the operator learns their scope from a failure,
 * having already typed the change. The server is still the enforcer — this is a
 * courtesy, not a control — which is exactly why it defaults to ALLOWED when the
 * field is absent. A UI that disabled itself against a server that does not
 * publish the field would be a page that cannot be used, and the refusal it is
 * anticipating would have been a clean 403 anyway.
 *
 * The scope is read, never derived: `you.may_write` comes from the one place
 * that decides what an admin scope permits (identity.IdentityResolver), and the
 * page does not know that `admin_readonly` exists.
 * ------------------------------------------------------------------------- */
function mayWrite() { return pick(state.config, "you.may_write", true) !== false; }

/** Disable a write control when the scope is read-only, and say why on hover. */
function guarded(node) {
  if (mayWrite()) return node;
  node.setAttribute("disabled", "");
  node.setAttribute("title", "this credential has read-only admin scope");
  return node;
}

/** The banner a read-only operator sees at the top of every writable view. */
function readonlyNote() {
  if (mayWrite()) return null;
  return el("div", { class: "notice" }, el("div", { class: "d" },
    el("b", { text: "Read-only admin scope" }),
    " — every view here is available and every control is disabled. Widening it "
    + "means issuing a different credential, not changing an address allowlist."));
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ headers: { "Accept": "application/json" } }, opts || {}));
  let body = null;
  try { body = await res.json(); } catch (_) { /* an empty or non-JSON body is not a crash */ }
  if (!res.ok) {
    const err = new Error((body && (body.error || (body.error_detail && body.error_detail.message))) || ("HTTP " + res.status));
    err.status = res.status;
    err.body = body;
    throw err;
  }
  return body;
}

/* 🚨 A 401/403 on a fetch does NOT re-prompt the browser — only a navigation
 * does. So say what to do instead of leaving the page silently stale, which is
 * the failure mode a dashboard is worst at: it keeps rendering the last good
 * answer and looks entirely healthy. */
function banner(kind, ...kids) {
  $("#banner").replaceChildren(kids.length ? el("div", { class: "banner " + kind }, ...kids) : "");
}
function reportError(err) {
  if (err.status === 401 || err.status === 403) {
    banner("bad",
      el("b", { text: "Not authorised" }), " — ",
      "this session's credential does not carry the admin scope, or the browser did not attach it. ",
      el("a", { href: location.pathname, text: "Reload the page" }),
      " to be challenged again. The password is an admin API key; the username is ignored.");
  } else {
    banner("bad", el("b", { text: "Request failed" }), " — ", String(err.message || err));
  }
}

const fmt = {
  n: (v, d) => (v === null || v === undefined || Number.isNaN(v)) ? "—" : Number(v).toFixed(d === undefined ? 0 : d),
  usd: (v) => (v === null || v === undefined) ? "—" : "$" + Number(v).toFixed(4),
  ms: (v) => (v === null || v === undefined) ? "—" : Math.round(v) + " ms",
  dur: (s) => {
    if (s === null || s === undefined) return "—";
    s = Math.floor(s);
    if (s < 90) return s + "s";
    if (s < 5400) return Math.floor(s / 60) + "m";
    if (s < 172800) return Math.floor(s / 3600) + "h";
    return Math.floor(s / 86400) + "d";
  },
  when: (ts) => ts ? new Date(ts * 1000).toLocaleString() : "—",
  bool: (v) => v === true ? "yes" : v === false ? "no" : "—",
};

/* 🚨 THE component. Everything this page exists to show goes through here:
 * a value an operator DECLARED beside the value actually IN FORCE. When they
 * agree it collapses to one number and gets out of the way; when they differ it
 * is loud, because that difference is the thing worth a person's attention. */
function pair(declared, inForce, opts) {
  const o = opts || {};
  const d = declared === null || declared === undefined || declared === "" ? "—" : String(declared);
  const f = inForce === null || inForce === undefined || inForce === "" ? "—" : String(inForce);
  const same = d === f;
  // 🚨 The attribute values are the STRING "true", not a boolean. `el` renders a
  // boolean `true` as an empty attribute, and `[data-same="true"]` does not match
  // an empty one — so the collapse-when-equal and highlight-when-different rules
  // both silently never fired, and every pair rendered as an unexplained arrow.
  const node = el("span", {
    class: "pair",
    "data-differs": (!same && !o.quiet) ? "true" : null,
    "data-same": same ? "true" : null,
  });
  node.append(el("span", { class: "d", text: d }), el("span", { class: "arrow", text: "→" }),
              el("span", { class: "f", text: f }));
  if (!same && o.why) node.title = o.why;
  return node;
}

function tag(text, kind) { return el("span", { class: "tag " + (kind || ""), text: text }); }

/* The doctrine, one click away rather than in front of the data. `why()`
 * takes the same string the page used to print as a permanent paragraph. */
function why(text, label) {
  return el("details", { class: "why" },
    el("summary", { text: label || "why" }),
    el("p", { class: "lede", text: text }));
}

/* 🚨 The signature: capacity drawn as BERTHS. `max_slots` cells, `in_flight`
 * of them filled, queued work shown as pressure beyond the wall. Reading a
 * column of these tells an operator which endpoint is full at a glance, which
 * "3 / 4" does not. Falls back to a dash when there is nothing to draw —
 * an unrouted endpoint has no berths, and drawing zero of them would say the
 * backend was asked and answered nothing (the same null-vs-zero rule the
 * capacity columns follow). */
function berths(inFlight, maxSlots, queued) {
  const max = Number(maxSlots) || 0;
  if (!max) return el("span", { class: "berths none", text: "—" });
  const used = Math.max(0, Math.min(max, Number(inFlight) || 0));
  const q = Math.max(0, Number(queued) || 0);
  const cells = [];
  for (let i = 0; i < max; i++) {
    cells.push(el("span", { class: "berth" + (i < used ? " full" : "") }));
  }
  if (q) cells.push(el("span", { class: "berth queued", title: q + " queued" }));
  return el("span", { class: "berths", title: used + " of " + max + " slots busy" },
    ...cells, el("span", { class: "count", text: used + "/" + max }));
}
function empty(msg) { return el("div", { class: "empty", text: msg }); }
function table(headers, rows) {
  const head = headers.map((h) => el("th", { text: h }));
  // A numeric header that stays left-aligned over right-aligned figures reads as
  // a different column. Copy the alignment off the first row rather than making
  // every call site declare it twice — the cells already know.
  const first = rows[0];
  if (first) {
    Array.from(first.children).forEach((cell, i) => {
      if (cell.classList.contains("num") && head[i]) head[i].className = "num";
    });

  return el("div", { class: "wrap" },
    el("table", {}, el("thead", {}, el("tr", {}, head)), el("tbody", {}, rows)));
}

async function enrol() {
  const body = { agent_id: $("#nk-agent").value.trim(), priority: $("#nk-prio").value };
  const floor = $("#nk-floor").value.trim();
  if (floor) body.min_timeout_s = Number(floor);
  const id = $("#nk-id").value.trim();
  if (id) body.id = id;
  if ($("#nk-admin").checked) body.admin = true;
  const exp = $("#nk-exp").value.trim();
  if (exp) body.expires_in_s = Number(exp);
  const bind = $("#nk-bind").value.trim();
  if (bind) body.bind = bind.split(",").map((c) => c.trim()).filter(Boolean);
  if ($("#nk-admin-ro").checked) {
    if (!body.admin) { banner("bad", "read-only narrows the admin scope — tick admin beside it, or leave it off."); return; }
    body.admin_readonly = true;
  }
  if (!body.agent_id) { banner("bad", "agent_id is required."); return; }
  try {
    const res = await api(API.keys, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    banner("ok",
      el("b", { text: "Enrolled " + pick(res, "key_id", "") }),
      " — copy this now. It is not stored and cannot be shown again.",
      el("code", { class: "secret", text: pick(res, "key", "(no secret returned)") }),
      warnings(res), persisted(res));
    render();
  } catch (e) { reportError(e); }
}
/* 🚨 One call, because doing it by hand is two in an order that matters and
 * both orders are wrong. The overlap is ASKED FOR rather than defaulted: the
 * usual reason to rotate is that the old credential should stop working, and a
 * rotation that silently left it alive is the one an operator believes they
 * have completed. An inline form rather than a prompt(), matching editCaller —
 * a browser prompt blocks the page's event loop and cannot be styled or read
 * back, which is why confirmish() is confined to the one action it guards. */
function rotate(keyId, agentId) {
  const box = el("div", { class: "banner" },
    el("b", { text: "Rotate " + keyId + " (" + agentId + ")" }),
    why("The successor inherits this key's agent_id, priority, deadline floor, admin scope and binding — a rotation is a new secret for the same identity. The overlap is how long the OLD key keeps working while you deploy the new one; 0 revokes it immediately, which breaks any caller still presenting it."),
    el("div", { class: "row" },
      field("overlap (s)", guarded(el("input", { id: "rk-overlap", type: "number", step: "1", value: "3600", style: "width:130px" }))),
      field("successor id", el("input", { id: "rk-id", placeholder: "auto" })),
      guarded(el("button", { class: "act", text: "Rotate", onclick: () => doRotate(keyId) })),
      el("button", { class: "act", text: "Cancel", onclick: () => banner("") })));
  $("#banner").replaceChildren(box);
  window.scrollTo({ top: 0, behavior: "smooth" });
}
async function doRotate(keyId) {
  const overlap = Number($("#rk-overlap").value.trim() || "0");
  if (!Number.isFinite(overlap) || overlap < 0) { banner("bad", "overlap must be a number of seconds."); return; }
  const body = { overlap_s: overlap };
  const id = $("#rk-id").value.trim();
  if (id) body.id = id;
  try {
    const res = await api(API.rotate(keyId), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body) });
    banner("ok",
      el("b", { text: "Rotated " + keyId + " → " + pick(res, "key_id", "") }),
      " — copy this now. It is not stored and cannot be shown again.",
      el("code", { class: "secret", text: pick(res, "key", "(no secret returned)") }),
      warnings(res), persisted(res));
    render();
  } catch (e) { reportError(e); }
}
async function revoke(keyId, agentId) {
  if (!confirmish("Revoke " + keyId + " (" + agentId + ")? It stops working immediately.")) return;
  try {
    const res = await api(API.key(keyId), { method: "DELETE" });
    banner("ok", el("b", { text: "Revoked " + keyId }), " ", warnings(res), persisted(res));
    render();
  } catch (e) { reportError(e); }
}
/* A plain confirm() blocks the event loop of the page, which is fine, but it is
 * also the one browser dialog that cannot be styled or tested. Kept because the
 * alternative — a bespoke modal — is more code than the action it guards. */
function confirmish(msg) { return window.confirm(msg); }

/* 🚨 An array, never a field. Two disclosures can be true of one action — the
 * canonical pair being "this key is also declared in the environment, so it
 * returns on restart" and "that was the last key, so the deployment is back on
 * address identity". A single field means the second silently overwrites the
 * first. */
function warnings(res) {
  const ws = pick(res, "warnings", []);
  return ws.length ? el("div", {}, ws.map((w) => el("div", { class: "notice" },
    el("div", { class: "d", text: typeof w === "string" ? w : (w.detail || JSON.stringify(w)) }))) ) : null;
}
function persisted(res) {
  if (pick(res, "persisted", true) !== false) return null;
  return el("div", { class: "notice" }, el("div", { class: "d" },
    el("b", { text: "In force, but not persisted" }),
    " — " + pick(res, "reason", "the runtime overlay is not writable") +
    ". The change applies now and will not survive a restart."));
}

/* 🚨 A quota cell shows a PAIR only when something actually overrode the file.
 *
 * `declared` carries only the fields the file set, so pairing it against
 * `in_force` unconditionally would light up every caller that took a default —
 * which is to say all of them, on a fresh install. A highlight that fires on
 * everything means nothing; same lesson as `substituted: true` firing on every
 * intent-routed call. So the difference shown is the one an operator caused. */
function quotaCell(row, name) {
  // The three blocks are picked whole and indexed by field, rather than built as
  // "quota.in_force." + name — a path assembled from a variable is a path the
  // drift guard cannot read, and a guard that cannot read its subject is not a
  // guard. The field NAMES are already pinned three ways on the server
  // (EDITABLE_QUOTA_FIELDS, the file parser, and the dataclass).
  const inForce = pick(row, "quota.in_force", {})[name];
  const runtime = pick(row, "quota.runtime", {})[name];
  const declared = pick(row, "quota.declared", {})[name];
  if (runtime === undefined) return el("span", { class: "mono", text: String(inForce) });
  return pair(declared === undefined ? "(default)" : declared, inForce,
              { why: "changed at runtime through /rs/v1/admin/callers" });
}

      // 🚨 Named separately from the spend one. Both cost exactly the same

      pick(row, "rate.over") === true

    el("td", {}, pair(pick(row, "spend.declared_priority"), pick(row, "spend.effective_priority"),

    el("td", { class: "num" },

    el("td", { class: "num", text: fmt.usd(pick(row, "spend.spent_today_usd")) }),

              + "refused — pause it first, which drains. models.yaml is not touched.")) return;

/* ---- catalog editing (roadmap J2) -------------------------------------
 * 🚨 The form fields are models.yaml's OWN field names, because the body IS a
 * models.yaml stanza — the overlay contributes stanzas rather than a second
 * model of an endpoint. An operator can read what they typed here and paste it
 * into the file, and the server validates it with the same parser the file
 * gets. A form with its own invented vocabulary would be a translation layer
 * with nothing on the far side.
 * --------------------------------------------------------------------- */
/* 🚨 The engine list and the fields each one needs come from the SERVER, not
 * from here. `GET /rs/v1/admin/providers` publishes every engine this build
 * registered along with its descriptor, so a fourth provider gets a correct
 * form without this page being edited — which is the whole argument the
 * descriptor exists for, and the alternative is a list in the page that is the
 * fifth place an engine has to be added and the one nobody remembers. */
function engineNames() { return Object.keys(pick(state.providers, "engines", {})); }
function engineSpec(name) { return pick(state.providers, "engines", {})[name] || {}; }
const KINDS = ["chat", "embed", "rerank"];
const STATUSES = ["active", "planned"];
const CAPABILITIES = ["streaming", "tool_calling", "structured_output",
                      "reasoning", "vision"];

function num(id, value, width) {
  return el("input", { id: id, type: "number", value: value ?? "",
                       style: "width:" + (width || 90) + "px" });
}

async function saveCatalog(kind, name, body, method, secret) {
  const url = kind === "provider" ? API.provider(name) : API.endpoint(name);
  try {
    const res = await api(url, {
      method: method, headers: { "Content-Type": "application/json" },
      body: method === "DELETE" ? undefined : JSON.stringify(body),
    });
    if (secret) {
      // Separate request, separate route, write-only. If this fails the
      // provider still exists and the operator is told which half went wrong.
      await api(API.credential(name), {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ value: secret }),
      });
    }
    const changed = pick(res, "reconciled", {});
    banner("ok", el("b", { text: kind + " " + name + " saved." }), " ",
      (changed.added || []).length ? "In service: " + changed.added.join(", ") + ". " : "",
      (changed.removed || []).length ? "Out of service: " + changed.removed.join(", ") + ". " : "",
      (pick(res, "warnings", []) || []).join(" "));
    $("#editor").replaceChildren();
    render();
  } catch (err) { reportError(err); }
}

function providerForm(existing) {
  const name = pick(existing, "provider", "");
  const creating = !name;
  const addr = pick(existing, "address", {});
  const engines = engineNames();
  const engineSel = select("pv-engine", engines,
    pick(existing, "engine", engines[0] || "llama.cpp"));
  const addressRow = el("div", { class: "row", id: "pv-address" });
  const box = el("div", { class: "banner" },
    el("b", { text: creating ? "Add a provider" : "Edit provider " + name }),
    why("A provider is how to REACH a backend and how to speak to it — engine, address, credential. It is separate from an endpoint (a routable unit of capacity with policy) because one remote provider hosts many endpoints, and declaring its base URL and key once is the reason the sections are separate."),
    el("div", { class: "row" },
      field("name", el("input", { id: "pv-name", value: name,
        disabled: !creating, placeholder: "small-box", style: "width:160px" })),
      field("engine", engineSel)),
    addressRow,
    el("div", { class: "row" },
      guarded(el("button", { class: "act primary", text: creating ? "Add provider" : "Save",
        onclick: () => {
          const n = $("#pv-name").value.trim();
          if (!n) { banner("bad", "A provider needs a name."); return; }
          const body = { engine: $("#pv-engine").value };
          // Only the fields this engine actually uses are on the page, so only
          // those are sent. The server refuses the ones it needs and lacks.
          if ($("#pv-host")) body.host = $("#pv-host").value.trim();
          if ($("#pv-port") && $("#pv-port").value) body.port = Number($("#pv-port").value);
          if ($("#pv-base")) body.base_url = $("#pv-base").value.trim();
          if ($("#pv-env")) body.api_key_env = $("#pv-env").value.trim();
          // The secret never travels with the stanza — it goes to the
          // write-only credential route AFTER the provider exists, and the
          // field is cleared either way.
          const secret = $("#pv-secret") ? $("#pv-secret").value : "";
          if ($("#pv-secret")) $("#pv-secret").value = "";
          saveCatalog("provider", n, body, creating ? "PUT" : "PATCH", secret);
        }})),
      el("button", { class: "act", text: "Cancel",
        onclick: () => $("#editor").replaceChildren() })));

  /* 🚨 The address fields follow the ENGINE's descriptor. Showing host, port
   * and base_url together invites filling in the wrong two — and for a remote
   * provider host and port mean nothing at all, so the form was asking for an
   * address that would be ignored and a key it did not mark as required. */
  function drawAddress() {
    const spec = engineSpec($("#pv-engine").value);
    const remote = spec.addressed_by_base_url;
    const kids = remote
      ? [field("base_url", el("input", { id: "pv-base", style: "width:320px",
           value: pick(addr, "base_url", "") || (spec.default_base_url || ""),
           placeholder: spec.default_base_url || "https://…/v1" }))]
      : [field("host", el("input", { id: "pv-host", value: pick(addr, "host", ""),
           placeholder: "192.0.2.11", style: "width:170px" })),
         field("port", num("pv-port", pick(addr, "port", "")))];
    if (spec.requires_credential || pick(existing, "credential.env_var")) {
      /* 🚨 TWO fields, and the second one is why. An operator pasted a live
       * OpenRouter key into the variable-name box on 2026-09-01 — reasonably,
       * because it was the only key-shaped field on the form and the form
       * offered nowhere else to put a key. The plane stored it, wrote it to
       * disk, put it in the audit trail and echoed it back from the read view.
       * The server now refuses a value that is not a valid variable name, but
       * that check is necessary rather than sufficient (`ghp_...` IS a legal
       * identifier), so the real fix is here: give the key an obvious home. */
      kids.push(field("api_key_env — the variable's NAME",
        el("input", { id: "pv-env", style: "width:230px",
          value: pick(existing, "credential.env_var", ""),
          placeholder: "OPENROUTER_API_KEY" })));
      kids.push(field("the key itself — optional, write-only",
        el("input", { id: "pv-secret", type: "password", autocomplete: "off",
          spellcheck: "false", style: "width:260px",
          placeholder: "paste it here, not on the left" })));
    }
    kids.push(el("div", { class: "lede", style: "flex-basis:100%;margin:4px 0 0" },
      remote ? "Reached at a base URL — host and port do not apply to this engine."
             : "Reached at host and port."));
    addressRow.replaceChildren(...kids);
  }
  engineSel.addEventListener("change", drawAddress);
  $("#editor").replaceChildren(box);
  drawAddress();
  box.scrollIntoView({ block: "nearest" });
}

function endpointForm(existing, providers) {
  const name = pick(existing, "endpoint", "");
  const creating = !name;
  const caps = pick(existing, "capabilities", []);
  const box = el("div", { class: "banner" },
    el("b", { text: creating ? "Add an endpoint" : "Edit endpoint " + name }),
    why("An endpoint is a routable unit of capacity with policy — slots, context, floors, capabilities, failover — naming the provider that reaches it. `slots` on a LOCAL engine is a seed that discovery corrects; on a remote one it is a policy cap on our own concurrency, because a remote provider publishes no occupancy. Capabilities are what an intent matches on: an endpoint that does not declare `reasoning` will never serve the `reasoning` intent, whatever the model can actually do."),
    el("div", { class: "row" },
      field("name", el("input", { id: "ep-name", value: name, disabled: !creating,
        placeholder: "tier1", style: "width:150px" })),
      field("provider", select("ep-provider", providers, pick(existing, "provider", providers[0]))),
      field("kind", select("ep-kind", KINDS, pick(existing, "kind", "chat"))),
      field("status", select("ep-status", STATUSES,
        pick(existing, "routed") === false ? "planned" : "active")),
      field("model", el("input", { id: "ep-model", style: "width:220px",
        value: pick(existing, "model.pinned_model", ""),
        placeholder: "openai/gpt-oss-120b" }))),
    el("div", { class: "row" },
      field("slots", num("ep-slots", pick(existing, "capacity.slots.declared", 4))),
      field("context_per_slot", num("ep-ctx",
        pick(existing, "capacity.context_per_slot.declared", 8192), 120)),
      field("timeout_floor_s", num("ep-floor", "")),
      field("failover_to", el("input", { id: "ep-failover", style: "width:130px",
        value: pick(existing, "routing.failover_to", "") })),
      field("spill_to", el("input", { id: "ep-spill", style: "width:130px",
        value: pick(existing, "routing.spill_to", "") }))),
    el("div", { class: "row" },
      field("capabilities", el("div", { class: "row" }, CAPABILITIES.map((c) =>
        el("label", { class: "f", style: "flex-direction:row;gap:5px;align-items:center" },
          el("input", { id: "ep-cap-" + c, type: "checkbox",
                        checked: caps.includes(c) }), c))))),
    el("div", { class: "row" },
      guarded(el("button", { class: "act primary", text: creating ? "Add endpoint" : "Save",
        onclick: () => {
          const n = $("#ep-name").value.trim();
          if (!n) { banner("bad", "An endpoint needs a name."); return; }
          const body = {
            provider: $("#ep-provider").value,
            kind: $("#ep-kind").value,
            status: $("#ep-status").value,
            slots: Number($("#ep-slots").value || 0),
            context_per_slot: Number($("#ep-ctx").value || 0),
            capabilities: Object.fromEntries(
              CAPABILITIES.map((c) => [c, $("#ep-cap-" + c).checked])),
          };
          if ($("#ep-model").value.trim()) body.model = $("#ep-model").value.trim();
          if ($("#ep-floor").value) body.timeout_floor_s = Number($("#ep-floor").value);
          if ($("#ep-failover").value.trim()) body.failover_to = $("#ep-failover").value.trim();
          if ($("#ep-spill").value.trim()) body.spill_to = $("#ep-spill").value.trim();
          saveCatalog("endpoint", n, body, creating ? "PUT" : "PATCH");
        }})),
      el("button", { class: "act", text: "Cancel",
        onclick: () => $("#editor").replaceChildren() })));
  $("#editor").replaceChildren(box);
  box.scrollIntoView({ block: "nearest" });
}

/* 🚨 A password field, and the value never comes back out. The plane is
 * write-only for credentials — no prefix, no digest, no length — so the page
 * has nothing to render afterwards except "resolved", which is exactly what
 * it renders. Cleared immediately either way: a key sitting in a detached DOM
 * node is a key in the page. */
async function setCredential(provider) {
  const input = el("input", { id: "cred-value", type: "password",
                              autocomplete: "off", spellcheck: "false",
                              placeholder: "paste the key",
                              style: "width:380px;font-family:var(--mono)" });
  const box = el("div", { class: "banner" },
    el("b", { text: "Set the credential for " + provider }),
    why("This sets the environment variable the provider names in models.yaml, for this process only. It takes effect on the very next request — a provider reads the variable when it calls, not when the proxy boots — and it is gone on restart. Export the variable to make it durable. Nothing here or in the audit trail ever records the value.",
        "what this does, and what it does not"),
    el("div", { class: "row" },
      field("value", input),
      el("button", { class: "act primary", text: "Set key", onclick: async () => {
        const value = input.value;
        input.value = "";
        if (!value) { banner("bad", "Nothing to set — the field was empty."); return; }
        try {
          const res = await api(API.credential(provider), {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ value }),
          });
          banner("ok", el("b", { text: "$" + pick(res, "credential.env_var", "?") + " is set." }),
                 " ", (pick(res, "warnings", []) || []).join(" "));
          render();
        } catch (err) { reportError(err); }
      }}),
      el("button", { class: "act", text: "Cancel", onclick: () => {
        input.value = ""; banner("");
      }})));
  $("#banner").replaceChildren(box);
  input.focus();
}

async function setEndpointStatus(endpoint, status) {
  const bringing = status === "active";
  if (!bringing && !confirmish(
        "Take " + endpoint + " out of service? Work already in flight keeps its "
        + "endpoint; this refuses if anything is running, so pause it first.")) return;
  try {
    const res = await api(API.epStatus(endpoint), {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ status }),
    });
    banner("ok",
      el("b", { text: endpoint + (bringing ? " is in service." : " is out of service.") }),
      " ", (pick(res, "warnings", []) || []).join(" "),
      pick(res, "persisted") ? "" : " Not persisted: " + pick(res, "reason", ""));
    render();
  } catch (err) { reportError(err); }
}

/* --- Control ----------------------------------------------------------- */
async function viewControl(root) {
  const f = await api(API.flags);
  const flags = pick(f, "flags", {});
  root.append(el("section", {},
    el("h2", { text: "Runtime flags" }),
    why("The shadow-to-enforce switches and the kill switches. A change takes effect immediately and is persisted across restarts; no process restart is needed."),
    table(["flag", "state", ""], Object.entries(flags).sort().map(([name, on]) => el("tr", {},
      el("td", {}, el("code", { text: name })),
      el("td", {}, on ? tag("on", "ok") : tag("off", "")),
      el("td", {}, guarded(el("button", { class: "act", text: on ? "Turn off" : "Turn on",
        onclick: () => setFlag(name, !on) })))))),
    readonlyNote()));

  let windows = { windows: [] };
  try { windows = await api(API.maintenance); } catch (e) { /* no persistence backend is not an error here */ }
  root.append(el("section", {},
    el("h2", { text: "Maintenance windows" }),
    why("Tag a deliberate restart so its burst of timeouts reads as planned rather than as an incident. Pause/resume records one automatically; this is for a restart taken without the drain."),
    el("div", { class: "row" },
      // 🚨 The INPUTS are guarded too, not just the submit. Found by rendering
      // the page as a read-only operator on 2026-09-01: the Record button was
      // correctly disabled and the three fields beside it were not, so the form
      // invited an operator to fill in something they could never send. Not a
      // security hole — the button is dead and the plane 403s anyway — but a
      // control that looks usable and is not is the same lie as a cell that
      // renders "—" forever.
      field("endpoint", guarded(el("input", { id: "mw-ep", placeholder: "tier1 or *" }))),
      field("reason", guarded(el("input", { id: "mw-reason", placeholder: "model swap", style: "width:220px" }))),
      field("backdate (s)", guarded(el("input", { id: "mw-dur", type: "number", placeholder: "open now", style: "width:120px" }))),
      guarded(el("button", { class: "act", text: "Record", onclick: recordWindow }))),
    pick(windows, "windows", []).length
      ? table(["endpoint", "started", "ended", "reason", "operator"],
          pick(windows, "windows", []).map((w) => el("tr", {},
            el("td", {}, el("code", { text: pick(w, "endpoint", "?") })),
            el("td", { text: fmt.when(pick(w, "started_at")) }),
            el("td", { text: pick(w, "ended_at") ? fmt.when(pick(w, "ended_at")) : "open" }),
            el("td", { text: pick(w, "reason", "") }),
            el("td", { text: pick(w, "operator", "") }))))
      : empty("no windows in the last 24 hours")));
}
async function setFlag(name, on) {
  try {
    await api(API.flags, { method: "POST", headers: { "Content-Type": "application/json" },
                           body: JSON.stringify({ [name]: on }) });
    banner("ok", "Flag " + name + " is now " + (on ? "on" : "off") + ".");
    render();
  } catch (e) { reportError(e); }
}
async function recordWindow() {
  const body = { endpoint: $("#mw-ep").value.trim(), reason: $("#mw-reason").value.trim() };
  const dur = $("#mw-dur").value.trim();
  if (dur) body.duration_s = Number(dur);
  if (!body.endpoint) { banner("bad", "endpoint is required."); return; }
  try {
    const res = await api(API.maintenance, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    banner("ok", "Recorded " + pick(res, "recorded", []).length + " window(s).");
    render();
  } catch (e) { reportError(e); }
}
async function control(path, body) {
  try {
    const res = await api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body || {}) });
    banner("ok", el("code", { text: pick(res, "endpoint", "?") }),
      pick(res, "paused") ? " is paused — it is draining." : " is resumed.");
    render();
  } catch (e) { reportError(e); }
}

/* --- Audit -------------------------------------------------------------
 * The fifth reporting seam. The other four report a STATE, and a state cannot
 * say who put it there — the gap view shows a quota that is not what the file
 * says, and only this says which credential moved it and when.
 * --------------------------------------------------------------------- */
async function viewAudit(root) {
  const a = await api(API.audit);
  const entries = pick(a, "entries", []);

  root.append(el("section", {},
    el("h2", { text: "Audit" }),
    why("Every mutating admin route records here, including the four control routes that predate this plane — a trail covering only some of them would be worse than none, because a reader assumes completeness. A record names the credential and never carries one."),
    el("div", { class: "row" },
      // 🚨 The limits, as data. An in-memory trail is the DEFAULT (no admin
      // store is configured by default) and the bound discards silently unless
      // it is counted. A trail that presented itself as complete while being
      // neither durable nor unbounded would be a thing that looks like an
      // answer and silences the question.
      pick(a, "persisted") ? tag("persisted to " + pick(a, "store", ""), "ok")
        : tag("in memory only — " + pick(a, "reason", "no admin store"), "warn"),
      tag(pick(a, "held", 0) + " of " + pick(a, "capacity", 0) + " held"),
      pick(a, "dropped", 0) ? tag(pick(a, "dropped") + " dropped (oldest first)", "warn") : null)));

  root.append(el("section", {},
    entries.length
      ? table(["when", "action", "target", "by key", "as", "from", "detail"],
          entries.map((e) => el("tr", {},
            el("td", { text: fmt.when(pick(e, "at")) }),
            el("td", {}, tag(pick(e, "action", "?"))),
            el("td", {}, el("code", { text: pick(e, "target", "") })),
            // 🚨 Both halves, always. A record with an address and no key id
            // means an address-derived admin made the change — a meaningful and
            // slightly alarming thing to find, and invisible if the two were
            // collapsed into one actor string.
            el("td", {}, pick(e, "actor.key_id")
              ? el("code", { text: pick(e, "actor.key_id") })
              : tag("no key", "warn")),
            el("td", {}, el("code", { text: pick(e, "actor.agent_id", "—") })),
            el("td", {}, el("code", { text: pick(e, "actor.address", "—") })),
            el("td", {}, el("code", { text: JSON.stringify(pick(e, "detail", {})) })))))
      : empty("nothing recorded yet — every key, quota, flag, drain and maintenance change lands here")));
}

/* ---- tabs + lifecycle ------------------------------------------------- */

/* ---- three panes ------------------------------------------------------
 * 🚨 Seven tabs became three on 2026-09-01, on the operator's own framing:
 * what is going on, how it is set up, and what happened. The old set was
 * organised by which API endpoint fed it, which is the system's structure
 * rather than the reader's question — and it produced a tab called "The gap"
 * that needed a commit message to explain.
 *
 * The rule for where a thing lives: OVERVIEW is what you watch and the verbs
 * you reach for while watching (pause a misbehaving backend, flip a flag).
 * CONFIGURATION is what you set up and expect to stay set. AUDIT is what
 * already happened. Anything that does not fit one of those three sentences
 * probably should not be on the page.
 * --------------------------------------------------------------------- */
const TABS = [
  { id: "overview", label: "Overview", view: viewOverview },
  { id: "config",   label: "Configuration", view: viewConfiguration,
    badge: () => pick(state.config, "notices", []).length },
  { id: "audit",    label: "Audit",    view: viewAudit },
];
let current = (location.hash || "#overview").slice(1);
if (!TABS.some((t) => t.id === current)) current = "overview";

/* A pane is several of the old views in sequence. They stay separate
 * functions: each is a coherent unit with its own guards, and gluing them
 * into one 300-line renderer would make every future change a merge. */
async function viewOverview(root) {
  await viewFleet(root);
  await viewCallersLive(root);
  await viewControl(root);
}

async function viewConfiguration(root) {
  await viewProviders(root);       // providers + endpoints, with CRUD
  await viewKeys(root);            // credentials
  await viewCallerQuotas(root);    // policy, not live state
  await viewConfig(root);          // sources, reach, overlay, not-in-force
}

function drawTabs() {
  $("#tabs").replaceChildren(...TABS.map((t) => {
    const n = t.badge ? t.badge() : 0;
    return el("button", { "aria-current": t.id === current, onclick: () => { current = t.id; location.hash = t.id; render(); } },
      t.label, n ? el("span", { class: "badge", text: String(n) }) : null);
  }));
}

let rendering = false;
async function render() {
  if (rendering) return;
  rendering = true;
  const tab = TABS.find((t) => t.id === current) || TABS[0];
  const root = el("div", {});
  try {
    await tab.view(root);
    $("#view").replaceChildren(root);
  } catch (e) {
    reportError(e);
    $("#view").replaceChildren(el("div", { class: "empty", text: "could not load this view" }));
  } finally {
    rendering = false;
    drawTabs();
  }
}

/* The chrome belongs to the page, not to one tab: the gap COUNT and the uptime
 * are wanted wherever you are. A badge that appears only once you open the tab
 * it counts is not a notification, and an uptime that blanks when you navigate
 * away from Fleet reads as the proxy having gone. */
async function primeChrome() {
  try { state.config = await api(API.config); drawTabs(); } catch (e) { /* the tab reports it */ }
  try { state.status = await api(API.status); uptimePill(); } catch (e) { /* likewise */ }
}

function uptimePill() {
  const up = pick(state.status, "scheduler.uptime_s");
  $("#uptime").textContent = up === undefined || up === null ? "—" : "up " + fmt.dur(up);
}

/* ---- the live stream --------------------------------------------------
 * EventSource cannot set a request header, so this works only because the page
 * and the stream sit in one directory and the browser attaches the credential
 * it already holds. It reconnects on its own; a slow reader is dropped by the
 * hub rather than allowed to stall the dispatch path, so losing the stream is
 * never a reason to stop trusting the REST views.
 * --------------------------------------------------------------------- */
function connect() {
  let es;
  try { es = new EventSource(API.stream); }
  catch (e) { setLive("lost", "unavailable"); return; }
  es.addEventListener("hello", () => setLive("live", "live"));
  es.addEventListener("call.completed", (ev) => {
    let f; try { f = JSON.parse(ev.data); } catch (_) { return; }
    state.feed.unshift(f);
    state.feed = state.feed.slice(0, 60);
    const feed = $("#feed");
    if (feed) feed.replaceChildren(...state.feed.map(feedRow));
  });
  es.addEventListener("metrics", () => { if (current === "fleet") render(); });
  es.onerror = () => setLive("lost", "reconnecting");
  es.onopen = () => setLive("live", "live");
}
function setLive(state_, text) {
  $("#live").setAttribute("data-state", state_);
  $("#livetext").textContent = text;
}

$("#refresh").addEventListener("click", () => render());
window.addEventListener("hashchange", () => {
  const h = location.hash.slice(1);
  if (h && h !== current && TABS.some((t) => t.id === h)) { current = h; render(); }
});

/* 🚨 primeChrome FIRST, and AWAITED, because it carries `you.may_write`.
 *
 * The write guard defaults to ALLOWED when the field is absent — it must, or a
 * server that does not publish it yields a page nobody can use. So rendering
 * before the config lands paints every write control LIVE for a read-only
 * operator: correct after the first heartbeat, wrong for the first paint, and
 * the first paint is the one somebody clicks. Found by loading the page as a
 * read-only admin. Every test was green; the buttons rendered, worked, and were
 * refused by the server after the click, which is the failure the guard exists
 * to prevent. The cost of fixing it is one local request before first paint.
 */
primeChrome().then(render).then(uptimePill);
connect();
/* A slow heartbeat, not a poll: the stream carries what changes quickly, and
 * this only catches what it does not — a config edit made from a terminal, an
 * endpoint that went unhealthy between metrics frames. 30s is chosen to be
 * boring; a dashboard on a fast cadence is exactly the load that finds a
 * concurrency violation, which is the other constraint this page has. */
setInterval(() => { if (!document.hidden) { primeChrome().then(render); } }, 30000);
</script>
</body>
</html>
