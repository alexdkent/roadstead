[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadstead"
version = "0.1.0.dev0"
description = "Capacity-aware admission control for self-hosted LLM inference fleets (llama.cpp + vLLM), without Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Kent" }]
keywords = ["llm", "gateway", "proxy", "inference", "llama.cpp", "vllm", "admission-control", "scheduler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
]

# Deliberately few. Adding one is a decision, not a convenience — see CLAUDE.md.
dependencies = [
  "httpx>=0.27",
  # Upper bound is LOAD-BEARING: Starlette 1.0 removed the on_startup/on_shutdown
  # constructor args this app uses. Migrating to lifespan= lifts it.
  "starlette>=0.37,<1.0",
  "uvicorn>=0.30",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
]

[project.scripts]
roadstead = "roadstead.__main__:main"

[project.urls]
Repository = "https://github.com/alexdkent/roadstead"

[tool.setuptools.packages.find]
include = ["roadstead*"]

[tool.setuptools.package-data]
roadstead = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["_pending"]
asyncio_mode = "auto"
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
