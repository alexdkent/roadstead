[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadstead"
version = "0.1.0.dev0"
description = "Capacity-aware admission control for self-hosted LLM inference fleets (llama.cpp + vLLM), without Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Kent" }]
keywords = ["llm", "gateway", "proxy", "inference", "llama.cpp", "vllm", "admission-control", "scheduler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  # The other reader of this project is whoever operates it. The knobs are
  # environment variables and a YAML catalog, not an API.
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  # No Windows classifier, deliberately: the durable-state defaults, the
  # SIGTERM drain and the stop-grace arithmetic are all POSIX signal semantics.
  "Operating System :: POSIX",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  # PEP 561: `roadstead/py.typed` ships, so an installing project's type
  # checker reads these annotations instead of treating the package as Any.
  "Typing :: Typed",
]

# Deliberately few. Adding one is a decision, not a convenience — see CLAUDE.md.
dependencies = [
  "httpx>=0.27",
  # The <1.0 upper bound was lifted on 2026-08-31 by migrating build_app from
  # on_startup=/on_shutdown= (removed in Starlette 1.0) to lifespan=. Verified
  # green on both 0.52.1 and 1.6.0: 1066 passed, 1 skipped, each run. Do not
  # re-add a bound without recording what breaks above it.
  "starlette>=0.37",
  "uvicorn>=0.30",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
  "build>=1.2",
]

[project.scripts]
roadstead = "roadstead.__main__:main"

[project.urls]
Homepage = "https://github.com/alexdkent/roadstead"
Repository = "https://github.com/alexdkent/roadstead"
Issues = "https://github.com/alexdkent/roadstead/issues"
Changelog = "https://github.com/alexdkent/roadstead/blob/main/CHANGELOG.md"
# There is no hosted docs site; `docs/api.md` IS the contract document, and
# `docs/compatibility.md` makes it executable — six tests read it back. Point
# `Documentation` at the thing the policy actually pins.
Documentation = "https://github.com/alexdkent/roadstead/blob/main/docs/api.md"

[tool.setuptools.packages.find]
include = ["roadstead*"]

[tool.setuptools.package-data]
# 🚨 `ui/index.html` ships, so it is PUBLIC SURFACE — same argument as
# `roadstead.testing`. It is one static file with no external references (the
# CSP the server sends forbids them, and a test sweeps for them), and nothing in
# the library imports it, so a deployment that never sets ROADSTEAD_ADMIN_UI
# pays only the ~40KB on disk.
#
# `py.typed` is the PEP 561 marker and is EMPTY BY SPECIFICATION — its presence
# is the whole signal. That makes it the package-data entry most likely to be
# dropped by a well-meaning cleanup, so the CI `package` job asserts it survives
# into the built wheel alongside the two YAMLs and the UI.
roadstead = ["*.yaml", "ui/*.html", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NB: no `norecursedirs` — it was ["_pending"], which silently OVERRODE pytest's
# own defaults (.git, build, dist, *.egg…). The quarantine is gone; leaving the
# key would keep that override for nothing.
asyncio_mode = "auto"
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
# `wire_fidelity` needs a real inference engine, so it is deselected by default
# and skips cleanly anyway when none is reachable. Run it with
#   pytest -m wire_fidelity tests/wire_fidelity/
# See tests/wire_fidelity/README.md.
addopts = "-m 'not wire_fidelity'"
markers = [
  "wire_fidelity: needs a REAL inference engine (see tests/wire_fidelity/)",
  # Pre-existing and previously unregistered, which cost 8 PytestUnknownMark
  # warnings on every run. Registering it changes no selection.
  "heavy: slower adversarial/E2E tests; still on the default path",
]
