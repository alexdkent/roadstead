[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "roadstead"
version = "0.1.0.dev0"
description = "Capacity-aware admission control for self-hosted LLM inference fleets (llama.cpp + vLLM), without Kubernetes."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Alex Kent" }]
keywords = ["llm", "gateway", "proxy", "inference", "llama.cpp", "vllm", "admission-control", "scheduler"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: Proxy Servers",
]

# Deliberately few. Adding one is a decision, not a convenience — see CLAUDE.md.
dependencies = [
  "httpx>=0.27",
  # The <1.0 upper bound was lifted on 2026-08-31 by migrating build_app from
  # on_startup=/on_shutdown= (removed in Starlette 1.0) to lifespan=. Verified
  # green on both 0.52.1 and 1.6.0: 1066 passed, 1 skipped, each run. Do not
  # re-add a bound without recording what breaks above it.
  "starlette>=0.37",
  "uvicorn>=0.30",
  "PyYAML>=6.0",
  "jsonschema>=4.20",
  "json-repair>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-timeout>=2.3",
]

[project.scripts]
roadstead = "roadstead.__main__:main"

[project.urls]
Repository = "https://github.com/alexdkent/roadstead"

[tool.setuptools.packages.find]
include = ["roadstead*"]

[tool.setuptools.package-data]
# 🚨 `ui/index.html` ships, so it is PUBLIC SURFACE — same argument as
# `roadstead.testing`. It is one static file with no external references (the
# CSP the server sends forbids them, and a test sweeps for them), and nothing in
# the library imports it, so a deployment that never sets ROADSTEAD_ADMIN_UI
# pays only the ~40KB on disk.
roadstead = ["*.yaml", "ui/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# NB: no `norecursedirs` — it was ["_pending"], which silently OVERRODE pytest's
# own defaults (.git, build, dist, *.egg…). The quarantine is gone; leaving the
# key would keep that override for nothing.
asyncio_mode = "auto"
timeout = 60
filterwarnings = ["ignore::DeprecationWarning"]
# `wire_fidelity` needs a real inference engine, so it is deselected by default
# and skips cleanly anyway when none is reachable. Run it with
#   pytest -m wire_fidelity tests/wire_fidelity/
# See tests/wire_fidelity/README.md.
addopts = "-m 'not wire_fidelity'"
markers = [
  "wire_fidelity: needs a REAL inference engine (see tests/wire_fidelity/)",
  # Pre-existing and previously unregistered, which cost 8 PytestUnknownMark
  # warnings on every run. Registering it changes no selection.
  "heavy: slower adversarial/E2E tests; still on the default path",
]
