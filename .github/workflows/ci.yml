name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is what the origin deployment runs; 3.12 guards forward drift.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A future history guard needs commit history to look at, not just
          # the tip — a shallow (default depth-1) checkout would make it pass
          # by having nothing to check.
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Import standalone
        # Proves the sever holds: the package must import with no host application present.
        run: |
          python -c "
          import roadstead.scheduler, roadstead.cost_model, roadstead.timeout_model
          import roadstead.correction, roadstead.lifecycle, roadstead.health
          import roadstead.hooks, roadstead.metrics, roadstead.model_catalog
          print('standalone import OK')
          "

      - name: No host-application imports in the library core
        # __main__.py may carry guarded optional imports; nothing else may.
        run: |
          if grep -rn '^\s*from originfleet\|^\s*import originfleet' roadstead/ \
               --include='*.py' | grep -v '^roadstead/__main__.py'; then
            echo "::error::a library module imports the host application — the sever regressed"
            exit 1
          fi
          echo "library core is clean"

      - name: Scrub sweep
        # Named explicitly, not left to whatever `pytest -q` happens to
        # collect — a future addopts/deselect change that narrows the default
        # run must not be able to silence the one guard standing between this
        # repo and a private topology leak (the scrub rule in CONTRIBUTING.md).
        run: pytest -q --timeout=120 -v tests/test_scrub_sweep.py

      - name: Test
        run: pytest -q --timeout=120

  package:
    # A separate job, not a step on `test`: it proves the artifact an
    # end user actually installs (a built wheel, in a venv that never saw
    # this checkout's editable install) rather than the `pip install -e`
    # environment every other step runs in. `pip install -e` cannot catch a
    # missing package-data entry or an accidentally-excluded module — the
    # editable install reads straight off the source tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
          python -m build --wheel

      - name: Install the wheel into a fresh venv
        run: |
          python -m venv /tmp/roadstead-install-check
          /tmp/roadstead-install-check/bin/pip install --upgrade pip
          /tmp/roadstead-install-check/bin/pip install dist/*.whl

      - name: The installed package imports, runs, and carries its data files
        run: |
          /tmp/roadstead-install-check/bin/python -c "import roadstead, roadstead.client; print('import OK')"
          /tmp/roadstead-install-check/bin/python -m roadstead --help
          # The CONSOLE SCRIPT, not just the module. `[project.scripts]` has
          # declared `roadstead` since the first commit and nothing ever ran
          # it: a broken entry-point path installs cleanly and only fails for
          # the user, who is the one person who invokes it this way.
          /tmp/roadstead-install-check/bin/roadstead --help
          /tmp/roadstead-install-check/bin/python -c "
          import pathlib, roadstead
          root = pathlib.Path(roadstead.__file__).parent
          # py.typed is the PEP 561 marker: EMPTY, so only its presence says
          # anything. Nothing imports it and no test would notice it missing —
          # this assertion is the only thing standing between a package-data
          # edit and every downstream type checker silently seeing Any.
          for rel in ('ui/index.html', 'models.yaml', 'agents.yaml', 'py.typed'):
              path = root / rel
              assert path.exists(), f'missing from the installed wheel: {rel}'
          print('package-data OK')
          "
